<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tounsi Trainer 🇹🇳</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--surface:#1a1612;--surface2:#242018;--border:#3a3228;--gold:#c9a84c;--gold2:#e8c96a;--red:#c94c4c;--green:#4cac6e;--text:#f0e8d8;--muted:#8a7d6a;--blue:#4c7ac9;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
button,input,select,a{touch-action:manipulation;}

body{overscroll-behavior:none;scroll-behavior:smooth;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(201,168,76,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(232,114,58,.05) 0%,transparent 50%);}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.login-box{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,.5);}
.login-flag{font-size:2.5rem;text-align:center;margin-bottom:.5rem;}
.login-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;text-align:center;color:var(--gold2);margin-bottom:.2rem;}
.login-sub{font-size:.85rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:1.8rem;}
.login-label{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.4rem;}
.login-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:.7rem .9rem;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:1rem;outline:none;margin-bottom:1rem;transition:border-color .2s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;background:linear-gradient(135deg,var(--gold),#a07020);border:none;border-radius:6px;padding:.75rem;color:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;margin-bottom:.8rem;}
.login-toggle{text-align:center;font-size:.82rem;color:var(--muted);cursor:pointer;text-decoration:underline;}
.login-error{background:rgba(201,76,76,.12);border:1px solid rgba(201,76,76,.3);border-radius:4px;padding:.5rem .7rem;font-size:.78rem;color:var(--red);margin-bottom:.8rem;text-align:center;}
#app-screen{display:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;gap:.5rem;}
.logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;}
.logo em{color:var(--gold);font-style:italic;}
.logo small{display:block;font-family:'IBM Plex Mono',monospace;font-size:.78rem;opacity:.4;text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
.score-display{display:flex;gap:1.2rem;font-size:.82rem;text-transform:uppercase;letter-spacing:1px;align-items:center;}
.score-item{display:flex;flex-direction:column;align-items:center;gap:.1rem;}
.score-num{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;}
.logout-btn{padding:.35rem .8rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.85rem;text-transform:uppercase;cursor:pointer;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.lesson-bar{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;display:flex;overflow-x:auto;gap:.3rem;padding:.5rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);align-items:center;}
.lesson-bar-label{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap;margin-right:.3rem;}
.lesson-chip{min-height:44px;scroll-snap-align:start;display:inline-flex;align-items:center;padding:.3rem .7rem;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.85rem;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .15s;border-radius:2px;}
.lesson-chip:hover{border-color:var(--gold);color:var(--text);}
.lesson-chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500;}
.mode-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);}
.mode-btn{padding:.65rem 1.1rem;border:none;background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;}
.mode-btn:hover{color:var(--text);}
.mode-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
main{max-width:700px;margin:0 auto;padding:1.5rem 1.2rem 5rem;overflow-anchor:none;}
.exercise-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0 .2rem 0;margin-bottom:.2rem;}
.ex-type{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
.ex-progress{font-size:.78rem;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.progress-bar{display:none;}
.progress-fill{height:100%;background:var(--gold);transition:width .4s ease;}
.q-card{background:var(--surface);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.2rem;position:relative;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35;}
.q-label{font-size:.78rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.7rem;}
.q-arabic{font-size:3.8rem;direction:rtl;font-family:'Playfair Display',serif;font-weight:700;color:var(--gold2);line-height:1.4;}
.q-text{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.4;}
.q-sub{font-size:.78rem;color:var(--muted);margin-top:.3rem;line-height:1.5;letter-spacing:.02em;}
.q-hint{margin-top:.8rem;padding:.5rem .8rem;background:var(--surface2);border-left:2px solid var(--gold);font-size:.78rem;color:var(--muted);display:none;}
.q-hint.visible{display:block;}
.choices{display:flex;flex-direction:column;gap:.5rem;}
.choice-btn{padding:.9rem 1rem;min-height:56px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:.7rem;}
.choice-btn:hover:not(:disabled){border-color:var(--gold);background:var(--surface);}
.choice-btn.correct{border-color:var(--green);background:rgba(76,172,110,.1);color:var(--green);}
.choice-btn.wrong{border-color:var(--red);background:rgba(201,76,76,.1);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.choice-letter{min-width:20px;height:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);}
.choice-btn.correct .choice-letter{border-color:var(--green);color:var(--green);}
.choice-btn.wrong .choice-letter{border-color:var(--red);color:var(--red);}
.answer-input{flex:1;padding:.75rem .9rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:1rem;outline:none;transition:border-color .2s;}
.answer-input:focus{border-color:var(--gold);}
.answer-input.correct{border-color:var(--green);}
.answer-input.wrong{border-color:var(--red);}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.match-col{display:flex;flex-direction:column;gap:.4rem;}
.match-col:last-child .match-item{font-size:.95rem;color:var(--text);}
.match-item.arabic{font-size:2rem;font-family:'Playfair Display',serif;direction:rtl;color:var(--gold2);padding:.9rem .8rem;line-height:1.2;}
.match-item{padding:.8rem;background:var(--surface2);border:1px solid var(--border);font-size:.85rem;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;user-select:none;}
.match-item.arabic{font-size:2rem;direction:rtl;color:var(--gold2);line-height:1.4;padding:.8rem;}
.match-item.selected{border-color:var(--gold);background:rgba(201,168,76,.1);}
.match-item.matched{border-color:var(--green);background:rgba(76,172,110,.1);color:var(--green);cursor:default;opacity:.7;}
.match-item.wrong-flash{border-color:var(--red);background:rgba(201,76,76,.1);}
.word-bank{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem;min-height:40px;direction:rtl;}
.word-chip{padding:.7rem 1.1rem;background:var(--surface2);border:1px solid var(--border);font-size:1.8rem;font-family:'Playfair Display',serif;direction:rtl;color:var(--gold2);cursor:pointer;transition:all .15s;user-select:none;}
.word-chip:hover{border-color:var(--gold);}
.word-chip.used{opacity:.2;cursor:default;pointer-events:none;}
.answer-slots{display:flex;flex-wrap:wrap;gap:.5rem;min-height:56px;padding:.6rem;border:1px dashed var(--border);background:var(--surface2);margin-bottom:.8rem;cursor:pointer;direction:rtl;justify-content:flex-start;}
.answer-slot{padding:.5rem 1rem;background:var(--surface);border:1px solid var(--gold);font-size:1.4rem;font-family:'Playfair Display',serif;direction:rtl;color:var(--gold2);}
.feedback{will-change:opacity,transform;padding:.7rem .9rem;margin-top:.7rem;font-size:.85rem;line-height:1.6;display:none;}
.feedback.show{display:block;}
.feedback.correct{background:rgba(76,172,110,.1);border-left:3px solid var(--green);color:var(--green);}
.feedback.wrong{background:rgba(201,76,76,.1);border-left:3px solid var(--red);color:var(--red);}
.btn-row{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap;}
.btn{padding:.65rem 1.3rem;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:border-color .15s,background .15s;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500;}
.btn.primary:hover{background:var(--gold2);border-color:var(--gold2);}
.btn.ghost{opacity:.55;}
.btn.ghost:hover{opacity:1;}
.conj-table{width:100%;border-collapse:collapse;margin-bottom:1rem;font-size:.85rem;}
.conj-table th{padding:.5rem .8rem;text-align:left;border-bottom:1px solid var(--border);color:var(--gold);font-weight:500;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;}
.conj-table td{padding:.5rem .8rem;border-bottom:1px solid rgba(58,50,40,.5);}
.conj-table tr:last-child td{border-bottom:none;}
.conj-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:1rem;font-size:1rem;padding:.25rem .5rem;outline:none;width:100%;transition:border-color .2s;}
.conj-input:focus{border-color:var(--gold);}
.conj-input.correct{border-color:var(--green);color:var(--green);}
.conj-input.wrong{border-color:var(--red);color:var(--red);}
.grammar-box{background:var(--surface2);border:1px solid var(--border);padding:1rem;margin-bottom:1rem;position:relative;}
.grammar-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.5;}
.grammar-title{font-size:.85rem;text-transform:uppercase;letter-spacing:2px;color:var(--blue);margin-bottom:.6rem;}
.grammar-text{font-size:.85rem;line-height:1.7;color:var(--text);}
.grammar-example{margin-top:.5rem;padding:.4rem .6rem;background:var(--surface);border-left:2px solid var(--blue);font-size:.82rem;color:var(--muted);}
.grammar-example .ar{direction:rtl;color:var(--gold2);font-family:'Playfair Display',serif;}
.speed-card{text-align:center;padding:1.5rem 1rem;}
.speed-timer{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold);line-height:1;}
.speed-bar{height:4px;background:var(--border);margin:1rem 0;border-radius:2px;}
.speed-fill{height:100%;background:var(--gold);transition:width 1s linear;border-radius:2px;}
.speed-word{font-family:'Playfair Display',serif;font-size:3.8rem;direction:rtl;color:var(--gold2);margin:1rem 0 .3rem;line-height:1.3;}
.speed-btns{display:flex;gap:.8rem;justify-content:center;margin-top:1.2rem;}
.speed-btn{padding:.7rem 2rem;border:1px solid;font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.speed-btn.yes{background:rgba(76,172,110,.1);border-color:var(--green);color:var(--green);}
.speed-btn.yes:hover{background:rgba(76,172,110,.25);}
.speed-btn.no{background:rgba(201,76,76,.1);border-color:var(--red);color:var(--red);}
.speed-btn.no:hover{background:rgba(201,76,76,.25);}
.chat{max-height:260px;overflow-y:auto;padding:.5rem 0;margin-bottom:.8rem;}
.chat-bubble{padding:.7rem 1rem;margin-bottom:.5rem;font-size:.82rem;line-height:1.5;max-width:85%;}
.chat-bubble.vendor{background:var(--surface2);border:1px solid var(--border);border-radius:0 8px 8px 8px;margin-right:auto;}
.chat-bubble.user{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);border-radius:8px 0 8px 8px;margin-left:auto;text-align:right;}
.chat-bubble .arabic{direction:rtl;font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold2);}
.chat-bubble .transl{font-size:.78rem;color:var(--muted);margin-top:.2rem;}
.chat-options{display:flex;flex-direction:column;gap:.4rem;margin-bottom:4rem;}
.chat-opt{padding:.9rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-align:right;cursor:pointer;transition:border-color .15s;min-height:56px;}
.chat-opt:hover:not(:disabled){border-color:var(--gold);}
.chat-opt.correct{border-color:var(--green);background:rgba(76,172,110,.1);}
.chat-opt.wrong{border-color:var(--red);background:rgba(201,76,76,.1);}
.chat-opt:disabled{cursor:default;}
.lesson-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);font-size:.85rem;color:var(--gold);margin-bottom:.8rem;}
#result-screen{display:none;position:fixed;inset:0;background:rgba(14,12,10,.95);z-index:100;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;}
#result-screen.show{display:flex;}
.result-pct{font-family:'Playfair Display',serif;font-size:5rem;font-weight:900;color:var(--gold);line-height:1;}
.result-msg{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--text);margin:.5rem 0;}
.result-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.8;}
.update-notice{background:rgba(76,172,110,.08);border:1px solid rgba(76,172,110,.3);padding:.6rem 1rem;font-size:.82rem;color:var(--green);}

.sticky-next{position:fixed;bottom:0;left:0;right:0;padding-bottom:max(env(safe-area-inset-bottom,0px),12px);padding:.75rem 1rem;background:var(--surface);border-top:1px solid var(--border);z-index:80;display:none;}
.sticky-next.show{display:block;}
.sticky-next-inner{max-width:700px;margin:0 auto;}
.sticky-next-btn{width:100%;padding:.85rem;border:none;background:var(--gold);color:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;}
.sticky-next-btn:hover{background:var(--gold2);}

.nav-strip{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:.5rem;}
.nav-left{display:flex;align-items:center;gap:.8rem;min-width:0;flex:1;}
.nav-logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:900;white-space:nowrap;}
.nav-logo em{color:var(--gold);font-style:italic;}
.nav-context{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.nav-context-text{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-progress-bar{height:2px;background:var(--border);border-radius:1px;}
.nav-progress-fill{height:100%;background:var(--gold);border-radius:1px;transition:width .4s ease;}
.nav-right{display:flex;align-items:center;gap:.7rem;flex-shrink:0;}
.nav-score{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;}
.nav-toggle{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:.3rem .6rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;transition:all .15s;}
.nav-toggle.open{color:var(--gold);border-color:var(--gold);}
.nav-panel{display:none;background:var(--bg);border-bottom:1px solid var(--border);padding:1rem;}
.nav-panel.open{display:block;}
.nav-section-label{font-size:.78rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.5rem;}
.nav-chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem;}
.nav-footer{display:flex;align-items:center;justify-content:space-between;padding-top:.5rem;border-top:1px solid var(--border);}
.nav-user{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.sticky-check{position:fixed;bottom:0;left:0;right:0;padding:.75rem 1rem;background:var(--surface);border-top:1px solid var(--border);z-index:80;}
.sticky-check-inner{max-width:700px;margin:0 auto;display:flex;gap:.6rem;}
.sticky-check-btn{flex:1;padding:.85rem;border:none;background:var(--gold);color:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;}
.sticky-check-btn:hover{background:var(--gold2);}
.sticky-check-ghost{flex:0 0 auto;padding:.85rem 1.2rem;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;}

@media(max-width:380px){
  .logo{font-size:1.1rem;}
  .score-num{font-size:1.3rem;}
  .q-arabic{font-size:3rem;}
  .match-item.arabic{font-size:1.6rem;}
  .word-chip{font-size:1.5rem;}
}

/* Lateinisch immer kleiner als arabisch */
.q-sub{font-size:.78rem !important;color:var(--muted);opacity:.85;}
.transl{font-size:.75rem !important;color:var(--muted);opacity:.85;line-height:1.4;}
.chat-bubble .transl{font-size:.72rem !important;}
.match-col:last-child .match-item{font-size:.88rem;}
/* Arabische Schrift mehr Luft */
[dir="rtl"],[style*="direction:rtl"]{line-height:1.5;}
/* Keine Textauswahl auf Buttons */
.choice-btn,.match-item,.word-chip,.chat-opt,.lesson-chip,.mode-btn{user-select:none;-webkit-user-select:none;}
/* Bessere Tap-Größe */
.choice-btn{min-height:56px;}
.match-item{min-height:52px;}
/* Media query kleine Bildschirme */
@media(max-width:360px){
  .q-arabic{font-size:3rem;}
  .match-item.arabic{font-size:1.5rem;}
  .word-chip{font-size:1.5rem;}
  .score-num{font-size:1.2rem;}
}

/* Lateinisch ausblenden */
body.hide-latin .q-sub,
body.hide-latin .transl,
body.hide-latin [data-latin],
body.hide-latin .choice-btn .latin,
body.hide-latin .match-item .latin,
body.hide-latin .word-chip .latin,
body.hide-latin .chat-opt .latin {
  display:none !important;
}

.srs-info-badge{font-size:.68rem;color:var(--muted);margin-top:.25rem;margin-bottom:.5rem;letter-spacing:.01em;line-height:1.4;}

/* Flash-Karte: arabisches Wort bleibt oben sichtbar wenn Tastatur aufgeht */
.flash-sticky-top{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bg);
  padding-bottom:.3rem;
}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-flag">&#127481;&#127475;</div>
    <div class="login-title">Tounsi Trainer</div>
    <div class="login-sub">Tunesisches Arabisch &middot; v8</div>
    <div id="login-error" class="login-error" style="display:none"></div>
    <div class="login-label">Nutzername</div>
    <input class="login-input" id="login-username" placeholder="dein Name" autocomplete="username" />
    <div class="login-label">Passwort</div>
    <input class="login-input" id="login-password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" />
    <button class="login-btn" id="login-btn" onclick="doLogin()">Anmelden</button>
    <div class="login-toggle" id="login-toggle" onclick="toggleRegister()">Noch kein Konto? Registrieren &rarr;</div>
  </div>
</div>
<div id="app-screen">
<!-- ── Kompakte Navigationsleiste ── -->
<div class="nav-strip" id="nav-strip">
  <div class="nav-left">
    <div class="nav-logo">Tounsi <em>Trainer</em></div>
    <div class="nav-context">

<script>


function normalize(s){
  if(!s)return'';
  s=s.trim().toLowerCase();
  // Diakritische Zeichen
  s=s.replace(/[éèêë]/g,'e').replace(/[àâäå]/g,'a');
  s=s.replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûüùú]/g,'u');
  s=s.replace(/ñ/g,'n').replace(/ç/g,'c');
  // Deutsche Tastatur-Ersatz: ae→ä→a, oe→ö→o, ue→ü→u, ß→ss
  s=s.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
  s=s.replace(/ß/g,'ss');
  // Arabische Umschrift
  s=s.replace(/ʿ/g,'3').replace(/ħ/g,'7').replace(/ʔ/g,'').replace(/2/g,'');
  // Konsonanten-Varianten (Reihenfolge wichtig: längere zuerst)
  s=s.replace(/sch/g,'sh').replace(/kh/g,'x').replace(/ch/g,'x');
  s=s.replace(/gh/g,'g').replace(/dh/g,'d').replace(/th/g,'t');
  s=s.replace(/tj/g,'j').replace(/dj/g,'j'); // dj→j
  s=s.replace(/q/g,'k');
  // Artikel
  s=s.replace(/\bel[\-\s]/g,'el ').replace(/\bal[\-\s]/g,'el ');
  // Vokal-Varianten
  s=s.replace(/oo/g,'u').replace(/ou/g,'u').replace(/ey/g,'i').replace(/ei/g,'i');
  // y am Wortende → i (3andy→3andi)
  s=s.replace(/y$/g,'i').replace(/y(\s)/g,'i$1');
  // Doppelkonsonanten → einfach (kaddesh→kadesh)
  s=s.replace(/([bcdfghjklmnpqrstvwxz])\1/g,'$1');
  // Klammern entfernen (m.) (f.) etc.
  s=s.replace(/\([^)]*\)/g,'');
  // Satzzeichen + Bindestrich
  s=s.replace(/-/g,'').replace(/[?!.,;:\u2014\u2013()"\u00ab\u00bb]/g,'');
  // 7→h, 3→leer (nach allen anderen Ersetzungen)
  s=s.replace(/7/g,'h').replace(/3/g,'');
  // Alle Leerzeichen entfernen
  s=s.replace(/\s/g,'');
  return s;
}

function levenshtein(a, b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)
    for(let j=1;j<=n;j++)
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function checkAnswer(input, answer){
  const n = normalize(input);
  const variants = answer.split(/\s*\/\s*/).map(v => normalize(v.trim())).filter(v=>v!=='');
  // Exakter Match
  if(variants.some(v => n === v)) return {ok:true, exact:true, correct:answer};
  // Fuzzy: 1 Buchstabe Toleranz ab 5 Zeichen
  const best = variants.reduce((b,v)=>{
    const d=levenshtein(n,v);
    return d<b.dist?{dist:d,v}:b;
  },{dist:99,v:''});
  if(best.dist===1 && n.length>=5){
    return {ok:true, exact:false, correct:answer};
  }
  return {ok:false, exact:false, correct:answer};
}

// ══ SRS — Spaced Repetition (Tage-basiert, Supabase) ════════════════════════
const SRS_DAYS = [1, 3, 7, 14, 30, 90]; // Tage pro Level 0-5
let srsProgress = {}; // {darija_tr: {id, level, next_review, vocabulary_id}}
let vocabIdMap = {};  // {darija_tr: vocabulary_id}

function srsKey(v){ return v.tr; }

async function srsLoadFromSupabase(){
  if(!currentUser) return;
  try{
    // Lade alle Vokabeln aus Supabase inkl. Lektion und Thema
    let allVocab = [];
    let offset = 0;
    const batchSize = 100;
    while(true){
      const batch = await sbApi(
        'vocabulary?select=id,darija,arabic_script,german,topic,lessons(lesson_number)' +
        '&order=id.asc&limit='+batchSize+'&offset='+offset
      );
      if(!batch || batch.length === 0) break;
      allVocab = allVocab.concat(batch);
      if(batch.length < batchSize) break;
      offset += batchSize;
    }
    // vocabIdMap befüllen
    allVocab.forEach(v => { vocabIdMap[v.darija] = v.id; });
    dbg('Geladen: ' + allVocab.length + ' Vokabeln', 'ok');

    // ALL_VOCAB aus Supabase befüllen (dauerhaft, überschreibt hardcoded)
    ALL_VOCAB.length = 0;
    allVocab.forEach(v => {
      const ls = v.lessons ? 'L' + v.lessons.lesson_number : 'L1';
      const tp = v.topic || 'Allgemein';
      ALL_VOCAB.push({ ar: v.arabic_script||'', tr: v.darija||'', en: v.german||'', ls, tp });
    });
    dbg('ALL_VOCAB: ' + ALL_VOCAB.length + ' Einträge', 'ok');

    // Lade progress des Nutzers
    const progress = await sbApi(
      'progress?user_id=eq.'+currentUser.id+'&select=id,vocabulary_id,correct_count,wrong_count,next_review,last_reviewed,last_correct'
    );
    progress.forEach(p => {
      const level = Math.min(p.correct_count, 5);
      srsProgress[p.vocabulary_id] = {
        id: p.id,
        vocabulary_id: p.vocabulary_id,
        level: level,
        next_review: p.next_review ? new Date(p.next_review) : new Date(0),
        last_reviewed: p.last_reviewed ? new Date(p.last_reviewed) : null,
        last_correct: p.last_correct ? new Date(p.last_correct) : null,
      };
    });
    const vmSize = Object.keys(vocabIdMap).length;
    const spSize = Object.keys(srsProgress).length;
    dbg('vocabIdMap: ' + vmSize + ' Einträge', vmSize > 0 ? 'ok' : 'err');
    dbg('progress: ' + spSize + ' Einträge', 'ok');
    if(vmSize > 0){
      const k = Object.keys(vocabIdMap)[0];
      dbg('Beispiel: "' + k + '" → id ' + vocabIdMap[k], 'ok');
    }
  } catch(e){
    dbg('FEHLER load: ' + e.message, 'err');
  }
}

async function srsAnswer(vocab, correct){
  dbg('srsAnswer START user='+(currentUser?'ok':'null')+' vocab='+vocab.tr, 'ok');
  if(!currentUser){ dbg('FEHLER: kein User', 'err'); return; }
  const vocabId = vocabIdMap[vocab.tr];
  dbg('vocabId=' + vocabId + (correct?' ✓':' ✗'), vocabId ? (correct?'ok':'err') : 'err');
  if(!vocabId){
    // Zeige erste 3 Keys aus vocabIdMap zum Vergleich
    const keys = Object.keys(vocabIdMap).slice(0,3);
    dbg('Erste Keys: ' + keys.join(', '), 'err');
    dbg('FEHLER: keine id für "' + vocab.tr + '"', 'err');
    return;
  }

  const existing = srsProgress[vocabId];
  let level = existing ? existing.level : 0;

  if(correct){
    // Level steigt nur wenn fällig (Pause eingehalten)
    const wasDue = !existing || !existing.next_review || new Date() >= new Date(existing.next_review);
    if(wasDue) level = Math.min(level + 1, 5);
  } else {
    // Falsch: Level sinkt immer
    level = Math.max(level - 1, 0);
  }

  // next_review: nur setzen wenn fällig war oder falsch
  const wasDueForNext = !existing || !existing.next_review || new Date() >= new Date(existing.next_review);
  const nextReview = new Date();
  if(wasDueForNext || !correct){
    nextReview.setDate(nextReview.getDate() + SRS_DAYS[level]);
  } else {
    // Nicht fällig + richtig: next_review unverändert lassen
    const keepDate = existing.next_review ? new Date(existing.next_review) : nextReview;
    nextReview.setTime(keepDate.getTime());
  }

  const data = {
    user_id: currentUser.id,
    vocabulary_id: vocabId,
    correct_count: correct ? level : Math.max(0, level),
    wrong_count: correct ? 0 : 1,
    next_review: nextReview.toISOString(),
    last_reviewed: new Date().toISOString(),
    last_correct: correct ? new Date().toISOString() : null,
  };

  try{
    if(existing && existing.id){
      dbg('PATCH progress id='+existing.id, 'ok');
      await sbApi('progress?id=eq.'+existing.id, 'PATCH', {
        correct_count: data.correct_count,
        next_review: data.next_review,
        last_reviewed: new Date().toISOString(),
        last_correct: correct ? new Date().toISOString() : (existing.last_correct ? existing.last_correct.toISOString() : null),
      });
      srsProgress[vocabId].level = level;
      srsProgress[vocabId].next_review = nextReview;
      srsProgress[vocabId].last_reviewed = new Date();
      if(correct) srsProgress[vocabId].last_correct = new Date();
      dbg('✓ PATCH gespeichert level='+level, 'ok');
    } else {
      dbg('POST progress vocab='+vocabId, 'ok');
      const res = await sbApi('progress', 'POST', data);
      if(res && res[0]){
        dbg('✓ POST gespeichert id='+res[0].id+' level='+level, 'ok');
        srsProgress[vocabId] = {
          id: res[0].id,
          vocabulary_id: vocabId,
          level: level,
          next_review: nextReview,
          last_reviewed: new Date(),
          last_correct: correct ? new Date() : null,
        };
      }
    }
  } catch(e){
    dbg('FEHLER save: ' + e.message, 'err');
  }
}

function srsGetLevel(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return 0;
  const p = srsProgress[vocabId];
  return p ? p.level : 0;
}

function srsIsDue(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return true; // Neu → fällig
  const p = srsProgress[vocabId];
  if(!p) return true; // Noch nie gesehen → fällig
  return new Date() >= new Date(p.next_review);
}

function srsDaysUntil(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return 0;
  const p = srsProgress[vocabId];
  if(!p) return 0;
  const diff = new Date(p.next_review) - new Date();
  return Math.max(0, Math.ceil(diff / (1000*60*60*24)));
}

function buildSrsQueue(vocab){
  // NUR fällige Vokabeln — nicht fällige werden nicht vorgeschlagen
  const due = vocab.filter(v => srsIsDue(v));
  due.sort((a,b) => {
    const la = srsGetLevel(a), lb = srsGetLevel(b);
    return la !== lb ? la - lb : Math.random() - .5;
  });
  return due;
}

function countDueToday(lessonVocab){
  return lessonVocab.filter(v => srsIsDue(v)).length;
}

function updateLessonChips(){
  const chips = document.querySelectorAll('.lesson-chip');
  chips.forEach(chip => {
    const ls = chip.getAttribute('data-ls');
    if(!ls || ls === 'all') return;
    const lessonVocab = ALL_VOCAB.filter(v => {
      if(ls === 'L5fruit') return v.ls==='L5' && v.tp==='Obst';

      if(ls === 'L7color') return v.ls==='L7' && v.tp==='Farben';
      if(ls === 'L4currency') return v.ls==='L4' && v.tp==='Währung';
    if(ls === 'L9past') return v.ls==='L9' && v.tp==='Vergangenheit';
    if(ls === 'L2nat') return v.ls==='L2' && v.tp==='Nationalitäten';
    if(ls === 'L2num') return v.ls==='L2' && v.tp==='Zahlen';
    if(ls === 'L10months') return v.ls==='L10' && v.tp==='Monate';
      return v.ls === ls;
    });
    const due = countDueToday(lessonVocab);
    // Entferne alten Badge
    const oldBadge = chip.querySelector('.due-badge');
    if(oldBadge) oldBadge.remove();
    if(due > 0){
      const badge = document.createElement('span');
      badge.className = 'due-badge';
      badge.textContent = due;
      badge.style.cssText = 'margin-left:4px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-size:.55rem;vertical-align:middle;';
      chip.appendChild(badge);
    }
  });
}

function doLogout(){
  currentUser=null;

  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-password').value='';
  document.getElementById('login-btn').textContent='Anmelden';
  document.getElementById('login-btn').disabled=false;
}

// SRS: Spaced Repetition State
let srsLevels={};  // {vocabKey: level 0-5}
let srsQueue=[];   // Aktive Lernqueue mit {vocab, dueIn} Objekten
const SRS_INTERVALS=[1,3,7,15,30,999]; // Wiederholung nach N anderen Karten

function srsKey(v){return v.ls+'_'+v.ar;}



function buildSrsQueue(vocab){
  // Sortiere: niedrigeres Level zuerst, dann zufällig innerhalb gleichen Levels
  return [...vocab].sort((a,b)=>{
    const la=srsLevels[srsKey(a)]||0;
    const lb=srsLevels[srsKey(b)]||0;
    if(la!==lb)return la-lb;
    return Math.random()-.5;
  });
}

function interleaveSrs(vocab){
  // Baut Queue mit SRS-Wiederholungslogik
  // Karten die falsch beantwortet wurden kommen nach SRS_INTERVALS[level] Karten wieder
  const initial=buildSrsQueue(vocab);
  const result=[];
  const pending=[]; // {vocab, insertAt}
  let pos=0;
  for(const v of initial){
    // Füge fällige pending-Karten ein
    while(pending.length&&pending[0].insertAt<=pos){
      result.push({type:'mc',v:pending.shift().vocab,srs:true});
      pos++;
    }
    result.push({type:'mc',v,srs:true});
    pos++;
  }
  // Reste aus pending anhängen
  for(const p of pending) result.push({type:'mc',v:p.vocab,srs:true});
  return result;
}

function timeAgo(date){
  if(!date) return '—';
  const diff = Math.floor((Date.now()-date.getTime())/86400000);
  if(diff===0) return 'heute';
  if(diff===1) return 'gestern';
  return diff+'T';
}
function srsInfoBadge(vocab){
  if(!vocab || !vocab.tr) return '';
  const vocabId = vocabIdMap[vocab.tr];
  const p = vocabId ? srsProgress[vocabId] : null;
  const level = p ? (p.level||0) : 0;
  const filled = '⭐'.repeat(level);
  const empty = '<span style="opacity:.2">⭐</span>'.repeat(5-level);
  const reviewed = (p && p.last_reviewed) ? timeAgo(p.last_reviewed) : '—';
  const correct = (p && p.last_correct) ? timeAgo(p.last_correct) : '—';
  const lvlColor = ['#888','#e8a045','#c9a84c','#4cac6e','#4c8aac','#8a4cac'][level];
  return `<div class="srs-info-badge">${filled}${empty} <span style="color:${lvlColor};font-size:.65rem;margin-left:.2rem">L${level}</span> &nbsp;·&nbsp; 📅 ${reviewed} &nbsp;·&nbsp; ✓ ${correct}</div>`;
}

  _dueQueue = buildSrsQueue(gv());

  else if(cMode==='match')exList=bMatch(v);

  else if(cMode==='conj'){exList=bConj();if(!exList.length){showNoContent('Konjugation');return;}}

  else if(cMode==='roleplay'){exList=bRP();if(!exList.length){showNoContent('Roleplay');return;}}
  else if(cMode==='grammar'){exList=bGram();if(!exList.length){showNoContent('Grammatik');return;}}
  else if(cMode==='flash')exList=bFlash(v);

  else if(cMode==='speed')exList=[{type:'speed'}];
  else if(cMode==='mix'){const _f=bFill(),_o=bOrder(),_c=bConj(),_r=bRP();exList=sh([...bMC(v).slice(0,4),...bFlash(v).slice(0,3),...bMatch(v).slice(0,2),..._f.slice(0,2),..._o.slice(0,2),..._c.slice(0,1),..._r.slice(0,1)]);}
  cIdx=0;
  if(!exList.length){
    showNothingDue();
    return;
  }
  render();
}
function nxt(){
  // Erledigte Vokabel aus exList entfernen
  exList.splice(cIdx, 1);
  // Alle 10 erledigten in dieser Runde: Zwischenmeldung
  _roundDone++;
  // Zwischenmeldung nur bei Einzelvokabel-Modi (nicht Match/Roleplay/Grammar)
  const _singleModes = ['mc','flash','fill','conj','order'];
  if(_singleModes.includes(cMode) && _roundDone % 10 === 0 && exList.length > 0){
    showMidRes();
    return;
  }
  if(cIdx >= exList.length){
    if(cMode==='speed') return;
    showRes();
  } else {
    render();
    window.scrollTo({top:0,behavior:'instant'});
  }
}
function render(){
  const ex=exList[cIdx];answered=false;
  hideStickyNext();
  hideStickyCheck();

  const _modeLabels = {mc:'🎯 MC',mix:'🎲 Mix',match:'🔗 Matching',fill:'✏️ Lückentext',
    conj:'📐 Konjugation',order:'🔀 Wortfolge',roleplay:'🛒 Roleplay',
    grammar:'📖 Grammatik',speed:'⚡ Speed',flash:'🃏 Karten'};
  const _lbl = document.getElementById('ex-type-label');
  if(_lbl) _lbl.textContent = _modeLabels[cMode] || cMode;
  try{window.scrollTo({top:0,behavior:'instant'});}catch(e){window.scrollTo(0,0);}
  const pct=exList.length>1?Math.round(cIdx/exList.length*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  // Counter immer sichtbar halten
  const _total = exList.length;
  const _cur = cIdx + 1;
  document.getElementById('ex-progress').textContent = _cur + ' / ' + _total;
  document.getElementById('ex-progress').style.display = 'inline';
  const c=document.getElementById('exercise-content');c.innerHTML='';
  if(ex.type==='mc')rMC(ex,c);
  else if(ex.type==='match')rMatch(ex,c);
  else if(ex.type==='fill')rFill(ex,c);
  else if(ex.type==='conj')rConj(ex,c);
  else if(ex.type==='order')rOrder(ex,c);
  else if(ex.type==='flash')rFlash(ex,c);
  else if(ex.type==='roleplay')rRP(ex.data,c);
  else if(ex.type==='grammar')rGram(ex.data,c);
  else if(ex.type==='speed')startSpeed();

function selM(side,id){
  if(mState.matched.includes(id))return;

  else{if(mState.selR){const p=document.getElementById('mr-'+ek(mState.selR));if(p)p.classList.remove('selected');}mState.selR=id;const e=document.getElementById('mr-'+k);if(e)e.classList.add('selected');}
  if(mState.selL&&mState.selR){
    const lE=document.getElementById('ml-'+ek(mState.selL)),rE=document.getElementById('mr-'+ek(mState.selR));

      if(lE){lE.classList.remove('selected');lE.classList.add('matched');}if(rE){rE.classList.remove('selected');rE.classList.add('matched');}
      mState.matched.push(mState.selL);score.c++;score.st++;score.t++;updScore();mState.selL=null;mState.selR=null;

  }
}

function openVocabEdit(tr, i){
  document.getElementById('vedit-'+i).style.display = '';
  // tr als Identifier speichern für saveVocabEdit
  document.getElementById('vedit-'+i).dataset.tr = decodeURIComponent(tr);
}

function closeVocabEdit(i){
  document.getElementById('vedit-'+i).style.display = 'none';
}

async function saveVocabEdit(vIdx, i){
  // tr aus dataset (gesetzt von openVocabEdit)
  const editRow = document.getElementById('vedit-'+i);
  const tr = editRow ? editRow.dataset.tr : null;
  const v = tr ? ALL_VOCAB.find(x=>x.tr===tr) : ALL_VOCAB[vIdx];
  if(!v) return;
  const newAr = document.getElementById('ei-ar-'+i).value.trim();
  const newTr = document.getElementById('ei-tr-'+i).value.trim();
  const newEn = document.getElementById('ei-en-'+i).value.trim();
  if(!newAr || !newTr || !newEn){ alert('Alle Felder ausfüllen'); return; }

  // Lokal aktualisieren
  const oldTr = v.tr;
  v.ar = newAr;
  v.tr = newTr;
  v.en = newEn;

  // Supabase aktualisieren (wenn vocabId bekannt)
  const vocabId = vocabIdMap[oldTr];
  if(vocabId){
    try{
      await sbApi('vocabulary?id=eq.'+vocabId, 'PATCH', {
        arabic_script: newAr,
        darija: newTr,
        german: newEn,
      });
      // vocabIdMap aktualisieren wenn tr geändert
      if(newTr !== oldTr){
        vocabIdMap[newTr] = vocabIdMap[oldTr];
        delete vocabIdMap[oldTr];
      }
      // Zeile aktualisieren
      closeVocabEdit(i);
      filterVocabList();
      dbg('Vokabel gespeichert: '+newTr, 'ok');
    } catch(e){
      alert('Fehler: ' + e.message);
    }
  } else {
    closeVocabEdit(i);
    filterVocabList();
  }
}

            style="width:100%;direction:rtl;font-family:'Playfair Display',serif;font-size:1.4rem;padding:.7rem 1rem;background:var(--surface2);border:1px solid var(--border);color:var(--gold2);border-radius:6px"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
        </div>
        <div>
          <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">Transliteration</div>
          <input id="nv-tr" type="text" placeholder="z.B. kteb"
            style="width:100%;padding:.7rem 1rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.95rem"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
        </div>
        <div>
          <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">Deutsch</div>
          <input id="nv-en" type="text" placeholder="z.B. Buch"
            style="width:100%;padding:.7rem 1rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.95rem"/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
          <div>
            <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">Lektion</div>
            <select id="nv-ls" style="width:100%;padding:.7rem .5rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.9rem">
              ${lessonOptions}
            </select>
          </div>
          <div>
            <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem">Thema</div>
            <input id="nv-tp" type="text" placeholder="z.B. Essen"
              style="width:100%;padding:.7rem .5rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.9rem"/>
          </div>
        </div>
        <button onclick="saveNewVocab()" style="width:100%;padding:.9rem;background:linear-gradient(135deg,var(--gold),#a07020);border:none;color:#0e0c0a;font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:700;cursor:pointer;border-radius:6px;letter-spacing:.05em;margin-top:.3rem">
          ➕ Speichern
        </button>
        <div id="nv-feedback" style="font-size:.82rem;text-align:center;min-height:1.2rem"></div>
      </div>
    </div>
  `;
}

async function saveNewVocab(){
  const ar = document.getElementById('nv-ar').value.trim();
  const tr = document.getElementById('nv-tr').value.trim();
  const en = document.getElementById('nv-en').value.trim();
  const ls = document.getElementById('nv-ls').value;
  const tp = document.getElementById('nv-tp').value.trim() || 'Allgemein';
  const fb = document.getElementById('nv-feedback');

  if(!ar || !tr || !en){ fb.style.color='var(--red)'; fb.textContent='Alle Felder ausfüllen (außer Thema)'; return; }

  // Doppelt prüfen
  if(ALL_VOCAB.find(v=>v.tr===tr)){ fb.style.color='var(--red)'; fb.textContent='Transliteration bereits vorhanden: '+tr; return; }

  fb.style.color='var(--muted)'; fb.textContent='Speichern...';

  try{
    // Lektion-ID aus Supabase
    const lsNum = parseInt(ls.replace('L',''));
    const lessons = await sbApi('lessons?lesson_number=eq.'+lsNum+'&select=id');
    if(!lessons || !lessons.length) throw new Error('Lektion '+ls+' nicht gefunden');
    const lessonId = lessons[0].id;

    // In Supabase einfügen
    const res = await sbApi('vocabulary', 'POST', {
      lesson_id: lessonId,
      arabic_script: ar,
      darija: tr,
      german: en,
      topic: tp,
    });

    if(res && res.length){
      // Lokal hinzufügen
      const newVocab = { ar, tr, en, ls, tp };
      ALL_VOCAB.push(newVocab);
      vocabIdMap[tr] = res[0].id;

      fb.style.color='var(--green)'; fb.textContent='✓ Gespeichert: '+tr;

      // Felder leeren für nächste Eingabe
      document.getElementById('nv-ar').value='';
      document.getElementById('nv-tr').value='';
      document.getElementById('nv-en').value='';
      document.getElementById('nv-tp').value='';
      document.getElementById('nv-ar').focus();
    }
  } catch(e){
    fb.style.color='var(--red)'; fb.textContent='Fehler: '+e.message;
  }
}

function showMidRes(){
  const pct = score.t > 0 ? Math.round(score.c / score.t * 100) : 0;
  const remaining = exList.length;
  const msgs = pct>=80
    ? ['مْلِيح بَرشَة 👏', 'زِين! Zin!', 'هَكَّة نَعرَف!']
    : ['شْوَيَّة شْوَيَّة...', 'عَاوِد مَرَّة أُخرى!', 'مَا يَهمَّش!'];
  const msg = msgs[Math.floor(Math.random()*msgs.length)];

  const area = document.getElementById('exercise-area');
  if(area) area.style.display = 'block';
  const c = document.getElementById('exercise-content');
  c.innerHTML = `
    <div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:2.5rem;margin-bottom:.8rem">${pct>=80?'🌟':'💪'}</div>
      <div style="color:var(--gold2);font-size:1.3rem;font-weight:700;margin-bottom:.4rem">${msg}</div>
      <div style="color:var(--muted);font-size:.85rem;margin-bottom:1.5rem">
        <span style="color:var(--green)">✓ ${score.c} richtig</span> &nbsp;·&nbsp;
        <span style="color:var(--red)">✗ ${score.w} falsch</span>
      </div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:1.5rem">
        Noch <strong style="color:var(--gold)">${remaining}</strong> Vokabeln fällig
      </div>
      <button onclick="continueRound()" style="width:100%;padding:.9rem;background:linear-gradient(135deg,var(--gold),#a07020);border:none;color:#0e0c0a;font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:700;cursor:pointer;border-radius:6px;letter-spacing:.05em">
        Weiter →
      </button>
    </div>
  `;
  document.getElementById('ex-type-label').textContent = '⏸ Pause';
  document.getElementById('ex-progress').textContent = '';
  const sticky = document.getElementById('sticky-next');
  if(sticky) sticky.classList.remove('show');
}

function continueRound(){
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function restartExercise(){document.getElementById('result-screen').classList.remove('show');go();}
function closeResult(){document.getElementById('result-screen').classList.remove('show');}

</script>
