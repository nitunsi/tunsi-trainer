// ── Sticky Next ───────────────────────────────────────────────────────────
let _stickyNextFn = null;

function showStickyCheck(primaryLabel, primaryFn, ghostLabel, ghostFn){
  const el = document.getElementById('sticky-check');
  const inner = document.getElementById('sticky-check-inner');
  inner.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'sticky-check-btn';
  btn.textContent = primaryLabel;
  btn.onclick = () => { hideStickyCheck(); primaryFn(); };
  inner.appendChild(btn);
  if(ghostLabel && ghostFn){
    const gb = document.createElement('button');
    gb.className = 'sticky-check-ghost';
    gb.textContent = ghostLabel;
    gb.onclick = ghostFn;
    inner.appendChild(gb);
  }
  el.style.display = 'block';
}
function hideStickyCheck(){
  const sc=document.getElementById('sticky-check');
  if(sc) sc.style.display = 'none';
}
function showStickyNext(fn){
  _stickyNextFn = fn || nxt;
  const el = document.getElementById('sticky-next');
  el.style.display = '';
  el.classList.add('show');
}
function hideStickyNext(){
  document.getElementById('sticky-next').classList.remove('show');
}
function stickyNext(){
  hideFlashActionBar();
  // Snapshot + sofortige Aktion — fn wird NICHT vor Aufruf gelöscht
  const fn = _stickyNextFn || nxt;
  document.getElementById('sticky-next').classList.remove('show');

  const _inner = document.getElementById('sticky-next-inner');
  if(_inner) _inner.innerHTML = '<button class="sticky-next-btn" id="sticky-next-btn" onclick="stickyNext()">Weiter →</button>';
  fn();
}

let showOnlyFlagged = false;
let vocabLevelFilter = 'all'; // 'all' | 0..5
let vocabTopicFilter = 'all';
let vocabLsFilter = 'all';
let vocabPsFilter = 'all';
let vocabSinceDays = null; // z.B. 7 = "nur status_updated_at innerhalb der letzten 7 Tage"
const selectedVocabIds = new Set();

function toggleFlagFilter(){
  showOnlyFlagged = !showOnlyFlagged;
  const btn = document.getElementById('flag-filter-btn');
  if(btn){ btn.textContent = showOnlyFlagged ? '🚩 Markierte' : '🏳️ Alle'; btn.style.color = showOnlyFlagged ? 'var(--gold)' : 'var(--muted)'; btn.style.borderColor = showOnlyFlagged ? 'var(--gold)' : 'var(--border)'; }
  filterVocabList();
}

function setLevelFilter(val){
  vocabLevelFilter = val === 'all' ? 'all' : parseInt(val);
  filterVocabList();
}

function clearDueFilter(){
  const inp = document.getElementById('due-until-filter');
  if(inp){ inp.value = ''; }
  filterVocabList();
}

function filterVocabList(){
  const _vs = document.getElementById('vocab-search');
  if(!_vs) return;
  const q = _vs.value.trim().toLowerCase();
  const dueUntilEl = document.getElementById('due-until-filter');
  const dueUntil = dueUntilEl && dueUntilEl.value ? new Date(dueUntilEl.value + 'T23:59:59') : null;

  let vocab = cLesson==='all' ? ALL_VOCAB : gv();
  if(showOnlyFlagged) vocab = vocab.filter(v => flaggedVocab.has(v.tr));

  // Level-Filter
  if(vocabLevelFilter !== 'all'){
    vocab = vocab.filter(v => {
      const p = srsProgress[v.id];
      const lvl = p ? p.level : 0;
      return lvl === vocabLevelFilter;
    });
  }

  // Topic-Filter
  if(vocabTopicFilter !== 'all') vocab = vocab.filter(v => (v.tp||'–') === vocabTopicFilter);

  // Lektion-Filter
  if(vocabLsFilter !== 'all') vocab = vocab.filter(v => v.ls === vocabLsFilter);

  // Partner-Status-Filter
  if(vocabPsFilter !== 'all'){
    if(vocabPsFilter === 'null') vocab = vocab.filter(v => !v.ps);
    else vocab = vocab.filter(v => v.ps === vocabPsFilter);
  }

  // "Zuletzt geändert"-Filter (z.B. von Statistik → Prüf-Aktivität aus gesprungen)
  if(vocabSinceDays){
    const cutoff = Date.now() - vocabSinceDays * 86400000;
    vocab = vocab.filter(v => v.psu && new Date(v.psu).getTime() >= cutoff);
  }
  renderSinceBanner();

  // Fällig-bis-Filter
  if(dueUntil){
    vocab = vocab.filter(v => {
      const p = srsProgress[v.id];
      if(!p || !p.next_review) return false;
      if(!p || !p.next_review) return false; // kein Fälligkeitsdatum = nicht anzeigen
      return new Date(p.next_review) <= dueUntil;
    });
  }

  if(!q){ renderVocabTable(vocab); return; }
  const filtered = vocab.filter(v =>
    v.ar.includes(q) ||
    normalize(v.tr).includes(normalize(q)) ||
    v.en.toLowerCase().includes(q) ||
    v.tr.toLowerCase().includes(q)
  );
  renderVocabTable(filtered);
}

function renderSinceBanner(){
  const el = document.getElementById('vl-since-banner');
  if(!el) return;
  if(!vocabSinceDays){ el.innerHTML = ''; return; }
  el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;padding:.5rem .7rem;background:rgba(74,158,109,.1);border:1px solid var(--green);border-radius:5px;font-size:.75rem;color:var(--green)">'
    + '<span>🕐 Freigegeben in den letzten ' + vocabSinceDays + ' Tagen</span>'
    + '<button onclick="clearSinceFilter()" style="background:none;border:1px solid var(--green);color:var(--green);font-family:\'IBM Plex Mono\',monospace;font-size:.68rem;padding:.15rem .5rem;cursor:pointer;border-radius:3px">✕ zurücksetzen</button>'
    + '</div>';
}
function clearSinceFilter(){
  vocabSinceDays = null;
  filterVocabList();
}

function renderVocabTable(vocab){
  const el = document.getElementById('vocab-table');
  if(!el) return;
  const SRS_COLORS = ['#9b6fd4','#e05555','#e07832','#c9a84c','#2a9d8f','#4cac6e','#1a7a3a'];
  const SRS_LABELS = ['L0','L1','L2','L3','L4','L5','L6'];

  if(!vocab.length){
    el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem">Keine Vokabeln gefunden</div>';
    return;
  }

  let h = '<div style="font-size:.68rem;color:var(--muted);margin-bottom:.5rem">'+vocab.length+' Vokabeln</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:.75rem">';
  h += '<thead><tr style="color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em">';
  h += '<th style="padding:.3rem .3rem;border-bottom:1px solid var(--border)"><input type="checkbox" id="vl-check-all" onchange="toggleSelectAll(this)" style="cursor:pointer"></th>';
  h += '<th style="text-align:left;padding:.3rem .3rem;border-bottom:1px solid var(--border)">L</th>';
  h += '<th style="text-align:right;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Arabisch</th>';
  h += '<th style="text-align:left;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Tr.</th>';
  h += '<th style="text-align:left;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Deutsch</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Lvl</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Wdh</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)">✓</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)">🔁</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)">Fällig</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)" title="Partner-Status">P</th>';
  h += '<th style="text-align:center;padding:.3rem .3rem;border-bottom:1px solid var(--border)" title="Aussprache">🔊</th>';
  h += '<th style="padding:.3rem .3rem;border-bottom:1px solid var(--border)"></th>';
  h += '</tr></thead><tbody>';

  vocab.forEach((v,i) => {
    const vocabId = v.id;
    const p = vocabId ? srsProgress[vocabId] : null;
    const level = p ? p.level : 0;
    const color = SRS_COLORS[level];
    const reviewed = p ? timeAgo(p.last_reviewed) : '—';
    const correct = p ? timeAgo(p.last_correct) : '—';
    const rowId = 'vrow-'+i;
    const editId = 'vedit-'+i;
    const vIdx = ALL_VOCAB.indexOf(v);

    h += '<tr id="'+rowId+'" style="border-bottom:1px solid rgba(58,50,40,.4)">';
    const flagMark = flaggedVocab.has(v.tr) ? ' 🚩' : '';
    const isChecked = selectedVocabIds.has(v.id);
    h += '<td style="padding:.3rem .3rem"><input type="checkbox" data-vid="'+v.id+'" onchange="toggleVocabSelect(this)" style="cursor:pointer"'+(isChecked?' checked':'')+'/></td>';
    h += '<td style="padding:.3rem;color:var(--muted);font-size:.65rem">'+v.ls+flagMark+'</td>';
    h += '<td style="text-align:right;padding:.3rem;font-family:\'Playfair Display\',serif;font-size:1rem;color:var(--gold2);direction:rtl">'+v.ar+'</td>';
    h += '<td style="padding:.3rem;color:var(--muted);font-size:.7rem">'+v.tr+'</td>';
    h += '<td style="padding:.3rem">'+v.en+'</td>';
    h += '<td style="text-align:center;padding:.3rem"><span style="color:'+color+';font-weight:700;font-size:.7rem">'+SRS_LABELS[level]+'</span></td>';
    const due = p && p.next_review ? fmtDue(p.next_review) : '—';
    const rc = p ? (p.review_count||0) : 0;
    h += '<td style="text-align:center;padding:.3rem;color:var(--muted);font-size:.7rem">'+reviewed+'</td>';
    h += '<td style="text-align:center;padding:.3rem;color:var(--muted);font-size:.7rem">'+correct+'</td>';
    h += '<td style="text-align:center;padding:.3rem;color:var(--muted);font-size:.7rem">'+(rc||'—')+'</td>';
    h += '<td style="text-align:center;padding:.3rem;font-size:.7rem">'+due+'</td>';
    const vid = v.id || '';
    const ps = v.ps;
    const psIcon = ps==='approved'?'<span title="Bestätigt" style="color:var(--green)">✅</span>'
                 : ps==='rejected'?'<span title="Falsch" style="color:var(--red)">❌</span>'
                 : ps==='unknown'?'<span title="Kenn ich nicht" style="color:var(--muted)">❓</span>'
                 : ps==='pending'?'<span title="Wartet auf Prüfung" style="color:var(--gold)">⏳</span>'
                 : ps==='skipped'?'<span title="Übersprungen" style="color:var(--muted)">⏭</span>'
                 : ps==='suggested'?'<span title="Vorschlag" style="color:var(--blue)">💡</span>'
                 : '<span style="color:var(--border)">·</span>';
    h += '<td style="text-align:center;padding:.3rem">'+psIcon+'</td>';
    const audioBtn = v.au ? '<button onclick="playVocabAudio(\''+v.au.replace(/'/g,"\\'")+'\',event)" title="Aussprache abspielen" style="background:none;border:1px solid var(--border);color:var(--gold2);font-size:.75rem;padding:.15rem .4rem;cursor:pointer;border-radius:3px">🔊</button>' : '<span style="color:var(--border)">·</span>';
    h += '<td style="text-align:center;padding:.3rem">'+audioBtn+'</td>';

    h += '</tr>';
    // Edit-Row entfernt — Edit-Panel ist jetzt ein fixes Bottom-Sheet
  });

  h += '</tbody></table>';
  el.innerHTML = h;
  updateBulkBar();
}

function toggleVocabSelect(cb){
  const vid = parseInt(cb.dataset.vid);
  if(cb.checked) selectedVocabIds.add(vid);
  else selectedVocabIds.delete(vid);
  updateBulkBar();
  // Sync "Alle"-Checkbox
  const all = document.getElementById('vl-check-all');
  if(all){
    const boxes = document.querySelectorAll('#vocab-table input[type=checkbox][data-vid]');
    all.checked = boxes.length > 0 && [...boxes].every(b=>b.checked);
    all.indeterminate = !all.checked && [...boxes].some(b=>b.checked);
  }
}

function toggleSelectAll(cb){
  document.querySelectorAll('#vocab-table input[type=checkbox][data-vid]').forEach(box => {
    box.checked = cb.checked;
    const vid = parseInt(box.dataset.vid);
    if(cb.checked) selectedVocabIds.add(vid);
    else selectedVocabIds.delete(vid);
  });
  updateBulkBar();
}

function updateBulkBar(){
  const bar = document.getElementById('vl-bulk-bar');
  if(!bar) return;
  const n = selectedVocabIds.size;
  if(n === 0){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const lbl = document.getElementById('vl-bulk-label');
  if(lbl) lbl.textContent = n + ' markiert';
}

async function bulkReassign(){
  const targetLs = document.getElementById('vl-bulk-ls').value;
  if(!targetLs){ showToast('Bitte Ziel-Lektion wählen','warn'); return; }
  const n = selectedVocabIds.size;
  if(!n) return;
  const targetId = lsToId(targetLs);
  const btn = document.getElementById('vl-bulk-btn');
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  try {
    // Supabase erlaubt kein Bulk-PATCH mit IN-Liste direkt — wir schicken einzeln parallel
    const ids = [...selectedVocabIds];
    // Nutze in()-Filter wenn unterstützt
    await sbApi('vocabulary?id=in.('+ids.join(',')+')', 'PATCH', { lesson_id: targetId });
    // Lokal updaten
    ids.forEach(vid => {
      const v = vById(vid);
      if(v) v.ls = targetLs;
    });
    showToast('✓ '+n+' Vokabeln → '+targetLs,'ok');
    selectedVocabIds.clear();
    filterVocabList();
  } catch(e){
    showToast('Fehler: '+e.message,'err');
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='Zuordnen'; }
  }
}

async function bulkSetStatus(){
  const ps = document.getElementById('vl-bulk-ps').value;
  if(!ps){ showToast('Bitte Status wählen','warn'); return; }
  const n = selectedVocabIds.size;
  if(!n) return;
  const btn = document.getElementById('vl-bulk-ps-btn');
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  try {
    const ids = [...selectedVocabIds];
    const patch = { partner_status: ps === 'null' ? null : ps, status_updated_at: new Date().toISOString() };
    await sbApi('vocabulary?id=in.('+ids.join(',')+')', 'PATCH', patch);
    ids.forEach(vid => {
      const v = vById(vid);
      if(v){ v.ps = ps === 'null' ? null : ps; v.psu = patch.status_updated_at; }
    });
    showToast('✓ '+n+' Vokabeln → '+(ps==='null'?'kein Status':ps),'ok');
    selectedVocabIds.clear();
    filterVocabList();
  } catch(e){
    showToast('Fehler: '+e.message,'err');
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='→'; }
  }
}

// Hilfsfunktion lsToId und LESSON_NUM_TO_ID werden oben bei loadLessonChips dynamisch befüllt

async function saveVocabEditSheet(){
  const vocabId = _editSheetVocabId;
  if(!vocabId){ alert('Keine Vokabel ausgewählt'); return; }
  const v = vById(vocabId);
  if(!v){ alert('Vokabel nicht gefunden'); return; }
  const newAr = document.getElementById('ei-ar').value.trim();
  const newTr = document.getElementById('ei-tr').value.trim();
  const newEn = document.getElementById('ei-en').value.trim();
  const newTp = document.getElementById('ei-tp').value.trim();
  const newLs = document.getElementById('ei-ls').value.trim();
  const newNr = document.getElementById('ei-nr').value;
  const newLvl = parseInt(document.getElementById('ei-lvl').value)||0;
  if(!newAr || !newTr || !newEn){ alert('Alle Felder ausfüllen'); return; }
  const oldTr = v.tr;
  try{
    const newPs = document.getElementById('ei-ps') ? document.getElementById('ei-ps').value : null;
    const newPc = document.getElementById('ei-pc') ? document.getElementById('ei-pc').value.trim() : null;
    const vocabPatch = { arabic_script: newAr, darija: newTr, german: newEn, topic: newTp, lesson_id: lsToId(newLs) };
    const newPsNorm = newPs === '' ? null : newPs;
    if(newPs !== null && newPsNorm !== (v.ps || null)){
      vocabPatch.partner_status = newPsNorm;
      vocabPatch.status_updated_at = new Date().toISOString();
    }
    if(newPc !== null) vocabPatch.partner_comment = newPc || null;
    await sbApi('vocabulary?id=eq.'+vocabId, 'PATCH', vocabPatch);
    const progId = srsProgress[vocabId] ? srsProgress[vocabId].id : null;
    const patchProg = {};
    if(newNr) patchProg.next_review = fromLocalInputDE(newNr).toISOString();
    patchProg.correct_count = newLvl;
    if(progId){
      await sbApi('progress?id=eq.'+progId, 'PATCH', patchProg);
    } else {
      const np = await sbApi('progress?on_conflict=user_id,vocabulary_id', 'POST', { user_id: currentUser.id, vocabulary_id: vocabId, correct_count: newLvl, wrong_count: 0, next_review: newNr ? fromLocalInputDE(newNr).toISOString() : null }, 'resolution=merge-duplicates,return=representation');
      const npa = Array.isArray(np) ? np[0] : np;
      if(npa && npa.id) srsProgress[vocabId] = { id: npa.id, vocabulary_id: vocabId, level: newLvl, next_review: newNr ? fromLocalInputDE(newNr) : null };
    }
    if(srsProgress[vocabId]){
      if(newNr) srsProgress[vocabId].next_review = fromLocalInputDE(newNr);
      srsProgress[vocabId].level = newLvl;
    }
    v.ar = newAr; v.tr = newTr; v.en = newEn; v.tp = newTp; v.ls = newLs; v.ps = newPsNorm; v.pc = newPc||null;
    if(vocabPatch.status_updated_at) v.psu = vocabPatch.status_updated_at;
    if(newTr !== oldTr){ vocabIdMap[newTr] = vocabId; delete vocabIdMap[oldTr]; }
    closeVocabEdit();
    filterVocabList();
    dbg('Gespeichert: '+newTr, 'ok');
  } catch(e){ alert('Fehler: '+e.message); }
}

async function clearDueDateSheet(){

  if(!vocabId) return;
  const p = srsProgress[vocabId];
  if(!p || !p.id){ alert('Kein Progress-Eintrag'); return; }
  await sbApi('progress?id=eq.'+p.id, 'PATCH', { next_review: null });
  srsProgress[vocabId].next_review = null;
  document.getElementById('ei-nr').value = '';
}

async function toggleFlagSheet(){
  const vocabId = _editSheetVocabId;
  if(!vocabId) return;
  const v = vById(vocabId);
  if(!v) return;
  const isFlagged = flaggedVocab.has(v.tr);
  await sbApi('vocabulary?id=eq.'+vocabId, 'PATCH', { flagged: !isFlagged });
  if(isFlagged) flaggedVocab.delete(v.tr);
  else flaggedVocab.add(v.tr);
  const flagBtn = document.getElementById('sheet-flag-btn');
  flagBtn.textContent = !isFlagged ? '🚩' : '🏳️';
  flagBtn.style.color = !isFlagged ? 'var(--gold)' : 'var(--muted)';
  flagBtn.style.borderColor = !isFlagged ? 'var(--gold)' : 'var(--border)';
  // Tabelle im Hintergrund aktualisieren ohne Sheet zu schließen
  filterVocabList();
}

async function deleteVocabSheet(){
  const vocabId = _editSheetVocabId;
  if(!vocabId) return;
  if(!confirm('Vokabel wirklich löschen?')) return;
  try {
    await sbApi('progress?vocabulary_id=eq.'+vocabId, 'DELETE');
    await sbApi('vocabulary?id=eq.'+vocabId, 'DELETE');
    const idx = ALL_VOCAB.findIndex(v => v.id == vocabId);
    if(idx >= 0){ delete vocabIdMap[ALL_VOCAB[idx].tr]; ALL_VOCAB.splice(idx, 1); }
    delete VOCAB_BY_ID[vocabId];
    delete srsProgress[vocabId];
    showToast('✓ Gelöscht','ok');
    closeVocabEdit();
    filterVocabList();
  } catch(e){
    showToast('Fehler beim Löschen: '+e.message,'err');
  }
}

async function toggleFlag(tr, btn){
  const isFlagged = flaggedVocab.has(tr);
  const vocabId = vocabIdMap[tr];
  if(!vocabId) return;
  try {
    await sbApi('vocabulary?id=eq.'+vocabId, 'PATCH', {flagged: !isFlagged});
    if(isFlagged){ flaggedVocab.delete(tr); btn.classList.remove('flagged'); btn.title='Als fehlerhaft markieren'; }
    else { flaggedVocab.add(tr); btn.classList.add('flagged'); btn.title='Markierung entfernen'; }
  } catch(e){ console.error(e); }
}

async function saveNewLesson(){
  const num   = parseInt(document.getElementById('nl-num').value)||0;
  const title = document.getElementById('nl-title').value.trim();
  const fb    = document.getElementById('nl-fb');
  if(!num){ fb.style.color='var(--red)'; fb.textContent='Nummer fehlt'; return; }

  try {
    const res = await sbApi('lessons?select=id,lesson_number,title', 'POST', { lesson_number: num, title: title||null }, 'return=representation');

// Datenmodell: course_lessons (1 Zeile/Lektion), course_exercises (Teilaufgaben),
// course_progress (Fortschritt pro Nutzer/Lektion). Schreibt NICHT in progress/SRS.

let COURSE_LESSONS = [];               // [{id, course_number, skript, title, dialog_text, grammar_notes, vocab_lesson_refs}]
let COURSE_EXERCISES_BY_LESSON = {};   // course_lesson_id -> [exercise, ...] sortiert nach position
let COURSE_PROGRESS_BY_LESSON = {};    // course_lesson_id -> progress-Zeile des aktuellen Nutzers (oder undefined)
let _courseLoaded = false;
let _courseTest = null;                // aktiver Test-Durchlauf, siehe courseStartTest()
const COURSE_GRADABLE_TYPES = ['translate_de_tn','fill_blank','answer_pattern','grammar_card','grammar_drill','fixed_response'];

function courseGradableCount(lessonId){
  return (COURSE_EXERCISES_BY_LESSON[lessonId]||[]).filter(e=>COURSE_GRADABLE_TYPES.includes(e.exercise_type)).length;
}

// Befüllt das Lektion-Dropdown zusätzlich mit einer "🎓 Kurs"-Gruppe, damit man
// manuell nach einer Kurs-Lektion filtern kann (analog zur normalen Lektion).
async function loadCourseLessonOptions(){
  try{
    await loadCourseData();
    const sel = document.getElementById('lesson-select');
    if(!sel || !COURSE_LESSONS.length) return;
    const old = document.getElementById('lesson-select-course-group');
    if(old) old.remove();
    const og = document.createElement('optgroup');
    og.id = 'lesson-select-course-group';
    og.label = '🎓 Kurs';
    COURSE_LESSONS.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = 'COURSE:'+l.id;
      opt.textContent = 'K'+l.skript+'.'+l.course_number + (l.title ? ' · '+l.title : '');
      og.appendChild(opt);
    });
    sel.appendChild(og);
    dbg('Kurs-Lektionen im Filter geladen: ' + COURSE_LESSONS.length, 'ok');
  }catch(e){
    dbg('Fehler beim Laden der Kurs-Lektionen für Filter: '+e.message, 'warn');
  }
}
async function loadCourseData(force){
  if(_courseLoaded && !force) return;
  const [lessons, exercises, progress] = await Promise.all([
    sbApi('course_lessons?select=*&order=course_number.asc'),
    sbApi('course_exercises?select=*&order=course_lesson_id.asc,position.asc'),
    sbApi('course_progress?user_id=eq.'+currentUser.id+'&select=*')
  ]);
  COURSE_LESSONS = lessons || [];
  COURSE_EXERCISES_BY_LESSON = {};
  (exercises||[]).forEach(e=>{
    if(!COURSE_EXERCISES_BY_LESSON[e.course_lesson_id]) COURSE_EXERCISES_BY_LESSON[e.course_lesson_id]=[];
    COURSE_EXERCISES_BY_LESSON[e.course_lesson_id].push(e);
  });
  COURSE_PROGRESS_BY_LESSON = {};
  (progress||[]).forEach(p=>{ COURSE_PROGRESS_BY_LESSON[p.course_lesson_id]=p; });
  _courseLoaded = true;
}

// Schlichtes Markdown: ### Überschrift, - Bullet-Punkt, **bold**, Absätze.
function mdLite(s){
  if(!s) return '';
  const escLine = (t)=>{ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; };
  const bold = (t)=> t.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--gold2)">$1</strong>');
  const lines = s.split('\n');
  let html=''; let inList=false;
  lines.forEach(line=>{
    const t = line.trim();
    if(t.startsWith('### ')){
      if(inList){ html+='</ul>'; inList=false; }
      html += '<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:1rem 0 .35rem;font-weight:700">'+escLine(t.slice(4))+'</div>';
    } else if(t.startsWith('- ')){
      if(!inList){ html+='<ul style="margin:.2rem 0 .7rem;padding-left:1.15rem">'; inList=true; }
      html += '<li style="margin-bottom:.35rem">'+bold(escLine(t.slice(2)))+'</li>';
    } else if(t===''){
      if(inList){ html+='</ul>'; inList=false; }
    } else {
      if(inList){ html+='</ul>'; inList=false; }
      html += '<div style="margin-bottom:.4rem">'+bold(escLine(t))+'</div>';
    }
  });
  if(inList) html += '</ul>';
  return html;
}

function renderCourseOverview(){
  const c = document.getElementById('exercise-content');
  if(!c) return;
  if(!COURSE_LESSONS.length){
    c.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted)">Noch keine Kurs-Lektionen angelegt.</div>';
    return;
  }
  let h = '<div style="padding:1rem;max-width:600px;margin:0 auto">';
  h += '<div style="font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:1rem">Uni-Wien-Kurs</div>';
  h += '<div style="display:flex;flex-direction:column;gap:.5rem">';
  COURSE_LESSONS.forEach((l,i)=>{
    const prog = COURSE_PROGRESS_BY_LESSON[l.id];
    const status = prog ? prog.status : 'open';
    const prevDone = i===0 || (COURSE_PROGRESS_BY_LESSON[COURSE_LESSONS[i-1].id] && COURSE_PROGRESS_BY_LESSON[COURSE_LESSONS[i-1].id].status==='done');
    const locked = !prevDone && status!=='done' && status!=='in_progress';
    const icon = status==='done' ? '✅' : status==='in_progress' ? '▶️' : locked ? '🔒' : '▶️';
    const scoreTxt = (status==='done' && prog.score_self!=null) ? ' · zuletzt '+prog.score_self+' von '+courseGradableCount(l.id)+' richtig' : '';
    h += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.7rem .8rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem">';
    h += '<div style="flex:1;min-width:0">';
    h += '<div style="font-size:.9rem;color:var(--text)">'+icon+' L'+l.course_number+' <span style="color:var(--gold2)">'+escHtml(l.title||'')+'</span></div>';
    h += '<div style="font-size:.68rem;color:var(--muted);margin-top:.15rem">'+(status==='done'?'abgeschlossen':status==='in_progress'?'in Bearbeitung':'offen')+scoreTxt+'</div>';
    h += '</div>';
    if(locked){
      h += '<button onclick="showCourseLesson('+l.id+')" style="background:none;border:1px solid var(--border);color:var(--muted);font-size:.68rem;padding:.3rem .55rem;cursor:pointer;border-radius:3px;white-space:nowrap">trotzdem öffnen</button>';
    } else {
      h += '<button onclick="showCourseLesson('+l.id+')" style="padding:.35rem .7rem;background:var(--gold);border:none;color:#0e0c0a;font-family:\'IBM Plex Mono\',monospace;font-size:.75rem;font-weight:700;cursor:pointer;border-radius:4px;white-space:nowrap">Öffnen</button>';
    }
    h += '</div>';
  });
  h += '</div></div>';
  c.innerHTML = h;
}

function parseCourseVocabRefs(refString){
  const out = {ids:new Set(), tr:new Set()};
  if(!refString) return out;
  refString.split('|').forEach(part=>{
    const m = part.split(':');
    if(m.length<2) return;
    const key = m[0].trim();
    const vals = m[1].split(',').map(s=>s.trim()).filter(Boolean);
    if(key==='ids') vals.forEach(v=>{ const n=parseInt(v,10); if(!isNaN(n)) out.ids.add(n); });
    else if(key==='darija') vals.forEach(v=>out.tr.add(v));
  });
  return out;
}

function renderCourseVocabTab(tc, l){
  const filter = parseCourseVocabRefs(l.vocab_lesson_refs);
  const count = filter.ids.size + filter.tr.size;
  let h = '<div style="color:var(--muted);font-size:.85rem;line-height:1.6;margin-bottom:1rem">';
  h += count
    ? 'Diese Lektion umfasst '+count+' Vokabeln. Im Karten-Modus lernst du nur diese, solange der Filter aktiv ist.'

  tc.innerHTML = h;
}

function courseGoToVocab(lessonId){

// ── Test-Flow ──────────────────────────────────────────────────────────────

function courseStartTest(){
  const l = _courseCurLesson;
  if(!l) return;
  const all = COURSE_EXERCISES_BY_LESSON[l.id] || [];
  const items = all.filter(e=>e.exercise_type!=='grammar_card');
  const gcItems = all.filter(e=>e.exercise_type==='grammar_card');
  _courseTest = {
    lessonId: l.id, items, gcItems,
    idx: 0, gcIdx: 0,
    phase: items.length ? 'main' : (gcItems.length ? 'grammar' : 'summary'),
    revealed: false,
    mainC:0, mainW:0, gcC:0, gcW:0,
    doneIds: []
  };
}

function renderCourseTestTab(tc, l){
  if(!_courseTest || _courseTest.lessonId!==l.id) courseStartTest();
  const t = _courseTest;

  if(t.phase==='summary'){
    const totalTallyable = t.mainC+t.mainW+t.gcC+t.gcW;
    let h = '<div style="text-align:center;padding:1.5rem 0">';
    h += '<div style="font-size:2rem;margin-bottom:.5rem">'+(t.items.length+t.gcItems.length===0?'🤷':'🎉')+'</div>';
    if(totalTallyable>0){
      h += '<div style="font-size:1.1rem;color:var(--gold2)">'+(t.mainC+t.gcC)+' von '+totalTallyable+' richtig</div>';
    } else {
      h += '<div style="color:var(--muted);font-size:.85rem">Keine Test-Aufgaben für diese Lektion.</div>';
    }
    h += '<button id="course-finish-btn" onclick="courseFinishTest()" style="margin-top:1.2rem;padding:.65rem 1.4rem;background:var(--gold);border:none;color:#0e0c0a;font-family:\'IBM Plex Mono\',monospace;font-size:.85rem;font-weight:700;cursor:pointer;border-radius:4px">✓ Lektion abschließen</button>';
    h += '</div>';
    tc.innerHTML = h;
    return;
  }

  let ex, total, cur;
  if(t.phase==='main'){ ex = t.items[t.idx]; total = t.items.length; cur = t.idx+1; }
  else { ex = t.gcItems[t.gcIdx]; total = t.gcItems.length; cur = t.gcIdx+1; }
  if(!ex){ courseAdvancePhase(); renderCourseTestTab(tc, l); return; }

  const isGrammar = t.phase==='grammar';
  const gradable = COURSE_GRADABLE_TYPES.includes(ex.exercise_type);
  const label = isGrammar ? '🧠 Grammatik-Check' : ({translate_de_tn:'Übersetzen',fill_blank:'Lücke füllen',answer_pattern:'Antworten',build_dialog:'Dialog bilden',grammar_drill:'Grammatik-Übung',fixed_response:'Feste Antwort'})[ex.exercise_type] || ex.exercise_type;

  let h = '<div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:.3rem">'+label+' · '+cur+' / '+total+'</div>';
  if(ex.exercise_type==='answer_pattern'){
    h += '<div style="border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;margin-bottom:.8rem;font-size:.78rem;color:var(--text)">'
       + '<div style="color:var(--gold);font-weight:700;margin-bottom:.3rem">📝 Zu erledigen:</div>'
       + '<div>☐ Frage auf Deutsch übersetzen</div>'
       + '<div>☐ Frage auf Tounsi beantworten</div>'
       + '<div>☐ Deine Antwort auf Deutsch übersetzen</div>'
       + '</div>';
  } else if(ex.instruction) h += '<div style="font-size:.75rem;color:var(--muted);margin-bottom:.6rem">'+escHtml(ex.instruction)+'</div>';
  if(ex.prompt) h += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1rem;font-size:.95rem;margin-bottom:.8rem">'+escHtml(ex.prompt)+'</div>';

  if(!gradable){
    // pronunciation / build_dialog: keine Bewertung, aber build_dialog braucht eine konkrete Anleitung statt bloßem "Weiter"
    if(ex.exercise_type==='build_dialog'){
      h += '<div style="font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:1rem">'
         + 'Das ist eine freie Aufgabe ohne feste Lösung — sprich oder schreib dir selbst einen kurzen Dialog, '
         + 'z.B. mit diesem Ablauf:<br><br>'
         + '1. Begrüßung (is-salam 3likom / 3aslema / ahla)<br>'
         + '2. "Wie geht\'s?" fragen (shnowwa 7welik?)<br>'
         + '3. Antworten (lbas, il-7amdulla)<br>'
         + '4. Verabschieden (b-is-slama)<br><br>'
         + 'Wenn du das einmal laut oder schriftlich durchgespielt hast, geh weiter.'
         + '</div>';
    } else if(ex.solution){
      h += '<div style="color:var(--gold2);font-size:.85rem;margin-bottom:1rem">'+escHtml(ex.solution)+'</div>';
    }
    h += '<button onclick="courseNextItem(null)" style="width:100%;padding:.6rem;background:var(--gold);border:none;color:#0e0c0a;font-family:\'IBM Plex Mono\',monospace;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:4px">Weiter</button>';
  } else if(!t.revealed){
    h += '<button onclick="courseReveal()" style="width:100%;padding:.6rem;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:\'IBM Plex Mono\',monospace;font-size:.8rem;cursor:pointer;border-radius:4px">Lösung zeigen</button>';
  } else {
    let solHtml = null;
    if(ex.exercise_type==='answer_pattern'){
      const m = (ex.solution||'').match(/^(.*?)\s*\(([^—]+)—\s*(.*)\)\s*$/);
      if(m){
        const antwortTn = m[1].trim(), frageDe = m[2].trim(), antwortDe = m[3].trim();
        const row = (label,val) => '<div style="margin-bottom:.5rem"><div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.15rem">'+label+'</div><div>'+escHtml(val)+'</div></div>';
        solHtml = '<div>'
          + row('Frage auf Deutsch', frageDe)
          + row('Deine Antwort (Tounsi)', antwortTn)
          + row('Antwort auf Deutsch', antwortDe)
          + '</div>';
      }
    }
    if(!solHtml) solHtml = escHtml(ex.solution||'—');
    h += '<div style="background:rgba(201,168,76,.08);border:1px solid var(--gold);border-radius:6px;padding:.7rem .8rem;font-size:.9rem;color:var(--gold2);margin-bottom:.8rem">'+solHtml+'</div>';
    if(ex.partner_status===null || ex.partner_status===undefined){
      h += '<div style="font-size:.68rem;color:var(--muted);margin-bottom:.6rem">⚠️ ungeprüft — wartet auf Semias Prüfung</div>';
    }
    h += '<div style="display:flex;gap:.5rem">';
    h += '<button onclick="courseNextItem(true)" style="flex:1;padding:.6rem;background:rgba(90,168,90,.15);border:1px solid var(--green);color:var(--green);font-family:\'IBM Plex Mono\',monospace;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:4px">✔️ Richtig</button>';
    h += '<button onclick="courseNextItem(false)" style="flex:1;padding:.6rem;background:rgba(201,76,76,.12);border:1px solid var(--red);color:var(--red);font-family:\'IBM Plex Mono\',monospace;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:4px">✖️ Falsch</button>';
    h += '</div>';
  }
  tc.innerHTML = h;
}

function courseReveal(){
  if(_courseTest) _courseTest.revealed = true;
  renderCourseLesson();
}

function courseAdvancePhase(){
  const t = _courseTest;
  if(!t) return;
  if(t.phase==='main') t.phase = t.gcItems.length ? 'grammar' : 'summary';
  else if(t.phase==='grammar') t.phase = 'summary';
}

function courseNextItem(correct){
  const t = _courseTest;
  if(!t) return;
  const isGrammar = t.phase==='grammar';
  const list = isGrammar ? t.gcItems : t.items;
  const idxKey = isGrammar ? 'gcIdx' : 'idx';
  const ex = list[t[idxKey]];
  if(ex) t.doneIds.push(ex.id);
  if(correct===true){ if(isGrammar) t.gcC++; else t.mainC++; }
  else if(correct===false){ if(isGrammar) t.gcW++; else t.mainW++; }
  t[idxKey]++;
  t.revealed = false;
  if(t[idxKey] >= list.length) courseAdvancePhase();
  renderCourseLesson();
}

async function courseFinishTest(){
  const t = _courseTest;
  const l = _courseCurLesson;
  if(!t || !l) return;
  const score = t.mainC + t.gcC;
  const existing = COURSE_PROGRESS_BY_LESSON[l.id];
  const payload = {
    status: 'done',
    exercises_done: t.doneIds,
    score_self: score,
    completed_at: new Date().toISOString()
  };
  const btn = document.getElementById('course-finish-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Speichere…'; }
  try{
    if(existing){
      await sbApi('course_progress?id=eq.'+existing.id, 'PATCH', payload);
      Object.assign(existing, payload);
    } else {
      const res = await sbApi('course_progress?select=*', 'POST', Object.assign({user_id:currentUser.id, course_lesson_id:l.id}, payload), 'return=representation');
      const row = Array.isArray(res) ? res[0] : res;
      COURSE_PROGRESS_BY_LESSON[l.id] = row;
    }
    showToast('✓ Lektion abgeschlossen — gespeichert','ok');
    showCourseOverview();
  }catch(e){
    showToast('Fehler beim Speichern: '+e.message,'err');
    if(btn){ btn.disabled = false; btn.textContent = '✓ Nochmal versuchen'; }
  }
}

        '&order=id.asc&limit='+batchSize+'&offset='+offset
      );
      if(!batch || batch.length === 0) break;
      all = all.concat(batch);
      if(batch.length < batchSize) break;
      offset += batchSize;
    }

    prog.textContent = all.length + ' Vokabeln geladen. Erstelle CSV…';

    // CSV bauen
    const header = 'id,lesson_number,arabic_script,darija,german,topic';
    const rows = all.map(v => {

}

// ── SQL-Backup-Export (restore-fähig, für Disaster Recovery) ────────────────
function sqlEsc(v){ return v===null||v===undefined ? 'NULL' : "'" + String(v).replace(/'/g,"''") + "'"; }
function sqlBoolLit(v){ return v===null||v===undefined ? 'NULL' : (v?'TRUE':'FALSE'); }
function sqlNumLit(v){ return v===null||v===undefined||v==='' ? 'NULL' : Number(v); }
function sqlJsonLit(v){ return v===null||v===undefined ? 'NULL' : "'" + JSON.stringify(v).replace(/'/g,"''") + "'::jsonb"; }

async function fetchAllPaged(table, select, orderBy){
  let all = [], offset = 0; const batchSize = 1000;
  while(true){
    const batch = await sbApi(table+'?select='+select+(orderBy?'&order='+orderBy:'')+'&limit='+batchSize+'&offset='+offset);
    if(!batch || !batch.length) break;
    all = all.concat(batch);
    if(batch.length < batchSize) break;
    offset += batchSize;
  }
  return all;
}

// Baut INSERT ... ON CONFLICT (id) DO UPDATE-Statements in Batches (Zeilen-Chunks),
// damit einzelne Statements nicht zu lang werden. cols: [{name, type}], type in 'str'|'num'|'bool'|'json'.
function buildUpsertSQL(table, cols, rows, batchSize){
  batchSize = batchSize || 300;
  if(!rows.length) return '-- (keine Zeilen)';
  const colNames = cols.map(c=>c.name).join(', ');
  const updateSet = cols.filter(c=>c.name!=='id').map(c=>c.name+'=EXCLUDED.'+c.name).join(', ');
  const lit = (c, v) => c.type==='num' ? sqlNumLit(v) : c.type==='bool' ? sqlBoolLit(v) : c.type==='json' ? sqlJsonLit(v) : sqlEsc(v);
  const out = [];
  for(let i=0;i<rows.length;i+=batchSize){
    const chunk = rows.slice(i, i+batchSize);
    const values = chunk.map(r => '(' + cols.map(c=>lit(c, r[c.name])).join(', ') + ')').join(',\n  ');
    out.push('INSERT INTO '+table+' ('+colNames+') VALUES\n  '+values+'\nON CONFLICT (id) DO UPDATE SET '+updateSet+';');
  }
  return out.join('\n\n');
}

// Baut den restore-fähigen SQL-Vollbackup-Inhalt aus bereits geladenen Daten.
function buildBackupSQL(data, today){
  const { vocab, lessons, users, progress, reviewLog, courseLessons, courseExercises, courseProgress } = data;
  const parts = [];
  parts.push('-- Tounsi Trainer — Vollbackup (restore-fähig)');
  parts.push('-- Stand: ' + today + ' (gehört zusammen mit tounsi_db_' + today + '.md)');
  parts.push('-- Reihenfolge beachtet Foreign Keys: lessons → vocabulary → users → progress → review_log → course_lessons → course_exercises → course_progress');
  parts.push('-- ⚠️ users.password_hash ist NICHT enthalten (per REVOKE SELECT geschützt, siehe Login-Hardening 2026-07-16).');
  parts.push('-- Bestehende Zeilen (per id) werden per ON CONFLICT DO UPDATE aktualisiert, ohne password_hash zu berühren.');
  parts.push('-- Bei Restore in eine LEERE Datenbank (neue users-Zeilen) müssen Passwörter separat neu gesetzt werden.');
  parts.push('');
  parts.push('-- lessons ('+lessons.length+' Zeilen)');
  parts.push(buildUpsertSQL('lessons', [
    {name:'id',type:'num'},{name:'lesson_number',type:'num'},{name:'title',type:'str'}
  ], lessons));
  parts.push('');
  parts.push('-- vocabulary ('+vocab.length+' Zeilen)');
  parts.push(buildUpsertSQL('vocabulary', [
    {name:'id',type:'num'},{name:'lesson_id',type:'num'},{name:'arabic_script',type:'str'},{name:'darija',type:'str'},
    {name:'german',type:'str'},{name:'topic',type:'str'},{name:'flagged',type:'bool'},{name:'partner_status',type:'str'},
    {name:'partner_comment',type:'str'},{name:'status_updated_at',type:'str'}
  ], vocab));
  parts.push('');
  parts.push('-- users ('+users.length+' Zeilen, ohne password_hash)');
  parts.push(buildUpsertSQL('users', [
    {name:'id',type:'str'},{name:'username',type:'str'},{name:'is_admin',type:'bool'},{name:'is_partner',type:'bool'},
    {name:'created_at',type:'str'},{name:'last_active_at',type:'str'},{name:'last_reminder_sent_at',type:'str'}
  ], users));
  parts.push('');
  parts.push('-- progress ('+progress.length+' Zeilen)');
  parts.push(buildUpsertSQL('progress', [
    {name:'id',type:'num'},{name:'user_id',type:'str'},{name:'vocabulary_id',type:'num'},{name:'correct_count',type:'num'},
    {name:'wrong_count',type:'num'},{name:'review_count',type:'num'},{name:'next_review',type:'str'},
    {name:'last_reviewed',type:'str'},{name:'last_correct',type:'bool'}
  ], progress));
  parts.push('');
  parts.push('-- review_log ('+reviewLog.length+' Zeilen)');
  parts.push(buildUpsertSQL('review_log', [
    {name:'id',type:'num'},{name:'user_id',type:'str'},{name:'vocabulary_id',type:'num'},{name:'correct',type:'bool'},
    {name:'mode',type:'str'},{name:'created_at',type:'str'}
  ], reviewLog));
  parts.push('');
  parts.push('-- course_lessons ('+courseLessons.length+' Zeilen)');
  parts.push(buildUpsertSQL('course_lessons', [
    {name:'id',type:'num'},{name:'course_number',type:'num'},{name:'skript',type:'num'},{name:'title',type:'str'},
    {name:'dialog_text',type:'str'},{name:'grammar_notes',type:'str'},{name:'vocab_lesson_refs',type:'str'}
  ], courseLessons));
  parts.push('');
  parts.push('-- course_exercises ('+courseExercises.length+' Zeilen)');
  parts.push(buildUpsertSQL('course_exercises', [
    {name:'id',type:'num'},{name:'course_lesson_id',type:'num'},{name:'position',type:'num'},{name:'exercise_type',type:'str'},
    {name:'instruction',type:'str'},{name:'prompt',type:'str'},{name:'solution',type:'str'},{name:'partner_status',type:'str'},
    {name:'partner_comment',type:'str'},{name:'source',type:'str'},{name:'meta',type:'json'}
  ], courseExercises));
  parts.push('');
  parts.push('-- course_progress ('+courseProgress.length+' Zeilen)');
  parts.push(buildUpsertSQL('course_progress', [
    {name:'id',type:'num'},{name:'user_id',type:'str'},{name:'course_lesson_id',type:'num'},{name:'status',type:'str'},

function triggerDownload(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Lädt alle Tabellen EINMAL und erzeugt daraus beide Dateien mit gleichem Datumsstempel:
// tounsi_db_<Datum>.md (→ Projektwissen) und tounsi_backup_<Datum>.sql (→ lokal/Drive, NICHT ins Projektwissen).
async function runCombinedExport(){
  const prog = document.getElementById('knowledge-export-progress');
  const dl = document.getElementById('knowledge-export-downloads');
  dl.style.display = 'none';
  prog.style.color = 'var(--muted)';
  try{
    prog.textContent = 'Lade lessons…';
    const lessons = await fetchAllPaged('lessons', 'id,lesson_number,title', 'lesson_number.asc');
    prog.textContent = 'Lade vocabulary…';
    const vocab = await fetchAllPaged('vocabulary', 'id,lesson_id,arabic_script,darija,german,topic,flagged,partner_status,partner_comment,status_updated_at', 'id.asc');
    prog.textContent = 'Lade users…';
    const users = await fetchAllPaged('users', 'id,username,is_admin,is_partner,created_at,last_active_at,last_reminder_sent_at', 'id.asc');
    prog.textContent = 'Lade progress…';
    const progress = await fetchAllPaged('progress', 'id,user_id,vocabulary_id,correct_count,wrong_count,review_count,next_review,last_reviewed,last_correct', 'id.asc');
    prog.textContent = 'Lade review_log…';
    const reviewLog = await fetchAllPaged('review_log', 'id,user_id,vocabulary_id,correct,mode,created_at', 'id.asc');
    prog.textContent = 'Lade course_lessons…';
    const courseLessons = await fetchAllPaged('course_lessons', 'id,course_number,skript,title,dialog_text,grammar_notes,vocab_lesson_refs', 'course_number.asc');
    prog.textContent = 'Lade course_exercises…';
    const courseExercises = await fetchAllPaged('course_exercises', 'id,course_lesson_id,position,exercise_type,instruction,prompt,solution,partner_status,partner_comment,source,meta', 'course_lesson_id.asc,position.asc');
    prog.textContent = 'Lade course_progress…';
    const courseProgress = await fetchAllPaged('course_progress', 'id,user_id,course_lesson_id,status,exercises_done,score_self,completed_at', 'id.asc');

    prog.textContent = 'Erstelle Dateien…';
    const today = new Date().toISOString().slice(0,10);
    const data = { vocab, lessons, users, progress, reviewLog, courseLessons, courseExercises, courseProgress };

    const mdContent = buildKnowledgeMD(data, today);
    const mdFilename = 'tounsi_db_' + today + '.md';

    const sqlContent = buildBackupSQL(data, today);
    const sqlFilename = 'tounsi_backup_' + today + '.sql';

    const totalRows = lessons.length+vocab.length+users.length+progress.length+reviewLog.length+courseLessons.length+courseExercises.length+courseProgress.length;

    // Beide Downloads automatisch anstoßen (leicht versetzt, damit Mobile-Browser den zweiten nicht blocken)
    triggerDownload(mdContent, mdFilename, 'text/markdown;charset=utf-8');
    setTimeout(function(){ triggerDownload(sqlContent, sqlFilename, 'text/plain;charset=utf-8'); }, 400);

    prog.textContent = '✓ ' + vocab.length + ' Vokabeln · ' + totalRows + ' Zeilen gesamt · ' + Math.round((mdContent.length+sqlContent.length)/1024) + ' KB — beide Downloads gestartet';

    // Fallback-Links, falls der Browser einen der beiden automatischen Downloads blockiert hat
    dl.innerHTML = '';
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:.72rem;color:var(--muted);margin-bottom:.2rem';
    hint.textContent = 'Nichts angekommen? Erneut einzeln herunterladen:';
    dl.appendChild(hint);

    const mdBtn = document.createElement('button');
    mdBtn.style.cssText = 'width:100%;padding:.55rem;background:var(--surface2);border:1px solid var(--gold);color:var(--gold);font-family:IBM Plex Mono,monospace;font-size:.78rem;cursor:pointer;border-radius:4px';
    mdBtn.textContent = '⬇ ' + mdFilename + ' (→ Projektwissen)';
    mdBtn.onclick = function(){ triggerDownload(mdContent, mdFilename, 'text/markdown;charset=utf-8'); };
    dl.appendChild(mdBtn);

    const sqlBtn = document.createElement('button');
    sqlBtn.style.cssText = 'width:100%;padding:.55rem;background:var(--surface2);border:1px solid var(--red);color:var(--red);font-family:IBM Plex Mono,monospace;font-size:.78rem;cursor:pointer;border-radius:4px';
    sqlBtn.textContent = '⬇ ' + sqlFilename + ' (→ lokal/Drive sichern)';
    sqlBtn.onclick = function(){ triggerDownload(sqlContent, sqlFilename, 'text/plain;charset=utf-8'); };
    dl.appendChild(sqlBtn);

    dl.style.display = 'flex';

  } catch(e) {
    prog.style.color = 'var(--red)';
    prog.textContent = 'Fehler: ' + e.message;
  }
}

async function showPartnerQueue(filter){

      'vocabulary?or=(partner_status.eq.rejected,partner_status.eq.suggested,partner_status.eq.unknown,partner_comment.not.is.null)' +

function renderPartnerQueue(){
  const el = document.getElementById('exercise-content');
  if(!el) return;
  const all = pqAllResults;

  const PS_LABEL = {
    rejected: '<span style="color:var(--red)">❌ rejected</span>',
    suggested: '<span style="color:var(--blue)">💡 suggested</span>',
    approved:  '<span style="color:var(--green)">✅ approved</span>',
    pending:   '<span style="color:var(--gold)">⏳ pending</span>',
    unknown:   '<span style="color:var(--muted)">❓ unknown</span>',
    skipped:   '<span style="color:var(--muted)">⏭ skipped</span>',
  };

  const counts = {
    all: all.length,
    rejected: all.filter(v => v.partner_status === 'rejected').length,
    suggested: all.filter(v => v.partner_status === 'suggested').length,
    unknown: all.filter(v => v.partner_status === 'unknown').length,
    commented: all.filter(v => v.partner_comment).length,
  };

  const filtered = pqFilter === 'all' ? all
    : pqFilter === 'commented' ? all.filter(v => v.partner_comment)
    : all.filter(v => v.partner_status === pqFilter);

  const chips = [
    { k:'all', label:'Alle', c:counts.all },
    { k:'rejected', label:'❌ Falsch', c:counts.rejected },
    { k:'suggested', label:'💡 Vorschlag', c:counts.suggested },
    { k:'unknown', label:'❓ Unklar', c:counts.unknown },
    { k:'commented', label:'💬 Kommentar', c:counts.commented },
  ];

  let h = '<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem">' +
    chips.map(c => '<button onclick="setPqFilter(\'' + c.k + '\')" style="padding:.3rem .6rem;font-size:.7rem;font-family:\'IBM Plex Mono\',monospace;cursor:pointer;border-radius:3px;' +
      (pqFilter===c.k ? 'background:var(--gold);border:1px solid var(--gold);color:var(--bg);font-weight:700;' : 'background:transparent;border:1px solid var(--border);color:var(--muted);') +
      '">' + c.label + ' (' + c.c + ')</button>').join('') +
    '</div>';

  if(!filtered.length){
    h += '<div style="text-align:center;padding:3rem;color:var(--muted)"><div style="font-size:2rem;margin-bottom:.8rem">✅</div><div>Keine Einträge' + (pqFilter!=='all' ? ' in diesem Filter' : '') + '</div></div>';
    el.innerHTML = h;

// Kopiert alle Felder eines Queue-Eintrags als Klartext in die Zwischenablage,
// damit Nils die Vokabel z.B. in einem anderen Claude-Chat diskutieren kann.
function copyQueueEntry(vocabId, btnEl){
  const v = pqAllResults.find(x => x.id === vocabId);
  if(!v) return;
  const ls = v.lessons ? 'L' + v.lessons.lesson_number : '?';
  const text = 'ID: ' + v.id + '\n' +
    'Arabisch: ' + (v.arabic_script || '-') + '\n' +
    'Darija: ' + (v.darija || '-') + '\n' +
    'Deutsch: ' + (v.german || '-') + '\n' +
    'Lektion: ' + ls + '\n' +
    'Thema: ' + (v.topic || '-') + '\n' +
    'Partner-Status: ' + (v.partner_status || '-') + '\n' +
    'Kommentar: ' + (v.partner_comment || '-');
  const flash = (label) => {
    if(!btnEl) return;
    const orig = btnEl.textContent;
    btnEl.textContent = label;
    setTimeout(() => { btnEl.textContent = orig; }, 1500);
  };
  const legacyCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    flash(ok ? '✓ Kopiert' : 'Fehler');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => flash('✓ Kopiert')).catch(legacyCopy);
  } else {
    legacyCopy();
  }
}

function showDupeCheck(){
  const area = document.getElementById('exercise-screen');
  if(area) area.style.display = 'block';
  const actScr = document.getElementById('act-screen');
  if(actScr){actScr.style.display='none';actScr.style.pointerEvents='none';}
  const ab = document.getElementById('act-batch-bar');
  if(ab) ab.style.display='none';
  const c = document.getElementById('exercise-content');
  c.innerHTML = '<div style="padding:1rem 0;color:var(--muted);font-size:.85rem">Suche Duplikate\u2026</div>';

  // Duplikate finden \u2014 drei Felder einzeln
  // Normalisierung: Kleinschreibung + Satzzeichen/Leerzeichen entfernen
  const groups = [];
  const seen = new Set();

  // 1. arabic_script normalisiert
  const arMap = {};
  ALL_VOCAB.forEach(v => {
    if(!v.ar) return;
    const k = normKey(v.ar);
    if(!arMap[k]) arMap[k] = [];
    arMap[k].push(v);
  });
  Object.values(arMap).forEach(grp => {
    if(grp.length < 2) return;
    const key = 'ar:' + grp.map(v=>v.id).sort().join(',');
    if(seen.has(key)) return;
    seen.add(key);
    groups.push({ type: 'Arabisch identisch', entries: grp });
  });

  // 2. darija normalisiert
  const trMap = {};
  ALL_VOCAB.forEach(v => {
    if(!v.tr) return;
    const k = normKey(v.tr);
    if(!trMap[k]) trMap[k] = [];
    trMap[k].push(v);
  });
  Object.values(trMap).forEach(grp => {
    if(grp.length < 2) return;
    const key = 'tr:' + grp.map(v=>v.id).sort().join(',');
    if(seen.has(key)) return;
    seen.add(key);
    groups.push({ type: 'Transliteration identisch', entries: grp });
  });

  // 3. german normalisiert
  const enMap = {};
  ALL_VOCAB.forEach(v => {
    if(!v.en) return;
    const k = normKey(v.en);
    if(!enMap[k]) enMap[k] = [];
    enMap[k].push(v);
  });
  Object.values(enMap).forEach(grp => {
    if(grp.length < 2) return;
    const key = 'en:' + grp.map(v=>v.id).sort().join(',');
    if(seen.has(key)) return;
    seen.add(key);
    groups.push({ type: 'Deutsch identisch', entries: grp });
  });

  if(!groups.length){
    c.innerHTML = '<div style="padding:2rem;text-align:center"><div style="font-size:2rem;margin-bottom:.8rem">\u2705</div><div style="color:var(--green);font-size:.9rem">Keine Duplikate gefunden</div></div>';
    return;
  }

  function progBadge(v){
    const p = srsProgress[v.id];
    if(!p || !p.review_count) return '<span style="background:rgba(138,125,106,.18);color:var(--muted);padding:.15rem .5rem;border-radius:3px;font-size:.72rem;white-space:nowrap">\u2b1c ungelernt</span>';
    const lvl = p.level || 0;
    const rc = p.review_count || 0;
    const clr = lvl >= 4 ? 'var(--green)' : lvl >= 2 ? 'var(--gold)' : 'var(--red)';
    return '<span style="background:rgba(76,172,110,.12);color:'+clr+';padding:.15rem .5rem;border-radius:3px;font-size:.72rem;white-space:nowrap">Lvl '+lvl+' \u00b7 '+rc+'\u00d7</span>';
  }

  function progScore(v){
    const p = srsProgress[v.id];
    if(!p || !p.review_count) return -1;
    return (p.level||0)*1000 + (p.review_count||0);
  }

  let html = '<div style="padding:.5rem 0">'
    + '<div style="color:var(--gold2);font-size:1rem;font-weight:700;margin-bottom:.4rem">\ud83d\udd0d Duplikat-Pr\u00fcfung</div>'
    + '<div style="color:var(--muted);font-size:.78rem;margin-bottom:1.2rem">'+groups.length+' Gruppe'+(groups.length!==1?'n':'')+' gefunden \u00b7 Empfehlung: ungelernte l\u00f6schen</div>';

  groups.forEach((g, gi) => {
    const sorted = [...g.entries].sort((a,b) => progScore(a) - progScore(b));
    const recommended = sorted[0];

    html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:1rem;overflow:hidden">'
      + '<div style="background:var(--surface2);padding:.5rem .8rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border-bottom:1px solid var(--border)">'+g.type+'</div>';

    g.entries.forEach(v => {
      const isRec = v.id === recommended.id;
      const eid = 'de-'+v.id;
      html += '<div id="dcard-'+v.id+'" style="padding:.75rem .8rem;border-bottom:1px solid rgba(58,50,40,.5);'+(isRec?'background:rgba(201,76,76,.06)':'')+'">'
        // Anzeige-Block
        + '<div id="dview-'+v.id+'">'
        + '<div style="font-family:\'Playfair Display\',serif;font-size:1.4rem;color:var(--gold2);direction:rtl;text-align:right;line-height:1.3;margin-bottom:.35rem">'+(v.ar||'\u2014')+'</div>'
        + '<div style="font-size:.88rem;color:var(--text);margin-bottom:.2rem">'+v.tr+'</div>'
        + '<div style="font-size:.82rem;color:var(--muted);margin-bottom:.4rem">'+v.en+'</div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem">'
        + '<div style="font-size:.65rem;color:var(--muted);opacity:.7">'+v.ls+' \u00b7 '+v.tp+' \u00b7 ID\u00a0'+v.id+'</div>'
        + '<div style="display:flex;align-items:center;gap:.4rem">'
        + progBadge(v)
        + (isRec ? '<span style="font-size:.65rem;color:var(--red);opacity:.9">\u2192 empf.</span>' : '')
        + '<button onclick="openDupeEdit('+v.id+')" style="padding:.25rem .55rem;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:\'IBM Plex Mono\',monospace;font-size:.7rem;cursor:pointer;border-radius:3px;white-space:nowrap">\u270f Bearbeiten</button>'
        + '<button onclick="deleteDupeVocab('+v.id+','+gi+')" style="padding:.25rem .55rem;background:transparent;border:1px solid var(--red);color:var(--red);font-family:\'IBM Plex Mono\',monospace;font-size:.7rem;cursor:pointer;border-radius:3px;white-space:nowrap">\ud83d\uddd1 L\u00f6schen</button>'
        + '</div>'
        + '</div>'
        + '</div>'
        // Edit-Block (hidden)
        + '<div id="dedit-'+v.id+'" style="display:none;margin-top:.5rem">'
        + '<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem">Arabisch</div>'
        + '<input id="de-ar-'+v.id+'" type="text" value="'+v.ar.replace(/"/g,'&quot;')+'" style="width:100%;direction:rtl;font-family:\'Playfair Display\',serif;font-size:1.2rem;padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);color:var(--gold2);border-radius:4px;margin-bottom:.4rem" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>'
        + '<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem">Transliteration</div>'
        + '<input id="de-tr-'+v.id+'" type="text" value="'+v.tr.replace(/"/g,'&quot;')+'" style="width:100%;padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem;margin-bottom:.4rem" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>'
        + '<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem">Deutsch</div>'
        + '<input id="de-en-'+v.id+'" type="text" value="'+v.en.replace(/"/g,'&quot;')+'" style="width:100%;padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem;margin-bottom:.4rem"/>'

        + '<input id="de-tp-'+v.id+'" type="text" value="'+v.tp.replace(/"/g,'&quot;')+'" style="width:100%;padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem;margin-bottom:.4rem" autocomplete="off"/>'
        + '<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem">Lektion</div>'
        + '<select id="de-ls-'+v.id+'" style="width:100%;padding:.5rem .7rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem;margin-bottom:.6rem"></select>'
        + '<div style="display:flex;gap:.4rem">'
        + '<button onclick="saveDupeEdit('+v.id+')" style="flex:1;padding:.5rem;background:linear-gradient(135deg,var(--gold),#a07020);border:none;color:#0e0c0a;font-family:\'IBM Plex Mono\',monospace;font-size:.78rem;font-weight:700;cursor:pointer;border-radius:4px">\u2713 Speichern</button>'

        + '</div>'
        + '</div>';
    });
    html += '</div>';
  });

  html += '</div>';
  c.innerHTML = html;
}

function openDupeEdit(id){
  document.getElementById('dview-'+id).style.display='none';
  document.getElementById('dedit-'+id).style.display='block';
  // Lektion-Dropdown befüllen
  const v = vById(id);
  const lsSel = document.getElementById('de-ls-'+id);
  if(lsSel && v){
    lsSel.innerHTML = '';
    Object.entries(LESSON_NUM_TO_ID).sort((a,b)=>a[0]-b[0]).forEach(([num, lid]) => {
      const opt = document.createElement('option');
      const lsStr = 'L'+num;
      opt.value = lsStr;
      opt.textContent = lsStr + (LESSON_TITLES[lsStr] ? ' · '+LESSON_TITLES[lsStr] : '');
      if(lsStr === v.ls) opt.selected = true;
      lsSel.appendChild(opt);
    });
  }
  const inp = document.getElementById('de-ar-'+id);
  if(inp) setTimeout(()=>inp.focus(),50);
}
function closeDupeEdit(id){
  document.getElementById('dedit-'+id).style.display='none';
  document.getElementById('dview-'+id).style.display='block';
}
async function saveDupeEdit(id){
  const ar = document.getElementById('de-ar-'+id).value.trim();
  const tr = document.getElementById('de-tr-'+id).value.trim();
  const en = document.getElementById('de-en-'+id).value.trim();
  const tp = document.getElementById('de-tp-'+id).value.trim();
  const ls = document.getElementById('de-ls-'+id).value.trim();
  const fb = document.getElementById('de-fb-'+id);
  if(!ar||!tr||!en){ fb.style.color='var(--red)'; fb.textContent='Alle Felder ausf\u00fcllen'; return; }
  fb.style.color='var(--muted)'; fb.textContent='Speichern\u2026';
  try {
    await sbApi('vocabulary?id=eq.'+id, 'PATCH', { arabic_script:ar, darija:tr, german:en, topic:tp, lesson_id:lsToId(ls) });
    const v = vById(id);
    if(v){ v.ar=ar; v.tr=tr; v.en=en; v.tp=tp; v.ls=ls; }
    showToast('\u2713 Gespeichert','ok');
    showDupeCheck();
  } catch(e){
    fb.style.color='var(--red)'; fb.textContent='Fehler: '+e.message;
  }
}

async function deleteDupeVocab(vocabId, groupIdx){
  if(!confirm('Vokabel ID '+vocabId+' wirklich l\u00f6schen?\nDieser Schritt kann nicht r\u00fcckg\u00e4ngig gemacht werden.')) return;
  try {
    if(currentUser && currentUser.id){
      await sbApi('progress?user_id=eq.'+currentUser.id+'&vocabulary_id=eq.'+vocabId, 'DELETE');
    }
    await sbApi('vocabulary?id=eq.'+vocabId, 'DELETE');
    const idx = ALL_VOCAB.findIndex(v => v.id === vocabId);
    if(idx !== -1) ALL_VOCAB.splice(idx, 1);
    delete VOCAB_BY_ID[vocabId];
    delete srsProgress[vocabId];
    for(const k of Object.keys(vocabIdMap)){
      if(vocabIdMap[k] === vocabId) delete vocabIdMap[k];
    }
    showToast('\u2713 Gel\u00f6scht (ID '+vocabId+')','ok');
    showDupeCheck();
  } catch(e){
    showToast('Fehler: '+e.message,'err');
  }
}

async function saveNewVocab(){
  const ar = document.getElementById('nv-ar').value.trim();
  const tr = document.getElementById('nv-tr').value.trim();
  const en = document.getElementById('nv-en').value.trim();
  const ls = document.getElementById('nv-ls').value;
  const tp = document.getElementById('nv-tp').value || 'Allgemein';
  const due = document.getElementById('nv-due').checked;
  const fb = document.getElementById('nv-feedback');

  if(!ar || !tr || !en){ fb.style.color='var(--red)'; fb.textContent='Alle Felder ausfüllen (außer Thema)'; return; }

  // Doppelt prüfen
  if(ALL_VOCAB.find(v=>v.tr===tr)){ fb.style.color='var(--red)'; fb.textContent='Transliteration bereits vorhanden: '+tr; return; }

  fb.style.color='var(--muted)'; fb.textContent='Speichern...';

  try{
    // Lektion-ID aus Supabase
    const lsNum = parseInt(ls.replace('L',''));
    const lessons = await sbApi('lessons?lesson_number=eq.'+lsNum+'&select=id');
    if(!lessons || !lessons.length) throw new Error('Lektion '+ls+' nicht gefunden');
    const lessonId = lessons[0].id;

    // In Supabase einfügen
    const res = await sbApi('vocabulary', 'POST', {
      lesson_id: lessonId,
      arabic_script: ar,
      darija: tr,
      german: en,
      topic: tp,
    });

    if(res && res.length){
      const newId = res[0].id;
      // Lokal hinzufügen
      const newVocab = { id: newId, ar, tr, en, ls, tp };
      ALL_VOCAB.push(newVocab);
      vocabIdMap[tr] = newId;
      VOCAB_BY_ID[newId] = newVocab;

      // Fälligkeit setzen wenn gewünscht
      if(due) await setDueToday(newId);

      fb.style.color='var(--green)';
      fb.textContent='✓ Gespeichert: '+tr+(due?' ⚡':'');

      // Felder leeren für nächste Eingabe
      document.getElementById('nv-ar').value='';
      document.getElementById('nv-tr').value='';
      document.getElementById('nv-en').value='';
      document.getElementById('nv-tp').selectedIndex=0;
      document.getElementById('nv-ar').focus();
    }
  } catch(e){
    fb.style.color='var(--red)'; fb.textContent='Fehler: '+e.message;
  }
}

async function saveCsvVocab(){
  const raw = document.getElementById('nv-csv').value.trim();
  const due = document.getElementById('nv-csv-due').checked;
  const fb = document.getElementById('nv-csv-feedback');
  if(!raw){ fb.style.color='var(--red)'; fb.textContent='Kein CSV eingegeben'; return; }

  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  // Header-Zeile überspringen
  const dataLines = lines[0].toLowerCase().includes('arabic_script') ? lines.slice(1) : lines;
  if(!dataLines.length){ fb.style.color='var(--red)'; fb.textContent='Keine Datenzeilen gefunden'; return; }

  fb.style.color='var(--muted)'; fb.textContent='Importiere '+dataLines.length+' Zeilen...';

  let ok=0, skipped=0, errors=[];

  for(const line of dataLines){
    // CSV-Split: einfaches Komma (Felder dürfen keine Kommas enthalten)
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 5){ errors.push('Ungültige Zeile: '+line.slice(0,40)); continue; }
    const [ar, tr, en, tp, lessonIdRaw] = parts;
    const lessonId = parseInt(lessonIdRaw);

    if(!ar || !tr || !en || !lessonId){ errors.push('Fehlende Felder: '+tr); continue; }

    // Duplikat prüfen
    if(ALL_VOCAB.find(v=>v.tr===tr)){ skipped++; continue; }

    try{
      const res = await sbApi('vocabulary', 'POST', {
        lesson_id: lessonId,
        arabic_script: ar,
        darija: tr,
        german: en,
        topic: tp || 'Allgemein',
        partner_status: 'pending',
        status_updated_at: new Date().toISOString(),
      });
      if(res && res.length){
        const newId = res[0].id;
        // Lektion-Kürzel ermitteln
        const lsObj = ALL_VOCAB.find(v=>v.ls); // nur für Format
        const nv = { id: newId, ar, tr, en, ls:'L?', tp: tp||'Allgemein' };
        ALL_VOCAB.push(nv);
        vocabIdMap[tr] = newId;
        VOCAB_BY_ID[newId] = nv;
        if(due) await setDueToday(newId);
        ok++;
      }
    } catch(e){
      errors.push(tr+': '+e.message);
    }
  }

  let msg = '✓ '+ok+' importiert';
  if(skipped) msg += ', '+skipped+' übersprungen (Duplikat)';
  if(due && ok) msg += ' ⚡';
  if(errors.length) msg += ' | ⚠️ '+errors.join('; ');
  fb.style.color = errors.length ? 'var(--red)' : 'var(--green)';
  fb.textContent = msg;
  if(ok>0) document.getElementById('nv-csv').value='';
}

function _actBindEvents(){
  document.querySelectorAll('.act-pchip').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.act-pchip').forEach(x=>{x.style.borderColor='var(--border)';x.style.color='var(--muted)';x.style.background='transparent';x.classList.remove('active');});
      b.style.borderColor='var(--gold2)';b.style.color='var(--gold2)';b.style.background='rgba(201,168,76,0.08)';b.classList.add('active');
      _actPrioFilter=b.dataset.prio;_actApplyFilters();
    });
  });
  document.getElementById('act-sort').addEventListener('change',e=>{_actSort=e.target.value;_actApplyFilters();});
  document.getElementById('act-check-all').addEventListener('change',e=>{
    _actFiltered.forEach(v=>{if(e.target.checked)_actSelected.add(v.id);else _actSelected.delete(v.id);});
    _actRender();
  });
  document.getElementById('act-btn-topn').addEventListener('click',()=>{
    const n=parseInt(document.getElementById('act-batch-n').value)||10;
    _actSelected.clear();_actFiltered.slice(0,n).forEach(v=>_actSelected.add(v.id));_actRender();
  });
  document.getElementById('act-btn-clear').addEventListener('click',()=>{_actSelected.clear();_actRender();});
  document.getElementById('act-btn-go').addEventListener('click',_actActivate);
}

function _actApplyFilters(){
  // Build topic chips once
  const topicBar=document.getElementById('act-topic-bar');
  if(topicBar && topicBar.children.length===0){
    const topics=[...new Set(_actVocab.map(v=>v.tp||'–'))].sort();
    topics.forEach(t=>{
      const b=document.createElement('button');
      b.textContent=t;b.dataset.topic=t;
      b.style.cssText='padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);font-family:inherit;font-size:10px;cursor:pointer';
      b.addEventListener('click',()=>{
        const on=b.style.color!=='var(--gold)' && !b.style.color.includes('201');
        if(on){_actTopicFilter.add(t);b.style.borderColor='var(--gold)';b.style.color='var(--gold)';b.style.background='rgba(201,168,76,0.08)';}
        else{_actTopicFilter.delete(t);b.style.borderColor='var(--border)';b.style.color='var(--muted)';b.style.background='transparent';}
        _actApplyFilters();      });
      topicBar.appendChild(b);
    });
  }

  _actFiltered=_actVocab.filter(v=>{
    const pr=actGetPrio(v);
    const prioOk=_actPrioFilter==='all'||pr.prio===parseInt(_actPrioFilter);
    const topicOk=_actTopicFilter.size===0||_actTopicFilter.has(v.tp||'–');
    return prioOk&&topicOk;
  });

  _actFiltered.sort((a,b)=>{
    if(_actSort==='prio'){const pa=actGetPrio(a).prio||99,pb=actGetPrio(b).prio||99;return pa!==pb?pa-pb:(a.tp||'').localeCompare(b.tp||'');}
    if(_actSort==='topic')return (a.tp||'').localeCompare(b.tp||'')||a.id-b.id;
    if(_actSort==='lesson')return lsNum(a)-lsNum(b);
    if(_actSort==='alpha')return (a.en||'').localeCompare(b.en||'','de');
    return 0;
  });

  _actRender();
}

function _actRender(){
  const tbody=document.getElementById('act-tbody');
  if(!tbody)return;
  tbody.innerHTML='';

  const PRIO_STYLE={1:'background:rgba(207,102,121,0.12);color:#cf6679;border:1px solid rgba(207,102,121,0.25)',2:'background:rgba(212,132,74,0.1);color:#d4844a;border:1px solid rgba(212,132,74,0.2)',3:'background:rgba(91,155,213,0.1);color:#5b9bd5;border:1px solid rgba(91,155,213,0.2)',0:'background:transparent;color:var(--muted);border:1px solid var(--border)'};
  const PRIO_ICON={1:'🔴',2:'🟠',3:'🔵',0:'⚪'};

  _actFiltered.forEach(v=>{
    const pr=actGetPrio(v);
    const sel=_actSelected.has(v.id);
    const tr=document.createElement('tr');
    tr.style.cssText=`border-bottom:1px solid var(--border);${sel?'background:rgba(201,168,76,0.05)':''}`;
    tr.innerHTML=`
      <td style="position:sticky;left:0;z-index:1;background:${sel?'rgba(201,168,76,0.05)':'var(--bg)'};padding:6px 4px"><input type="checkbox" data-id="${v.id}" ${sel?'checked':''} style="accent-color:var(--gold)"></td>
      <td style="padding:6px 8px;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;direction:rtl">${v.ar||''}</td>
      <td style="padding:6px 8px;color:var(--gold)">${v.tr||''}</td>
      <td style="padding:6px 8px">${v.en||''}</td>
      <td style="padding:6px 8px;color:var(--muted);font-size:11px">${v.ls}</td>
      <td style="padding:6px 8px;white-space:nowrap"><span style="display:inline-block;padding:2px 5px;border-radius:2px;font-size:10px;${PRIO_STYLE[pr.prio]}">${PRIO_ICON[pr.prio]} ${pr.label}</span></td>`;
    tr.querySelector('input').addEventListener('change',e=>{
      const id=parseInt(e.target.dataset.id);
      if(e.target.checked)_actSelected.add(id);else _actSelected.delete(id);
      const bg=e.target.checked?'rgba(201,168,76,0.05)':'';
      tr.style.background=bg;
      const stickyTd=tr.querySelector('td');
      if(stickyTd)stickyTd.style.background=e.target.checked?'rgba(201,168,76,0.05)':'var(--bg)';
      _actUpdateStats();
    });
    tbody.appendChild(tr);
  });

  const empty=document.getElementById('act-empty');
  const tbl=document.getElementById('act-table');
  if(_actFiltered.length===0){if(empty)empty.style.display='block';if(tbl)tbl.style.display='none';}
  else{if(empty)empty.style.display='none';if(tbl)tbl.style.display='table';}

  _actUpdateStats();
}

function _actUpdateStats(){
  const t=document.getElementById('act-stat-total');if(t)t.textContent=_actVocab.length;
  const s=document.getElementById('act-stat-shown');if(s)s.textContent=_actFiltered.length;
  const sel=document.getElementById('act-stat-sel');if(sel)sel.textContent=_actSelected.size;
  const d=document.getElementById('act-stat-done');if(d)d.textContent=_actDone;
  const btn=document.getElementById('act-btn-go');
  if(btn){btn.disabled=_actSelected.size===0;btn.style.opacity=_actSelected.size>0?'1':'0.4';}
  const info=document.getElementById('act-btn-info');
  if(info)info.innerHTML=_actSelected.size>0?`<b>${_actSelected.size}</b> Vokabeln werden auf <b>jetzt fällig</b> gesetzt`:'';
}

async function _actActivate(){
  const ids=[..._actSelected];if(!ids.length)return;
  if(!currentUser){showToast('Fehler: nicht eingeloggt','err');return;}
  if(ids.length>=10 && !confirm(`${ids.length} Vokabeln fällig setzen?`))return;
  const btn=document.getElementById('act-btn-go');btn.disabled=true;btn.textContent='…';
  const bar=document.getElementById('act-progress-bar');const fill=document.getElementById('act-progress-fill');
  if(bar)bar.style.display='block';

  const now=new Date().toISOString();
  let done=0;
  try{
    const total=ids.length;
    const chunk=50;

    // Für jeden Row: PATCH wenn Progress-Row existiert (p.id bekannt), sonst INSERT
    for(let i=0;i<ids.length;i+=chunk){
      const batch=ids.slice(i,i+chunk);
      await Promise.all(batch.map(async id=>{
        const p=srsProgress[id];
        if(p && p.id){
          // Bestehender Row: nur next_review updaten
          const r=await fetch(`${SB_URL}/rest/v1/progress?id=eq.${p.id}`,{
            method:'PATCH',
            headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({next_review:now})
          });
          if(!r.ok){const e=await r.text();throw new Error(e);}
        } else {
          // Neuer Row: INSERT — bei Duplicate-Key automatisch auf PATCH umschwenken
          const r=await fetch(`${SB_URL}/rest/v1/progress`,{
            method:'POST',
            headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',
              Prefer:'return=representation'},
            body:JSON.stringify({user_id:currentUser.id,vocabulary_id:id,correct_count:0,wrong_count:0,review_count:0,next_review:now})
          });
          if(!r.ok){
            const eText=await r.text();
            const isDup=eText.includes('23505');
            if(isDup){
              // Row existiert bereits — GET id, dann PATCH
              const fetched=await sbApi('progress?user_id=eq.'+currentUser.id+'&vocabulary_id=eq.'+id+'&select=id');
              if(fetched && fetched[0]){
                const existingId=fetched[0].id;
                if(!srsProgress[id]) srsProgress[id]={};
                srsProgress[id].id=existingId;
                await fetch(`${SB_URL}/rest/v1/progress?id=eq.${existingId}`,{
                  method:'PATCH',
                  headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
                  body:JSON.stringify({next_review:now})
                });
              }
            } else { throw new Error(eText); }
          } else {
            const saved=await r.json().catch(()=>[]);
            let savedId = saved && saved[0] && saved[0].id ? saved[0].id : null;
            if(!savedId){
              const fetched=await sbApi('progress?user_id=eq.'+currentUser.id+'&vocabulary_id=eq.'+id+'&select=id');
              if(fetched && fetched[0]) savedId=fetched[0].id;
            }
            if(savedId){
              if(!srsProgress[id]) srsProgress[id]={};
              srsProgress[id].id=savedId;
            }
          }
        }
      }));
      done+=batch.length;
      if(fill)fill.style.width=`${Math.round(done/total*100)}%`;
    }

    // Lokales srsProgress updaten
    const nowDate=new Date(now);
    ids.forEach(id=>{
      if(!srsProgress[id]) srsProgress[id]={level:0,correct_count:0,review_count:0};
      srsProgress[id].next_review=nowDate;  // als Date-Objekt wie beim Laden
    });

    _actDone+=ids.length;_actSelected.clear();
    // Remove activated from _actVocab
    _actVocab=_actVocab.filter(v=>!ids.includes(v.id));
    _actApplyFilters();
    _actUpdateStats();
    showToast(`✓ ${ids.length} Vokabeln aktiviert!`,'ok');
  }catch(e){
    showToast('Fehler: '+e.message,'err');
  }
  if(bar)setTimeout(()=>{bar.style.display='none';if(fill)fill.style.width='0%';},1500);
  btn.textContent='✓ Jetzt fällig setzen';btn.disabled=_actSelected.size===0;
}

function showToast(msg,type){
  let el=document.getElementById('act-toast');
  if(!el){el=document.createElement('div');el.id='act-toast';el.style.cssText='position:fixed;bottom:24px;right:24px;padding:10px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none';document.body.appendChild(el);}
  el.textContent=msg;
  el.style.borderColor=type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--border)';
  el.style.color=type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--text)';
  el.style.opacity='1';el.style.transform='translateY(0)';
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';},3000);
}

// Globales Auffangnetz: unerwartete Fehler sollen sichtbar sein statt nur in der Konsole zu verschwinden.
window.addEventListener('error', (e) => {
  dbg('Unerwarteter Fehler: '+(e.message||e), 'err');
  showToast('⚠️ Unerwarteter Fehler: '+(e.message||'siehe Debug-Log'), 'err');
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  dbg('Unbehandelte Promise-Ablehnung: '+msg, 'err');
  showToast('⚠️ Unerwarteter Fehler: '+msg, 'err');
});

</script>

  <div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">
    <span style="color:#c9a84c;font-weight:700;">DEBUG</span>
    <button onclick="document.getElementById('debug-panel').style.display='none'" style="background:none;border:none;color:#c94c4c;cursor:pointer;font-size:.8rem;">✕</button>
  </div>
  <div id="debug-log"></div>
</div>

    <input id="ei-ar" placeholder="Arabisch" style="font-family:'Playfair Display',serif;direction:rtl;font-size:1rem;padding:.5rem;background:var(--surface);border:1px solid var(--border);color:var(--gold2);border-radius:4px">
    <input id="ei-tr" placeholder="Transliteration" style="padding:.5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem">

      <input id="ei-tp" placeholder="Topic" style="flex:1;padding:.5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.85rem" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <select id="ei-ls" style="width:7rem;padding:.5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.85rem"></select>
    </div>
    <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">

      <label style="color:var(--muted);font-size:.75rem;white-space:nowrap">Level:</label>

    </div>
    <div style="display:flex;gap:.4rem;align-items:center">
      <label style="font-size:.72rem;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em">Partner:</label>
      <select id="ei-ps" style="flex:1;padding:.4rem .5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.8rem;font-family:'IBM Plex Mono',monospace">
        <option value="">— kein Status —</option>
        <option value="pending">⏳ pending</option>
        <option value="approved">✅ approved</option>
        <option value="rejected">❌ rejected</option>
        <option value="unknown">❓ unknown</option>
        <option value="skipped">⏭ skipped</option>
        <option value="suggested">💡 suggested</option>
      </select>
    </div>
    <textarea id="ei-pc" placeholder="Partner-Kommentar…" rows="2" style="width:100%;padding:.5rem;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.82rem;font-family:'IBM Plex Mono',monospace;resize:none;outline:none"></textarea>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <button onclick="saveVocabEditSheet()" style="flex:1;background:var(--gold);border:none;color:#0e0c0a;padding:.5rem;cursor:pointer;border-radius:4px;font-weight:700;font-size:.85rem">Speichern</button>
      <button id="sheet-flag-btn" onclick="toggleFlagSheet()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:.5rem .8rem;cursor:pointer;border-radius:4px;font-size:.85rem">🏳️</button>
      <button onclick="deleteVocabSheet()" style="background:none;border:1px solid var(--red);color:var(--red);padding:.5rem .8rem;cursor:pointer;border-radius:4px;font-size:.85rem">🗑</button>
    </div>
  </div>
