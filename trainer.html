<script>

// Einzige Quelle für die Versionsnummer (Android-Cache-Buster). Bei Bedarf hier hochzählen.
const APP_VERSION = 'v18';

function normalize(s){
  if(!s)return'';
  s=s.trim().toLowerCase();
  // Diakritische Zeichen
  s=s.replace(/[éèêë]/g,'e').replace(/[àâäå]/g,'a');
  s=s.replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûüùú]/g,'u');
  s=s.replace(/ñ/g,'n').replace(/ç/g,'c');
  // Deutsche Tastatur-Ersatz: ae→ä→a, oe→ö→o, ue→ü→u, ß→ss
  s=s.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
  s=s.replace(/ß/g,'ss');
  // Arabische Umschrift (Arabizi/Chat-Alphabet)
  // Sonderzeichen zuerst normieren
  s=s.replace(/ʿ/g,'3').replace(/ħ/g,'7').replace(/ʔ/g,'2');
  // 9 = ق (Qāf) → k, q → k (beide Schreibweisen akzeptieren)
  s=s.replace(/9/g,'k').replace(/q/g,'k');
  // 2 = ء (Hamza, Glottisschlag) → leer
  s=s.replace(/2/g,'');
  // 7→h (ح) VOR kh-Ersatz, damit ak7al→akhal→axal = akhal→axal
  s=s.replace(/7/g,'h');
  // 3 = ع (ʿAin, tiefer Kehllaut) → a (im Tunesischen meist als 'a' realisiert)
  s=s.replace(/3/g,'a');
  // Konsonanten-Varianten (Reihenfolge wichtig: längere zuerst)
  s=s.replace(/sch/g,'sh').replace(/kh/g,'x').replace(/ch/g,'x');
  s=s.replace(/gh/g,'g').replace(/dh/g,'d').replace(/th/g,'t');
  s=s.replace(/tj/g,'j').replace(/dj/g,'j'); // dj→j
  // Artikel
  s=s.replace(/\bel[\-\s]/g,'el ').replace(/\bal[\-\s]/g,'el ');
  // Vokal-Varianten
  s=s.replace(/oo/g,'u').replace(/ou/g,'u').replace(/ey/g,'i').replace(/ei/g,'i');
  // y am Wortende → i (3andy→3andi)
  s=s.replace(/y$/g,'i').replace(/y(\s)/g,'i$1');
  // Doppelkonsonanten → einfach (kaddesh→kadesh)
  s=s.replace(/([bcdfghjklmnpqrstvwxz])\1/g,'$1');
  // Doppelvokale → einfach (naana→nana, ii→i, uu→u)
  s=s.replace(/([aeiou])\1+/g,'$1');
  // Klammern entfernen (m.) (f.) etc.
  s=s.replace(/\([^)]*\)/g,'');
  // Satzzeichen + Bindestrich
  s=s.replace(/-/g,'').replace(/[?!.,;:\u2014\u2013()"\u00ab\u00bb]/g,'');
  // Alle Leerzeichen entfernen
  s=s.replace(/\s/g,'');
  return s;
}

function levenshtein(a, b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)
    for(let j=1;j<=n;j++)
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function checkAnswer(input, answer){
  const rawInput = input.trim().toLowerCase();
  const n = normalize(input);
  const rawVariants = answer.split(/\s*\/\s*/).map(v => v.trim()).filter(v=>v!=='');
  // Roher Match (für Zahlen und Sonderfälle die normalize zerstört)
  if(rawVariants.some(v => v.toLowerCase() === rawInput)) return {ok:true, exact:true, correct:answer};
  const variants = rawVariants.map(v => normalize(v)).filter(v=>v!=='');
  // Exakter Match nach Normierung
  if(variants.some(v => n === v)) return {ok:true, exact:true, correct:answer};
  // Fuzzy: 1 Buchstabe Toleranz ab 5 Zeichen
  const best = variants.filter(v=>v!=='').reduce((b,v)=>{
    const d=levenshtein(n,v);
    return d<b.dist?{dist:d,v}:b;
  },{dist:99,v:''});
  if(best.dist===1 && n.length>=5){
    return {ok:true, exact:false, correct:answer};
  }
  return {ok:false, exact:false, correct:answer};
}



// Debug Panel
let IS_DEBUG = false;
function toggleDebug(){
  IS_DEBUG = !IS_DEBUG;
  const panel = document.getElementById('debug-panel');
  const btn = document.getElementById('dbg-btn');

  if(!panel){
    console.error('debug-panel fehlt');
    return;
  }

  if(IS_DEBUG){
    panel.style.display = 'block';
    if(btn) btn.style.background = 'rgba(201,168,76,.3)';
    dbg('=== DEBUG AN ===', 'ok');
    dbg('vocabIdMap: ' + Object.keys(vocabIdMap).length + ' Einträge', Object.keys(vocabIdMap).length > 0 ? 'ok' : 'err');
    dbg('srsProgress: ' + Object.keys(srsProgress).length + ' Einträge', 'ok');
    dbg('User: ' + (currentUser ? currentUser.username : 'nicht eingeloggt'), currentUser ? 'ok' : 'err');
  } else {
    panel.style.display = 'none';
    if(btn) btn.style.background = '';
  }
}
function dbg(msg, cls){
  if(!IS_DEBUG) return;
  const panel = document.getElementById('debug-panel');
  const log = document.getElementById('debug-log');
  if(!panel || !log) return;
  panel.style.display = 'block';
  const d = document.createElement('div');
  d.style.color = cls==='err' ? '#c94c4c' : cls==='ok' ? '#4cac6e' : '#f0e8d8';
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}


// Lateinisch ein/aus

// ══ SRS — Spaced Repetition (Tage-basiert, Supabase) ════════════════════════
const SRS_DAYS = [1, 1, 3, 7, 14, 30, 90]; // Tage pro Level 0-6
let srsProgress = {}; // {darija_tr: {id, level, next_review, vocabulary_id}}
let flaggedVocab = new Set(); // vocab tr-Keys die als fehlerhaft markiert sind
let vocabIdMap = {};  // {darija_tr: vocabulary_id}
let VOCAB_BY_ID = {}; // {vocabulary_id: ALL_VOCAB-Eintrag} — O(1)-Lookup, kollisionsfrei (im Gegensatz zu vocabIdMap)
function vById(id){ return VOCAB_BY_ID[id] || null; }

// ── Audio-Wiedergabe (ninja_audio_url) ──────────────────────────────────────
let _audioPlayer = null;
function playVocabAudio(url, ev){
  if(ev) ev.stopPropagation();
  if(!url) return;
  try{
    if(_audioPlayer){ _audioPlayer.pause(); _audioPlayer = null; }
    _audioPlayer = new Audio(url);
    _audioPlayer.play().catch(()=>{});
  }catch(e){}
}

// ── Lade-Overlay-Steuerung ───────────────────────────────────────────────────
const LOAD_COUNT_KEY = 'tounsi_vocab_count'; // letzte bekannte Vokabelzahl für Balken-Schätzung
function loadOverlayShow(resetPhase=true){
  const o = document.getElementById('load-overlay');
  const alreadyVisible = o && o.style.display === 'flex';
  if(o){ o.style.display='flex'; }
  const r = document.getElementById('load-retry');

  // Zwischenstand (z.B. "Verbunden — synchronisiere…") → nicht auf 0% zurückspringen.
  if(resetPhase && !alreadyVisible) loadOverlayUpdate('Verbinde…', 0, '');
}
function loadOverlayHide(){
  const o = document.getElementById('load-overlay');
  if(o) o.style.display='none';
}
function loadOverlayUpdate(phase, pct, detail){
  const p = document.getElementById('load-phase');
  const b = document.getElementById('load-bar');
  const d = document.getElementById('load-detail');
  if(p && phase != null) p.textContent = phase;
  if(b && pct != null) b.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if(d) d.innerHTML = detail || '&nbsp;';
}
function loadOverlayError(msg){
  loadOverlayUpdate('Fehler beim Laden', null, msg || 'Verbindung fehlgeschlagen');
  const r = document.getElementById('load-retry');
  if(r) r.style.display='inline-block';
}
function retryLoad(){
  if(currentUser) enterApp(currentUser);

async function srsLoadFromSupabase(){
  if(!currentUser) return;
  try{
    // Vokabeln und Progress sind unabhängig → PARALLEL laden (spart ~30-40% Startzeit)
    let estTotal = parseInt(localStorage.getItem(LOAD_COUNT_KEY)||'0',10) || 3000;
    let _vLoaded = 0, _pLoaded = 0;
    const _updLoadUI = () => {
      const pct = Math.min(90, Math.round(_vLoaded / Math.max(estTotal, _vLoaded) * 90));
      loadOverlayUpdate('Daten laden…', pct, _vLoaded + ' / ~' + Math.max(estTotal, _vLoaded) + ' Vokabeln · ' + _pLoaded + ' Fortschritte');
    };
    _updLoadUI();

    const loadVocabTask = sbApiPaged(
      'vocabulary?select=id,darija,arabic_script,german,topic,flagged,partner_status,partner_comment,status_updated_at,ninja_audio_url,lessons(lesson_number)&order=id.asc',
      1000,
      (loaded) => { _vLoaded = loaded; _updLoadUI(); }
    );

    const loadProgressTask = sbApiPaged(
      'progress?user_id=eq.'+currentUser.id+'&select=id,vocabulary_id,correct_count,wrong_count,review_count,next_review,last_reviewed,last_correct&order=id.asc',
      1000,
      (loaded) => { _pLoaded = loaded; _updLoadUI(); }
    );

    const [allVocab, allProgress] = await Promise.all([loadVocabTask, loadProgressTask]);
    // Tatsächliche Zahl merken → Balken beim nächsten Start präzise
    try{ localStorage.setItem(LOAD_COUNT_KEY, String(allVocab.length)); }catch(e){}
    loadOverlayUpdate('Daten laden…', 95, allVocab.length + ' Vokabeln · ' + allProgress.length + ' Fortschritte');

    // vocabIdMap befüllen (darija→id, nur als Fallback)
    allVocab.forEach(v => { vocabIdMap[v.darija] = v.id; });
    dbg('Geladen: ' + allVocab.length + ' Vokabeln', 'ok');

    // ALL_VOCAB aus Supabase befüllen — id direkt mitspeichern
    ALL_VOCAB.length = 0;
    VOCAB_BY_ID = {};
    allVocab.forEach(v => {
      const ls = v.lessons ? 'L' + v.lessons.lesson_number : 'L1';
      const tp = v.topic || 'Allgemein';
      const entry = { id: v.id, ar: v.arabic_script||'', tr: v.darija||'', en: v.german||'', ls, tp, ps: v.partner_status||null, pc: v.partner_comment||null, psu: v.status_updated_at||null, au: v.ninja_audio_url||null };
      ALL_VOCAB.push(entry);
      VOCAB_BY_ID[v.id] = entry;
      if(v.flagged) flaggedVocab.add(v.darija||'');
    });
    dbg('ALL_VOCAB: ' + ALL_VOCAB.length + ' Einträge', 'ok');

    const progress = allProgress;
    dbg('progress geladen: '+progress.length+' Einträge', 'ok');
    progress.forEach(p => {
      const level = Math.min(p.correct_count, 6);
      const toUTC = s => {
        if(!s) return null;
        // Bereits Z am Ende → direkt parsen
        if(s.endsWith('Z')) return new Date(s);
        // Hat Timezone-Offset (+00:00, +02:00 etc.) → direkt parsen, Browser versteht ISO 8601
        if(s.includes('+') || s.match(/[0-9]-[0-9]{2}:[0-9]{2}$/)) return new Date(s);
        // Kein Timezone-Suffix (timestamp ohne tz) → als UTC behandeln
        return new Date(s + 'Z');
      };
      srsProgress[p.vocabulary_id] = {
        id: p.id,
        vocabulary_id: p.vocabulary_id,
        level: level,
        next_review: toUTC(p.next_review),
        review_count: p.review_count || 0,
        wrong_count: p.wrong_count || 0,
        last_reviewed: toUTC(p.last_reviewed),
        last_correct: toUTC(p.last_correct),
      };
    });
    const vmSize = Object.keys(vocabIdMap).length;
    const spSize = Object.keys(srsProgress).length;
    dbg('vocabIdMap: ' + vmSize + ' Einträge', vmSize > 0 ? 'ok' : 'err');
    dbg('progress: ' + spSize + ' Einträge', 'ok');
    // Nächste fällige Vokabel anzeigen
    const now = new Date();
    let nextDue = null;
    let nextDueWord = null;
    let nextDueKey = null;
    Object.entries(srsProgress).forEach(([vid, p]) => {
      if(p.next_review){
        const nr = new Date(p.next_review);
        if(nr > now && (!nextDue || nr < nextDue)){
          nextDue = nr;
          nextDueWord = vid;
          nextDueKey = vid;
        }
      }
    });
    // Vokabeln ohne Progress zählen
    const withProgress = new Set(Object.keys(srsProgress).map(Number));
    const noProgress = ALL_VOCAB.filter(v => {
      return v.id && !withProgress.has(v.id);
    }).length;
    dbg('Ohne Progress (immer fällig): '+noProgress+' Vokabeln', noProgress>0?'err':'ok');

    if(nextDue){
      const diff = Math.round((nextDue - now) / 60000);
      const diffStr = diff < 60 ? diff+'min' : diff < 1440 ? Math.round(diff/60)+'h' : Math.round(diff/1440)+'T';
      const word = vById(nextDueWord);

      dbg(
        'Nächste Fälligkeit: ' +
        (word ? word.tr : nextDueWord) +
        ' in ' + diffStr +
        ' (' + nextDue.toLocaleString() + ')',
        'info'
      );
    } else {
      dbg('Alle fällig oder kein next_review gesetzt', 'info');
    }

    if(vmSize > 0){
      const k = Object.keys(vocabIdMap)[0];
      dbg('Beispiel: "' + k + '" → id ' + vocabIdMap[k], 'ok');
    }
  } catch(e){
    dbg('FEHLER load: ' + e.message, 'err');
    loadOverlayError(e.message);
    throw e; // enterApp bricht den Erfolgsflow ab, Overlay bleibt mit Retry-Button stehen
  }
}

// Berechnet next_review als 03:00 Uhr Berliner Zeit, n Tage ab heute
// Jitter-Toleranz pro Level (±Tage) — nur L3+
const SRS_JITTER = [0, 0, 0, 2, 3, 5, 10]; // index = level 0-6

function srsJitter(level){
  const j = SRS_JITTER[level] || 0;
  if(!j) return 0;
  return Math.round((Math.random() * 2 - 1) * j); // -j .. +j
}

function nextReviewDE(days, jitterDays=0){
  // Zieldatum: heute + n Tage (UTC-basiert als Ausgangspunkt)
  const now = new Date();
  const future = new Date(now.getTime() + (days + jitterDays) * 24 * 60 * 60 * 1000);

  // Datum in Berliner Zeit auslesen (z.B. "2026-05-18")
  const berlinDate = future.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
  // berlinDate = "YYYY-MM-DD"

  // 03:00 Uhr Berlin = ISO-String "YYYY-MM-DDT03:00:00" in Europe/Berlin
  // Wir berechnen den UTC-Äquivalent dieses Zeitpunkts:
  // Trick: erzeuge einen Datumspunkt dessen .toLocaleString in Berlin "03:00" ergibt
  const [y, m, d] = berlinDate.split('-').map(Number);

  // Binäre Suche wäre overkill — wir nutzen den bekannten Offset:
  // CET = UTC+1, CEST = UTC+2
  // Wir probieren beide und nehmen den korrekten
  for(const offsetH of [1, 2]){
    const candidate = new Date(Date.UTC(y, m - 1, d, 3 - offsetH, 0, 0));
    const check = candidate.toLocaleString('de-DE', {
      timeZone: 'Europe/Berlin',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    if(check === '03:00' || check === '3:00') return candidate;
  }
  // Fallback: einfach 03:00 UTC+1
  return new Date(Date.UTC(y, m - 1, d, 2, 0, 0));
}

// Bulk-Glättung: lastgesteuerter Ausgleich für L3+ Vokabeln
async function smoothSchedule(){
  const resultEl = document.getElementById('smooth-result');
  if(resultEl) resultEl.innerHTML = '<span style="color:var(--muted)">Berechne…</span>';

  const today = new Date(); today.setHours(0,0,0,0);

  // 1. Kandidaten sammeln (L3+, künftige Fälligkeit)
  const candidates = [];
  let skippedNoLR = 0, skippedDue = 0, skippedWindow = 0;

  ALL_VOCAB.forEach(v => {
    const p = srsProgress[v.id];
    if(!p || !p.next_review || p.level < 3) return;

    const nr = new Date(p.next_review); nr.setHours(0,0,0,0);
    const diffCurrent = Math.round((nr - today) / 86400000);
    const jitter = SRS_JITTER[p.level] || 0;

    if(diffCurrent <= 0){
      // Vergangenheit oder heute: Fenster ist [0, jitter] ab heute
      candidates.push({ p, diffCurrent, lo: 0, hi: jitter, isPast: true });
      return;
    }

    if(!p.last_reviewed){ skippedNoLR++; return; }
    const lr = new Date(p.last_reviewed); lr.setHours(0,0,0,0);
    const idealDiff = Math.round((lr - today) / 86400000) + SRS_DAYS[p.level];
    const lo = Math.max(0, idealDiff - jitter);
    const hi = idealDiff + jitter;

    if(diffCurrent < lo){
      // Zu früh gesetzt (vor dem idealen Fenster) → wie Vergangenheit behandeln
      candidates.push({ p, diffCurrent, lo: 0, hi: jitter, isPast: true });
      return;
    }
    if(diffCurrent > hi){
      // Zu spät gesetzt (nach dem idealen Fenster) → Fenster ans aktuelle Datum ankern
      candidates.push({ p, diffCurrent, lo: Math.max(0, diffCurrent - jitter), hi: diffCurrent + jitter, isPast: false });
      return;
    }

    candidates.push({ p, diffCurrent, lo, hi, isPast: false });
  });

  dbg(`smooth: ${candidates.length} Kandidaten, ${skippedNoLR} kein LR, ${skippedWindow} außerhalb Fenster`, 'info');

  if(candidates.length === 0){
    if(resultEl) resultEl.innerHTML = `<span style="color:var(--muted)">Keine Kandidaten (${skippedNoLR} ohne last_reviewed, ${skippedWindow} außerhalb Fenster).</span>`;
    return;
  }

  // 2. Tageslast-Map (Tag 0 = heute, Vergangenheit zählt als Tag 0)
  const MAX_DAY = 200;
  const load = new Array(MAX_DAY + 1).fill(0);
  ALL_VOCAB.forEach(v => {
    const p = srsProgress[v.id];
    if(!p || !p.next_review) return;
    const nr = new Date(p.next_review); nr.setHours(0,0,0,0);
    const diff = Math.round((nr - today) / 86400000);
    if(diff <= 0) load[0]++;           // heute + Vergangenheit → Tag 0
    else if(diff <= MAX_DAY) load[diff]++;
  });

  // 3. Sortierung: heute-fällig zuerst, dann Vergangenheit, dann Zukunft
  //    Innerhalb jeder Gruppe: niedrige Level zuerst (kleineres Fenster → weniger Spielraum)
  //    Vergangenheit: weniger weit zurück zuerst
  //    Zukunft: Spitzen zuerst (nach Last), bei gleicher Last niedrige Level bevorzugt
  candidates.sort((a, b) => {
    const aGroup = a.diffCurrent === 0 ? 0 : a.isPast ? 1 : 2;
    const bGroup = b.diffCurrent === 0 ? 0 : b.isPast ? 1 : 2;
    if(aGroup !== bGroup) return aGroup - bGroup;
    if(aGroup === 1) {
      // Vergangenheit: weniger weit zurück zuerst, bei Gleichstand niedrige Level zuerst
      if(b.diffCurrent !== a.diffCurrent) return b.diffCurrent - a.diffCurrent;
      return a.p.level - b.p.level;
    }
    if(aGroup === 2) {
      // Zukunft: niedrige Level zuerst, bei Gleichstand Spitzen zuerst
      if(a.p.level !== b.p.level) return a.p.level - b.p.level;
      return (load[Math.min(b.diffCurrent, MAX_DAY)]||0) - (load[Math.min(a.diffCurrent, MAX_DAY)]||0);
    }
    // Heute: niedrige Level zuerst
    return a.p.level - b.p.level;
  });

  const updates = [];
  candidates.forEach(({ p, diffCurrent, lo, hi }) => {
    const clampedHi = Math.min(hi, MAX_DAY);
    if(lo > clampedHi) return;

    // Für Vergangenheit: diffCurrent ist negativ, als Referenz für Last nicht nutzbar
    const currentLoadDay = Math.max(0, Math.min(diffCurrent, MAX_DAY));
    let bestDay = lo; // default: frühestmöglicher Tag im Fenster
    let bestLoad = load[lo] || 0;
    for(let d = lo; d <= clampedHi; d++){
      if((load[d] || 0) < bestLoad){ bestLoad = load[d]||0; bestDay = d; }
    }

    // Nur updaten wenn sich etwas ändert
    if(bestDay === diffCurrent) return;

    if(diffCurrent >= 0 && diffCurrent <= MAX_DAY) load[diffCurrent] = Math.max(0, (load[diffCurrent]||0) - 1);
    else if(diffCurrent < 0) load[0] = Math.max(0, (load[0]||0) - 1); // Vergangenheit zählte als Tag 0
    load[bestDay] = (load[bestDay]||0) + 1;
    updates.push({ p, finalDate: nextReviewDE(bestDay), bestDay });
  });

  dbg(`smooth: ${updates.length} Updates geplant`, 'info');

  if(updates.length === 0){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--muted)">Bereits gut verteilt — nichts zu tun.</span>';
    return;
  }

  if(resultEl) resultEl.innerHTML = `<span style="color:var(--muted)">Speichere ${updates.length} Updates…</span>`;

  // 4. Batched updates via sbApi
  let done = 0, errors = 0, doneToday = 0;
  const BATCH = 20;
  for(let i = 0; i < updates.length; i += BATCH){
    const batch = updates.slice(i, i + BATCH);
    await Promise.all(batch.map(async ({p, finalDate, bestDay}) => {
      try{
        await sbApi('progress?id=eq.'+p.id, 'PATCH', { next_review: finalDate.toISOString() });
        p.next_review = finalDate; // Date-Objekt, konsistent mit dem Rest des Codes (kein String!)
        done++;
        if(bestDay === 0) doneToday++;
      }catch(e){ errors++; dbg('smooth error: '+e.message, 'err'); }
    }));
    if(resultEl) resultEl.innerHTML = `<span style="color:var(--muted)">${done}/${updates.length} gespeichert…</span>`;
  }

  if(resultEl){
    const todayNote = doneToday > 0 ? ` (${doneToday} davon heute fällig)` : '';
    resultEl.innerHTML = errors > 0
      ? `<span style="color:var(--gold)">✓ ${done} geglättet${todayNote}, ${errors} Fehler.</span>`
      : `<span style="color:var(--green)">✓ ${done} Fälligkeiten neu verteilt${todayNote}.</span>`;
  }
  showStats();
}

// Einmalig alle next_review neu berechnen: last_reviewed + SRS_DAYS[level]
// Nur wenn next_review bereits gesetzt ist (leere bleiben leer)
async function recalcAllNextReview(){
  const resultEl = document.getElementById('smooth-result');
  if(resultEl) resultEl.innerHTML = '<span style="color:var(--muted)">Berechne…</span>';

  const updates = [];
  ALL_VOCAB.forEach(v => {
    const p = srsProgress[v.id];
    if(!p || !p.next_review || !p.last_reviewed) return; // leer bleibt leer
    const lr = new Date(p.last_reviewed);
    const days = p.level === 0 ? 0 : SRS_DAYS[p.level];
    const base = new Date(lr.getTime() + days * 24 * 60 * 60 * 1000);
    const berlinDate = base.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
    const [y, m, d] = berlinDate.split('-').map(Number);
    let finalDate = null;
    for(const offsetH of [1, 2]){
      const candidate = new Date(Date.UTC(y, m - 1, d, 3 - offsetH, 0, 0));
      const check = candidate.toLocaleString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });
      if(check === '03:00' || check === '3:00'){ finalDate = candidate; break; }
    }
    if(!finalDate) finalDate = new Date(Date.UTC(y, m - 1, d, 2, 0, 0));
    updates.push({ p, finalDate });
  });

  if(updates.length === 0){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--muted)">Keine Einträge gefunden.</span>';
    return;
  }

  if(resultEl) resultEl.innerHTML = `<span style="color:var(--muted)">0/${updates.length} gespeichert…</span>`;

  let done = 0, errors = 0;
  const BATCH = 20;
  for(let i = 0; i < updates.length; i += BATCH){
    const batch = updates.slice(i, i + BATCH);
    await Promise.all(batch.map(async ({p, finalDate}) => {
      try{
        await sbApi('progress?id=eq.'+p.id, 'PATCH', { next_review: finalDate.toISOString() });
        p.next_review = finalDate; // Date-Objekt, konsistent mit dem Rest des Codes
        done++;
      }catch(e){ errors++; dbg('recalc error: '+e.message, 'err'); }
    }));
    if(resultEl) resultEl.innerHTML = `<span style="color:var(--muted)">${done}/${updates.length} gespeichert…</span>`;
  }

  if(resultEl){
    resultEl.innerHTML = errors > 0
      ? `<span style="color:var(--gold)">✓ ${done} neu gesetzt, ${errors} Fehler.</span>`
      : `<span style="color:var(--green)">✓ ${done} Fälligkeiten neu berechnet.</span>`;
  }
  showStats();
}
function toLocalInputDE(date){
  const d = date instanceof Date ? date : new Date(date);
  // Berliner Offset in Minuten ermitteln
  const berlinOffsetMin = getBerlinOffsetMin(d);
  // Lokale Berliner Zeit als neues Date-Objekt
  const berlin = new Date(d.getTime() + berlinOffsetMin * 60000);
  const Y = berlin.getUTCFullYear();
  const M = String(berlin.getUTCMonth()+1).padStart(2,'0');
  const D = String(berlin.getUTCDate()).padStart(2,'0');
  const H = String(berlin.getUTCHours()).padStart(2,'0');
  const Min = String(berlin.getUTCMinutes()).padStart(2,'0');
  return Y+'-'+M+'-'+D+'T'+H+':'+Min;
}

// "YYYY-MM-DDTHH:MM" (Berliner Zeit) → UTC Date
function fromLocalInputDE(localStr){
  const [datePart, timePart] = localStr.split('T');
  const [y, m, d] = datePart.split('-').map(Number);
  const [hh, mm] = (timePart||'00:00').split(':').map(Number);
  // Temporäres Date um Offset zu ermitteln (nehme erstmal UTC+1 als Schätzung)
  const approx = new Date(Date.UTC(y, m-1, d, hh-1, mm, 0));
  const offsetMin = getBerlinOffsetMin(approx);
  return new Date(Date.UTC(y, m-1, d, hh, mm, 0) - offsetMin * 60000);
}

// Berliner UTC-Offset in Minuten: +120 (CEST, Sommer) oder +60 (CET, Winter)
// Sommer = letzter Sonntag März 02:00 bis letzter Sonntag Oktober 03:00 (UTC-Zeiten)
function getBerlinOffsetMin(date){
  const d = date instanceof Date ? date : new Date(date);
  const year = d.getUTCFullYear();

  // Letzter Sonntag im März (Beginn CEST): 02:00 UTC
  const lastSunMarch = lastSundayUTC(year, 2); // Monat 2 = März (0-basiert)
  lastSunMarch.setUTCHours(1, 0, 0, 0); // 02:00 Berliner Winterzeit = 01:00 UTC

  // Letzter Sonntag im Oktober (Ende CEST): 03:00 CEST = 01:00 UTC
  const lastSunOct = lastSundayUTC(year, 9); // Monat 9 = Oktober
  lastSunOct.setUTCHours(1, 0, 0, 0); // 03:00 Berliner Sommerzeit = 01:00 UTC

  return (d >= lastSunMarch && d < lastSunOct) ? 120 : 60;
}

function lastSundayUTC(year, month0){
  // Letzter Tag des Monats
  const last = new Date(Date.UTC(year, month0+1, 0));
  // Zurück zum letzten Sonntag (0=Sonntag)
  last.setUTCDate(last.getUTCDate() - last.getUTCDay());
  return last;
}

async function srsAnswer(vocab, correct){
  dbg('srsAnswer START user='+(currentUser?'ok':'null')+' vocab='+vocab.tr, 'ok');
  if(!currentUser){ dbg('FEHLER: kein User', 'err'); return; }
  const vocabId = vocab.id;
  dbg('vocabId=' + vocabId + (correct?' ✓':' ✗'), vocabId ? (correct?'ok':'err') : 'err');
  if(!vocabId){
    dbg('FEHLER: keine id für "' + vocab.tr + '"', 'err');
    return;
  }

  const existing = srsProgress[vocabId];
  const levelBefore = existing ? (existing.level||0) : 0;
  let level = levelBefore;

  if(correct){
    // Level steigt nur wenn fällig (Pause eingehalten)
    const wasDue = !existing || !existing.next_review || new Date() >= new Date(existing.next_review);
    if(wasDue) level = Math.min(level + 1, 6);
  } else {
    // Falsch: direkt auf Level 0 zurücksetzen
    level = 0;
  }

  // next_review:
  //  - falsch                      → sofort fällig (jetzt)
  //  - richtig & fällig            → jetzt + SRS_DAYS[level] Tage → 03:00 Uhr (Europe/Berlin)
  //  - richtig & noch nicht fällig → bisheriges Datum beibehalten
  const wasDueForNext = !existing || !existing.next_review || new Date() >= new Date(existing.next_review);
  let nextReview = existing && existing.next_review ? new Date(existing.next_review) : new Date();
  if(!correct){
    nextReview = new Date(); // sofort fällig
  } else if(wasDueForNext){
    nextReview = nextReviewDE(SRS_DAYS[level], level >= 3 ? srsJitter(level) : 0);
  }

  if(IS_DEBUG){
    dbg(
      vocab.tr +
      ' → Level ' + level +
      ' → next_review ' + nextReview.toLocaleString(),
      correct ? 'ok' : 'err'
    );
  }

  // Session-Protokoll
  const ptsBefore = levelBefore * 1;
  const ptsAfter  = level * 1;
  _sessionLog.push({
    tr: vocab.tr,
    en: vocab.en,
    correct,
    levelBefore,
    levelAfter: level,
    ptsDelta: ptsAfter - ptsBefore,
    wasDue: !existing || !existing.next_review || new Date() >= new Date(existing.next_review)
  });
  if(_sessionLog.length % 10 === 0) _printSessionLog();
  // Zähler EINMAL berechnen, BEVOR der lokale State mutiert wird.
  // (existing === srsProgress[vocabId] — gleiche Referenz! Späteres Neuberechnen
  //  nach dem Optimistic Update führte zum Doppel-Inkrement in Supabase.)
  const newReviewCount = (existing ? (existing.review_count||0) : 0) + 1;
  const newWrongCount  = (existing ? (existing.wrong_count||0)  : 0) + (correct ? 0 : 1);

  const data = {
    user_id: currentUser.id,
    vocabulary_id: vocabId,
    correct_count: level,
    wrong_count: newWrongCount,
    review_count: newReviewCount,
    next_review: nextReview.toISOString(),
    last_reviewed: new Date().toISOString(),
    last_correct: correct ? new Date().toISOString() : null,
  };

  // Lokalen State sofort aktualisieren (optimistic update)
  if(existing && existing.id){
    srsProgress[vocabId].level = level;
    srsProgress[vocabId].review_count = newReviewCount;
    srsProgress[vocabId].wrong_count = newWrongCount;
    srsProgress[vocabId].next_review = nextReview;
    srsProgress[vocabId].last_reviewed = new Date();
    if(correct) srsProgress[vocabId].last_correct = new Date();
  } else {
    // Auch wenn existing ohne id vorliegt (POST hängt noch in Offline-Queue):
    // Zähler fortschreiben statt auf 1/0 zurückzusetzen
    srsProgress[vocabId] = {
      id: existing ? existing.id : null, // wird nach erfolgreichem POST gesetzt
      vocabulary_id: vocabId,
      level: level,
      review_count: newReviewCount,
      wrong_count: newWrongCount,
      next_review: nextReview,
      last_reviewed: new Date(),
      last_correct: correct ? new Date() : (existing ? existing.last_correct : null),
    };
  }

  try{
    if(existing && existing.id){
      dbg('PATCH progress id='+existing.id, 'ok');
      const patchPayload = {
        correct_count: data.correct_count,
        wrong_count: data.wrong_count,
        review_count: data.review_count,
        next_review: data.next_review,
        last_reviewed: data.last_reviewed,
        last_correct: correct ? data.last_correct : (existing.last_correct ? new Date(existing.last_correct).toISOString() : null),
      };
      await sbApi('progress?id=eq.'+existing.id, 'PATCH', patchPayload);
      dbg('✓ PATCH gespeichert level='+level, 'ok');
    } else {
      dbg('POST progress vocab='+vocabId, 'ok');
      const res = await sbApi('progress?on_conflict=user_id,vocabulary_id', 'POST', data, 'resolution=merge-duplicates,return=representation');
      let savedRow = res && res[0] ? res[0] : null;
      // Fallback: GET wenn Supabase keinen Body zurückgab
      if(!savedRow || !savedRow.id){
        const fetched = await sbApi('progress?user_id=eq.'+currentUser.id+'&vocabulary_id=eq.'+vocabId+'&select=id,vocabulary_id');
        if(fetched && fetched[0]) savedRow = fetched[0];
      }
      if(savedRow && savedRow.id){
        dbg('✓ POST gespeichert id='+savedRow.id+' level='+level, 'ok');
        srsProgress[vocabId].id = savedRow.id;
      }
    }
    syncUpdateIcon(); // icon auf ✅ wenn Queue leer
  } catch(e){
    dbg('FEHLER save → Offline-Queue: ' + e.message, 'err');
    // In Queue speichern für spätere Übertragung
    try{
      if(existing && existing.id){
        await oqPush({
          vocabId,
          existing_id: existing.id,
          is_patch: true,
          payload: {
            correct_count: data.correct_count,
            wrong_count: data.wrong_count,
            review_count: data.review_count,
            next_review: data.next_review,
            last_reviewed: data.last_reviewed,
            last_correct: correct ? data.last_correct : (existing.last_correct ? new Date(existing.last_correct).toISOString() : null),
          }
        });
      } else {
        await oqPush({
          vocabId,
          is_patch: false,
          payload: data
        });
      }
      dbg('In Queue gespeichert ('+vocabId+')', 'info');
      syncUpdateIcon();
    } catch(qe){
      dbg('Queue FEHLER: ' + qe.message, 'err');
    }
  }
}

function srsGetLevel(vocab){
  const p = srsProgress[vocab.id];
  return p ? p.level : 0;
}

// ── review_log: Tagesstatistik (Versuche/Vokabeln pro Tag) ──────────────────
async function logReview(vocabId, correct, mode){
  if(!currentUser || !vocabId) return null;
  // Zeitpunkt der TATSÄCHLICHEN Antwort, nicht des Sync — wichtig für Offline-Korrektheit
  const created_at = new Date().toISOString();
  const payload = { user_id: currentUser.id, vocabulary_id: vocabId, correct, mode, created_at };
  try{
    const res = await sbApi('review_log', 'POST', payload, 'return=representation');
    const id = res && res[0] ? res[0].id : null;
    syncUpdateIcon();
    return { id, qid: null };
  } catch(e){
    dbg('log offline → Queue: '+e.message, 'warn');
    try{
      const qid = await oqPush({ type:'log_insert', payload });

function srsIsDue(vocab){
  const p = srsProgress[vocab.id];
  // Kein Progress = noch nie gesehen → nicht fällig (muss erst freigeschaltet werden)
  if(!p) return false;
  if(!p.next_review) return false;
  return new Date() >= new Date(p.next_review);
}

function srsDaysUntil(vocab){
  const p = srsProgress[vocab.id];
  if(!p) return 0;
  const diff = new Date(p.next_review) - new Date();
  return Math.max(0, Math.ceil(diff / (1000*60*60*24)));
}

function buildSrsQueue(vocab){

  const now = new Date();

  // Vokabeln in MEINER Partner-Queue (📬) ausblenden, solange sie dort offen sind.
  // Das ist NICHT die Queue meines Partners (pending/skipped) — die bleibt unberührt.
  vocab = vocab.filter(v => !(v.ps === 'rejected' || v.ps === 'suggested' || v.ps === 'unknown' || v.pc));

  // =========================
  // 1. Fällige Karten
  // =========================
  const due = vocab.filter(v => {

    const p = srsProgress[v.id];

    if(!p) return false;
    if(!p.next_review) return false;

    return new Date(p.next_review) <= now;
  });

  due.sort((a,b)=>{

    const pa = srsProgress[a.id];
    const pb = srsProgress[b.id];

    return (
      new Date(pa.next_review) -
      new Date(pb.next_review)
    );
  });

  if(due.length > 0){

    dbg(
      'Due Karten: ' + due.length,
      'ok'
    );

    return due;
  }

  const fresh = vocab.filter(v => {

    return !srsProgress[v.id];
  });

  dbg(
    'Neue Wörter: ' + fresh.length,
    'info'
  );

  return sh(fresh);
}

function countDueToday(lessonVocab){
  return lessonVocab.filter(v => srsIsDue(v)).length;
}

async function sbApi(path,method='GET',body=null,prefer=null){
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 20000); // 20s Timeout — hängende Requests sauber abbrechen
  try{

      method,

        'Authorization':'Bearer '+SB_KEY,
        'Prefer':prefer||(method==='POST'?'return=representation':'')
      },
      body:body?JSON.stringify(body):null,
      signal: ctrl.signal
    });
    const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;
  }catch(e){
    if(e.name==='AbortError') throw new Error('Zeitüberschreitung (20s) — Netzwerk prüfen');
    throw e;
  }finally{
    clearTimeout(to);
  }
}
// Erste Seite mit Prefer: count=exact abfragen → Gesamtzahl steckt im Content-Range-Header
async function sbApiRangeFirst(basePath, batchSize){
  const sep = basePath.includes('?') ? '&' : '?';
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 20000);
  try{
    const r = await fetch(SB_URL+'/rest/v1/'+basePath+sep+'limit='+batchSize+'&offset=0',{
      method:'GET',
      headers:{
        'Content-Type':'application/json',
        'apikey':SB_KEY,
        'Authorization':'Bearer '+SB_KEY,
        'Prefer':'count=exact'
      },
      signal: ctrl.signal
    });
    const t = await r.text();
    if(!r.ok) throw new Error(t);
    const data = t ? JSON.parse(t) : [];
    let total = null;
    const cr = r.headers.get('content-range'); // Format: "0-999/3421"
    if(cr){ const m = cr.match(/\/(\d+)$/); if(m) total = parseInt(m[1],10); }
    return { data, total };
  }catch(e){
    if(e.name==='AbortError') throw new Error('Zeitüberschreitung (20s) — Netzwerk prüfen');
    throw e;
  }finally{
    clearTimeout(to);
  }
}
// Ermittelt nur die Gesamtzahl (Content-Range-Header), ohne alle Zeilen zu laden.
async function sbApiCount(basePath){
  const { total, data } = await sbApiRangeFirst(basePath, 1);
  return total != null ? total : data.length;
}
// Lädt eine komplette Tabelle seitenweise. Erste Seite liefert die Gesamtzahl mit,
// alle restlichen Seiten werden dann PARALLEL (Promise.all) statt nacheinander geladen.
async function sbApiPaged(basePath, batchSize, onProgress){
  const sep = basePath.includes('?') ? '&' : '?';
  const { data: firstPage, total } = await sbApiRangeFirst(basePath, batchSize);
  let all = firstPage.slice();
  if(onProgress) onProgress(all.length, total);

  if(total != null){
    const offsets = [];
    for(let off = batchSize; off < total; off += batchSize) offsets.push(off);
    if(offsets.length){
      const pages = await Promise.all(offsets.map(off =>
        sbApi(basePath+sep+'limit='+batchSize+'&offset='+off)
      ));
      pages.forEach(p => { all = all.concat(p||[]); });
      if(onProgress) onProgress(all.length, total);
    }
  } else if(firstPage.length === batchSize){
    // Fallback ohne count-Header (z.B. wenn Prefer ignoriert wird) → wie bisher sequenziell
    let offset = batchSize;
    while(true){
      const batch = await sbApi(basePath+sep+'limit='+batchSize+'&offset='+offset);
      if(!batch || batch.length === 0) break;
      all = all.concat(batch);
      if(onProgress) onProgress(all.length, null);
      if(batch.length < batchSize) break;
      offset += batchSize;
    }
  }
  return all;
}
// ══ OFFLINE QUEUE (IndexedDB) ════════════════════════════════════════════════
// Speichert fehlgeschlagene progress-Saves lokal und sendet sie sobald Netz da

const OQ_DB_NAME = 'tounsi_offline';
const OQ_STORE   = 'queue';
let _oqDb = null;

function oqOpen(){
  return new Promise((res, rej) => {
    if(_oqDb){ res(_oqDb); return; }
    const req = indexedDB.open(OQ_DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(OQ_STORE)){
        const s = db.createObjectStore(OQ_STORE, {keyPath:'qid', autoIncrement:true});
        s.createIndex('ts','ts');
      }
    };
    req.onsuccess = e => { _oqDb = e.target.result; res(_oqDb); };
    req.onerror   = e => rej(e.target.error);
  });
}

async function oqPush(entry){
  // entry: {vocabId, existing_id, payload_patch, payload_post, is_patch}
  const db = await oqOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(OQ_STORE,'readwrite');
    const req = tx.objectStore(OQ_STORE).add({...entry, ts: Date.now()});
    let qid;
    req.onsuccess = () => { qid = req.result; };
    tx.oncomplete = () => res(qid);
    tx.onerror    = e => rej(e.target.error);
  });
}
async function oqUpdatePayload(qid, changes){
  // Mutiert einen noch nicht gesyncten Queue-Eintrag in place (z.B. Log-Korrektur bevor der Sync lief)
  const db = await oqOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(OQ_STORE,'readwrite');
    const store = tx.objectStore(OQ_STORE);
    const getReq = store.get(qid);
    getReq.onsuccess = () => {
      const rec = getReq.result;
      if(!rec){ res(false); return; }
      rec.payload = { ...rec.payload, ...changes };
      store.put(rec);
    };
    tx.oncomplete = () => res(true);
    tx.onerror    = e => rej(e.target.error);
  });
}

async function oqGetAll(){
  const db = await oqOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(OQ_STORE,'readonly');
    const req = tx.objectStore(OQ_STORE).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

async function oqDelete(qid){
  const db = await oqOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(OQ_STORE,'readwrite');
    tx.objectStore(OQ_STORE).delete(qid);
    tx.oncomplete = () => res();
    tx.onerror    = e => rej(e.target.error);
  });
}

async function oqCount(){
  const db = await oqOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(OQ_STORE,'readonly');
    const req = tx.objectStore(OQ_STORE).count();
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

let _syncRunning = false;
async function syncFlush(manual=false){
  if(_syncRunning) return;
  _syncRunning = true;
  try{
    const items = await oqGetAll();
    if(items.length === 0){ _syncRunning=false; syncUpdateIcon(); return; }
    dbg('Sync: '+items.length+' ausstehend', 'info');
    let sent = 0;
    for(const item of items){
      try{
        if(item.type === 'log_insert'){
          await sbApi('review_log', 'POST', item.payload);
        } else if(item.type === 'log_update'){
          await sbApi('review_log?id=eq.'+item.existing_id, 'PATCH', item.payload);
        } else if(item.is_patch){
          await sbApi('progress?id=eq.'+item.existing_id, 'PATCH', item.payload);
        } else {
          await sbApi('progress?on_conflict=user_id,vocabulary_id', 'POST', item.payload, 'resolution=merge-duplicates,return=representation');
          // Gespeicherte ID in srsProgress nachziehen
          const fetched = await sbApi('progress?user_id=eq.'+item.payload.user_id+'&vocabulary_id=eq.'+item.vocabId+'&select=id,vocabulary_id');
          if(fetched && fetched[0] && srsProgress[item.vocabId]){
            srsProgress[item.vocabId].id = fetched[0].id;
          }
        }
        await oqDelete(item.qid);
        sent++;
        dbg('Sync OK: qid='+item.qid, 'ok');
      } catch(e){
        dbg('Sync FEHLER qid='+item.qid+': '+e.message, 'err');
        // Netz noch weg — abbrechen, beim nächsten Loop weitermachen
        break;
      }
    }
    if(manual && sent > 0) dbg('Sync: '+sent+' gespeichert', 'ok');
  } catch(e){
    dbg('Sync Fehler: '+e.message, 'err');
  }
  _syncRunning = false;
  syncUpdateIcon();
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function partnerInit(containerId){
  _pContainerId = containerId || 'partner-main';
  const main=_pMain();
  main.innerHTML=partnerTabBar('review')+'<div style="text-align:center;padding:2rem;color:var(--muted)">Lade…</div>';
  try{
  // 1. pending + skipped mit Fälligkeit (next_review <= now), nach next_review
  // 2. pending + skipped ohne Fälligkeit, zufällig
  // 3. Fallback: null-Status, zufällig
  const now = new Date().toISOString();
  let batch = [];

  // Lade alle pending+skipped
  const pendingSkipped = await sbApi(
    'vocabulary?partner_status=in.(pending,skipped)&select=id,darija,german,partner_status,ninja_audio_url&limit=200'
  );
  // Lade progress für diese IDs um next_review zu kennen
  const ids = pendingSkipped.map(v=>v.id);
  let progressMap = {};
  if(ids.length > 0){
    const prog = await sbApi('progress?vocabulary_id=in.('+ids.join(',')+')&select=vocabulary_id,next_review');
    prog.forEach(p=>{ progressMap[p.vocabulary_id]=p.next_review; });
  }
  // Annotate mit next_review
  pendingSkipped.forEach(v=>{ v._nextReview = progressMap[v.id] || null; });

  // Sortierung: Status hat absolute Priorität, Fälligkeit nur innerhalb desselben Status
  // Gruppe 0: pending mit Fälligkeit (nach next_review)
  // Gruppe 1: pending ohne Fälligkeit (zufällig)
  // Gruppe 2: skipped mit Fälligkeit (nach next_review)
  // Gruppe 3: skipped ohne Fälligkeit (zufällig)
  const now2 = new Date();
  const grp = v => {
    const fällig = v._nextReview && new Date(v._nextReview) <= now2;
    if(v.partner_status==='pending' && fällig) return 0;
    if(v.partner_status==='pending') return 1;
    if(v.partner_status==='skipped' && fällig) return 2;
    return 3;
  };
  pendingSkipped.sort((a,b)=>{
    const ga=grp(a), gb=grp(b);
    if(ga!==gb) return ga-gb;
    // Innerhalb fälliger Gruppen: nach next_review aufsteigend
    if(ga===0||ga===2) return new Date(a._nextReview)-new Date(b._nextReview);
    return Math.random()-.5;
  });
  batch = pendingSkipped.slice(0,10);

  // Fallback: wenn weniger als 10, mit null-Status auffüllen
  if(batch.length < 10){
    const need = 10 - batch.length;
    const existingIds = batch.map(v=>v.id);
    const fallback = await sbApi(
      'vocabulary?partner_status=is.null&select=id,darija,german,partner_status,ninja_audio_url&limit=200'
    );
    // Annotate fallback mit next_review
    const fbIds = fallback.map(v=>v.id);
    let fbProgressMap = {};
    if(fbIds.length > 0){
      const fbProg = await sbApi('progress?vocabulary_id=in.('+fbIds.slice(0,200).join(',')+')'+'&select=vocabulary_id,next_review');
      fbProg.forEach(p=>{ fbProgressMap[p.vocabulary_id]=p.next_review; });
    }
    fallback.forEach(v=>{ v._nextReview = fbProgressMap[v.id]||null; });
    // Sortierung: fällige zuerst (nach next_review), dann zufällig
    const fbNow = new Date();
    fallback.sort((a,b)=>{
      const aFäl = a._nextReview && new Date(a._nextReview) <= fbNow;
      const bFäl = b._nextReview && new Date(b._nextReview) <= fbNow;
      if(aFäl && !bFäl) return -1;
      if(!aFäl && bFäl) return 1;
      if(aFäl && bFäl) return new Date(a._nextReview)-new Date(b._nextReview);
      return Math.random()-.5;
    });
    batch = batch.concat(fallback.filter(v=>!existingIds.includes(v.id)).slice(0,need));
  }

  _pBatch = batch;
  _pIdx = 0;
  _pResults = [];
  _pEditIdx = null;
  partnerShowCard();
  }catch(err){
    main.innerHTML=partnerTabBar('review')+'<div style="padding:1.5rem;background:rgba(201,76,76,.1);border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:.85rem;word-break:break-all"><strong>Fehler:</strong><br>'+err.message+'<br><br><span style="color:var(--muted)">'+JSON.stringify(err)+'</span></div>';
  }
}

function interleaveSrs(vocab){
  // Baut Queue mit SRS-Wiederholungslogik
  // Karten die falsch beantwortet wurden kommen nach SRS_INTERVALS[level] Karten wieder
  const initial=buildSrsQueue(vocab);
  const result=[];
  const pending=[]; // {vocab, insertAt}
  let pos=0;
  for(const v of initial){
    // Füge fällige pending-Karten ein
    while(pending.length&&pending[0].insertAt<=pos){
      result.push({type:'mc',v:pending.shift().vocab,srs:true});
      pos++;
    }
    result.push({type:'mc',v,srs:true});
    pos++;
  }
  // Reste aus pending anhängen
  for(const p of pending) result.push({type:'mc',v:p.vocab,srs:true});
  return result;
}

function timeAgo(date){
  if(!date) return '—';
  const d = date instanceof Date ? date : new Date(date);
  if(isNaN(d.getTime())) return '—';
  const diff = Math.floor((Date.now()-d.getTime())/86400000);
  if(diff===0) return 'heute';
  if(diff===1) return 'gestern';
  return diff+'T';
}
function fmtDue(date){
  if(!date) return '—';
  const d = date instanceof Date ? date : new Date(date);
  const now = new Date();
  if(d <= now) return '<span style="color:var(--red);font-weight:700">fällig</span>';
  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dDay  = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff  = Math.round((dDay-today)/86400000);
  if(diff===0) return '<span style="color:var(--gold);font-weight:700">heute</span>';
  if(diff===1) return 'morgen';
  return 'in '+diff+'T';
}
function srsInfoBadge(vocab){
  if(!vocab || !vocab.id) return '';
  const p = srsProgress[vocab.id] || null;
  const level = p ? (p.level||0) : 0;
  const filled = '⭐'.repeat(level);
  const empty = '<span style="opacity:.3;font-size:.8em">☆</span>'.repeat(6-level);
  const reviewed = (p && p.last_reviewed) ? timeAgo(p.last_reviewed) : '—';
  const correct = (p && p.last_correct) ? timeAgo(p.last_correct) : '—';
  const rc = (p && p.review_count) ? p.review_count : 0;
  return `<div class="srs-info-badge">${filled}${empty}${rc ? ' &nbsp;·&nbsp; 🔁 '+rc : ''}</div>`;
}

function makeMCItem(v){
  const dir=Math.random()>.5?'ar2en':'en2ar';
  const pool=ALL_VOCAB.filter(x=>x.ar!==v.ar);
  if(dir==='ar2en'){const distr=sh(pool).filter(x=>x.en&&x.en!==v.en).slice(0,3).map(x=>x.en);const opts=sh([v.en,...distr]);return{type:'mc',v,opts,ca:v.en,dir};}
  else{const c=v.ar+' ('+v.tr+')';const distr=sh(pool).filter(x=>x.ar&&x.ar!==v.ar).slice(0,3).map(x=>x.ar+' ('+x.tr+')');const opts=sh([c,...distr]);return{type:'mc',v,opts,ca:c,dir};}
}
function bMC(vocab){
  const due = _dueQueue.length ? _dueQueue : buildSrsQueue(vocab);

function bSentences(){

// Gemeinsame Korrektur-Logik (DB-Patch + lokaler State) für richtig<->falsch.
// Wird sowohl von der Action-Bar direkt nach dem Antworten ("War doch
// richtig/falsch") als auch vom persistenten Korrektur-Chip auf Folgekarten
// ("↩ korrigieren") verwendet — dort greift IMMER nur die zuletzt beantwortete
// Vokabel (window._lastFlashVocab wird bei jedem chkFlash() überschrieben).
async function _applyFlashCorrection(vid, toOk, orig){
  const p = srsProgress[vid];
  if(!p){ updateLessonChips(); await correctLastFlashLog(toOk); return; }
  if(toOk){
    // War fälschlich falsch → jetzt richtig: Level = orig.level+1
    // (war fällig, sonst wäre die Vokabel nicht in der Session gewesen),
    // next_review neu berechnen, wrong_count zurück auf Vor-Antwort-Stand.
    const origLevel = orig ? (orig.level||0) : 0;
    const newLevel = Math.min(origLevel + 1, 6);
    const nextReview = nextReviewDE(SRS_DAYS[newLevel], newLevel >= 3 ? srsJitter(newLevel) : 0);
    const origWrongCount = orig ? (orig.wrong_count||0) : Math.max(0,(p.wrong_count||1)-1);
    const patchPayload = {
      correct_count: newLevel,
      wrong_count: origWrongCount,
      next_review: nextReview.toISOString(),
      last_correct: new Date().toISOString(),
    };
    p.level = newLevel; p.correct_count = newLevel; p.wrong_count = origWrongCount;
    p.next_review = nextReview; p.last_correct = new Date();
    updateLessonChips();
    if(!p.id){
      dbg('_applyFlashCorrection(true): keine id (offline) → Korrektur-Upsert in Queue','info');
      try{
        await oqPush({ vocabId: vid, is_patch: false, payload: {
          user_id: currentUser.id, vocabulary_id: vid,
          correct_count: newLevel, wrong_count: origWrongCount,
          review_count: p.review_count || 1, next_review: nextReview.toISOString(),
          last_reviewed: new Date().toISOString(), last_correct: new Date().toISOString(),
        }});
        syncUpdateIcon();
      }catch(qe){ dbg('Queue FEHLER: '+qe.message,'err'); }
      await correctLastFlashLog(true);
      return;
    }
    try{
      await sbApi('progress?id=eq.'+p.id, 'PATCH', patchPayload);
      dbg('_applyFlashCorrection(true) ✓ level='+newLevel, 'ok');
      syncUpdateIcon();
    }catch(e){
      dbg('_applyFlashCorrection(true) offline → Queue: '+e.message,'err');
      try{ await oqPush({ vocabId: vid, existing_id: p.id, is_patch: true, payload: patchPayload }); syncUpdateIcon(); }
      catch(qe){ dbg('Queue FEHLER: '+qe.message,'err'); }
    }
    await correctLastFlashLog(true);
  } else {
    // War fälschlich richtig → jetzt falsch: Level zurück auf 0, sofort fällig,
    // wrong_count auf Vor-Antwort-Stand +1.
    const origWrongCount = orig ? (orig.wrong_count||0) : (p.wrong_count||0);
    const newWrongCount = origWrongCount + 1;
    const nextReview = new Date();
    const origLastCorrectISO = orig && orig.last_correct ? new Date(orig.last_correct).toISOString() : null;
    const patchPayload = {
      correct_count: 0,
      wrong_count: newWrongCount,
      next_review: nextReview.toISOString(),
      last_correct: origLastCorrectISO,
    };
    p.level = 0; p.correct_count = 0; p.wrong_count = newWrongCount;
    p.next_review = nextReview; p.last_correct = orig ? orig.last_correct : null;
    updateLessonChips();
    if(!p.id){
      dbg('_applyFlashCorrection(false): keine id (offline) → Korrektur-Upsert in Queue','info');
      try{
        await oqPush({ vocabId: vid, is_patch: false, payload: {
          user_id: currentUser.id, vocabulary_id: vid,
          correct_count: 0, wrong_count: newWrongCount,
          review_count: p.review_count || 1, next_review: nextReview.toISOString(),
          last_reviewed: new Date().toISOString(), last_correct: origLastCorrectISO,
        }});
        syncUpdateIcon();
      }catch(qe){ dbg('Queue FEHLER: '+qe.message,'err'); }
      await correctLastFlashLog(false);
      return;
    }
    try{
      await sbApi('progress?id=eq.'+p.id, 'PATCH', patchPayload);
      dbg('_applyFlashCorrection(false) ✓', 'ok');
      syncUpdateIcon();
    }catch(e){
      dbg('_applyFlashCorrection(false) offline → Queue: '+e.message,'err');
      try{ await oqPush({ vocabId: vid, existing_id: p.id, is_patch: true, payload: patchPayload }); syncUpdateIcon(); }
      catch(qe){ dbg('Queue FEHLER: '+qe.message,'err'); }
    }
    await correctLastFlashLog(false);
  }
}

function markFlashCorrect(){
  if(cMode !== 'flash') return;
  const last = window._lastFlashVocab;
  if(!last || last.ok) return;
  last.ok = true;
  score.c++; score.w = Math.max(0, score.w - 1); score.st++;
  updScore();
  const vid = last.v.id;
  const orig = window._lastFlashOrigProgress;
  (async ()=>{
    // WICHTIG: Erst warten bis der vorherige srsAnswer(false)-Write vollständig
    // abgeschlossen ist (PATCH/POST fertig oder in Queue). Sonst Race Condition:
    // der Falsch-Write könnte die Korrektur wieder überschreiben.
    if(window._lastFlashSrsPromise){
      try{ await window._lastFlashSrsPromise; }catch(e){}
    }
    await _applyFlashCorrection(vid, true, orig);
  })();
  const fb = document.getElementById('feedback');
  if(fb){ fb.className='feedback show correct'; fb.innerHTML='✓ Als richtig gewertet.'; }
  hideFlashActionBar();
  showFlashNextBar(last.v, true);
}

function markFlashWrong(){
  if(cMode !== 'flash') return;
  const last = window._lastFlashVocab;
  if(!last || !last.ok) return;
  last.ok = false;
  score.c = Math.max(0, score.c - 1); score.w++; score.st = 0;
  updScore();
  const vid = last.v.id;
  const orig = window._lastFlashOrigProgress; // Zustand VOR der ursprünglichen (fälschlich "richtig" gewerteten) Antwort
  (async ()=>{
    if(window._lastFlashSrsPromise){
      try{ await window._lastFlashSrsPromise; }catch(e){}
    }
    await _applyFlashCorrection(vid, false, orig);
  })();
  const fb = document.getElementById('feedback');
  if(fb){ fb.className='feedback show wrong'; fb.innerHTML='✗ Als falsch gewertet.'; }
  hideFlashActionBar();
  showFlashNextBar(last.v, false);
}

// Button-HTML für ⏮ — Rahmen/Icon-Farbe zeigt den Status der zuletzt
// beantworteten Vokabel: grün = war richtig, rot = war falsch, grau = noch
// keine Antwort in dieser Session.
function flashPrevBtnHtml(){
  const last = window._lastFlashVocab;
  const known = !!last;
  const ok = known ? last.ok : null;
  const color = !known ? 'var(--muted)' : (ok ? 'var(--green)' : 'var(--red)');
  const title = !known ? 'Keine vorherige Antwort' : ('Letzte Antwort ('+last.v.tr+') war '+(ok?'richtig':'falsch')+' — antippen zum Korrigieren');
  return '<button class="sticky-check-ghost" id="flash-prev-btn" onclick="correctPreviousFlashCard()" title="'+title+'" style="border-color:'+color+';color:'+color+'">⏮</button>';
}
// Aktualisiert nur den ⏮-Button in-place (ohne die ganze Leiste neu zu bauen)
function refreshFlashPrevBtn(){
  const btn = document.getElementById('flash-prev-btn');
  if(!btn) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = flashPrevBtnHtml();
  const newBtn = tmp.firstElementChild;
  btn.replaceWith(newBtn);
}

// ── Korrektur der zuletzt beantworteten Karte, auch nachdem schon zur
//    nächsten Karte weitergeblättert wurde (⏮-Button in der Prüfen-Leiste).
//    Bezieht sich IMMER nur auf window._lastFlashVocab (die zuletzt per
//    chkFlash() beantwortete Vokabel) — sobald die nächste Karte beantwortet
//    wird, zeigt der Button auf die neue "letzte" Vokabel; die alte ist
//    nicht mehr erreichbar (bewusst: nur die letzte Antwort ist korrigierbar).
function correctPreviousFlashCard(){
  const last = window._lastFlashVocab;
  if(!last){ showToast('Keine vorherige Antwort zum Korrigieren','warn'); return; }
  const newOk = !last.ok;
  last.ok = newOk;
  if(newOk){ score.c++; score.w = Math.max(0, score.w - 1); }
  else { score.c = Math.max(0, score.c - 1); score.w++; }
  updScore();
  const vid = last.v.id;
  const orig = window._lastFlashOrigProgress;
  refreshFlashPrevBtn(); // Button-Farbe sofort umschalten
  (async ()=>{
    if(window._lastFlashSrsPromise){
      try{ await window._lastFlashSrsPromise; }catch(e){}
    }
    await _applyFlashCorrection(vid, newOk, orig);
    showToast((newOk?'✓ Korrigiert: ':'✗ Korrigiert: ')+last.v.tr+' jetzt als '+(newOk?'richtig':'falsch')+' gewertet', newOk?'ok':'warn');
  })();
}

function skipFlash(){
  if(answered) return;
  unlockBody();
  exList.splice(cIdx, 1);
  if(cIdx >= exList.length){ showRes(); }
  else { render(); }
}

let forecastWindow = 7; // Anzahl Tage im Fälligkeits-Forecast
let activityWindow = 7; // Anzahl Tage in der Lernaktivität-Statistik
function showStats(){
  document.getElementById('act-screen').style.display='none';document.getElementById('act-screen').style.pointerEvents='none';var _ab=document.getElementById('act-batch-bar');if(_ab)_ab.style.display='none';
  const _area = document.getElementById('exercise-screen');
  if(_area) _area.style.display = 'block';
  // Gefilterte Vokabeln basierend auf gewählter Lektion
  const vocabBase = cLesson === 'all' ? ALL_VOCAB : gv();

  // Zähle Vokabeln pro Level (nur aktive SRS = progress + next_review gesetzt)
  // levelCount[0] = nicht gestartet (kein progress ODER progress ohne next_review)
  // levelCount[1..5] = SRS Level 1..5
  const levelCount = [0,0,0,0,0,0,0,0]; // [0]=nie gestartet, [1]=L0 aktiv, [2-7]=L1..6
  const lessonLevelCount = {}; // {ls: [0,0,0,0,0,0,0]}
  const lessonStats = {};
  // Fälligkeiten nächste N Tage
  const today = new Date(); today.setHours(0,0,0,0);
  const dueDays = Array.from({length:forecastWindow}, () => [0,0,0,0,0,0,0,0]); // [day][bucket]
  let dueBlockedTotal = 0; // fällig, aber in MEINER Partner-Review-Queue blockiert (nicht in buildSrsQueue)
  let dueNowTotal = 0; // aktuell fällig, gesamt (blockiert + abfragbar)
  let forecastBlockedCount = 0; // gesperrte Vokabeln innerhalb des Forecast-Zeitraums (abhängig von forecastWindow)
  const isMyQueue = v => v.ps === 'rejected' || v.ps === 'suggested' || v.ps === 'unknown' || v.pc;

  vocabBase.forEach(v => {
    const p = srsProgress[v.id] || null;

    // "Nicht gestartet" = kein progress-Eintrag ODER progress ohne next_review
    const isStarted = p && p.next_review;
    const bucketIdx = !isStarted ? 0 : p.level === 0 ? 1 : Math.min(p.level + 1, 7);
    levelCount[bucketIdx]++;

    if(!lessonLevelCount[v.ls]) lessonLevelCount[v.ls] = [0,0,0,0,0,0,0,0];
    lessonLevelCount[v.ls][bucketIdx]++;

    if(!lessonStats[v.ls]) lessonStats[v.ls] = {total:0, learned:0, due:0, dueBlocked:0};
    lessonStats[v.ls].total++;
    if(isStarted && p.level >= 3) lessonStats[v.ls].learned++; // L3=bucket4, L4=bucket5, L5=bucket6
    if(srsIsDue(v)){
      lessonStats[v.ls].due++;
      dueNowTotal++;
      if(isMyQueue(v)){
        lessonStats[v.ls].dueBlocked++;
        dueBlockedTotal++;
      }
    }

    // Fälligkeits-Forecast: nur Vokabeln mit gesetztem next_review
    if(p && p.next_review){
      const nr = new Date(p.next_review); nr.setHours(0,0,0,0);
      const diff = Math.round((nr - today) / 86400000);
      const dayIdx = diff < 0 ? 0 : diff < forecastWindow ? diff : -1;
      if(dayIdx >= 0){
        if(isMyQueue(v)) forecastBlockedCount++;
        else dueDays[dayIdx][bucketIdx]++;
      }
    }
  });

  const totalVocab = vocabBase.length;
  const notStarted = levelCount[0];
  const activeSRS = totalVocab - notStarted;
  // Lernphasen (bucket idx → level: idx1=L0, idx2=L1, ... idx7=L6)
  const phaseAnfaenger = levelCount[1] + levelCount[2] + levelCount[3]; // L0-L2, echte Anzahl (Kachel + Meldungstext)
  // Gewichteter Puffer nur für den Warn-Trigger: verbleibende Schritte bis zum Verlassen der Anfänger-Phase (L3).
  // L0=3 Schritte, L1=2, L2=1 übrig — je näher am Verlassen, desto weniger "Puffer" bleibt übrig.
  const phaseAnfaengerWeighted = (levelCount[1]*3 + levelCount[2]*2 + levelCount[3]*1) / 3;
  const phaseEditable  = levelCount[4] + levelCount[5];                  // L3-L4
  const phaseMeistert  = levelCount[6] + levelCount[7];                  // L5-L6
  // Punkte: idx1(L0)=0, idx2(L1)=1, ..., idx7(L6)=6
  const totalPoints = levelCount[1]*0 + levelCount[2]*1 + levelCount[3]*2 + levelCount[4]*3 + levelCount[5]*4 + levelCount[6]*5 + levelCount[7]*6;
  const maxPointsAll    = totalVocab * 6;
  const maxPointsActive = activeSRS * 6;
  const pct       = maxPointsAll    ? Math.round(totalPoints / maxPointsAll    * 100) : 0;
  const pctActive = maxPointsActive ? Math.round(totalPoints / maxPointsActive * 100) : 0;
  const lessonLabel = cLesson === 'all' ? 'Alle Lektionen' : cLesson;

  const c = document.getElementById('exercise-content');
  const levelColors = ['#555555','#9b6fd4','#e05555','#e07832','#c9a84c','#2a9d8f','#4cac6e','#1a7a3a'];
  const dayTotals = dueDays.map(levels => levels.reduce((s,x) => s+x, 0));
  const maxDay = Math.max(...dayTotals, 1);
  const forecastBars = dueDays.map((levels, i) => {
    const d = new Date(today); d.setDate(d.getDate() + i);
    const name = i === 0 ? 'Heute' : i === 1 ? 'Morgen' : d.toLocaleDateString('de-DE',{weekday:'short'});
    const total = dayTotals[i];
    const h = Math.round(total / maxDay * 100);
    const labelColor = i === 0 ? 'var(--red)' : i <= 2 ? 'var(--gold)' : 'var(--muted)';
    // stacked segments: level 1–5 (skip 0 = nicht gestartet, kann nicht fällig sein)
    const segments = levels.map((cnt, li) => {
      if(li === 0 || cnt === 0) return '';
      const sh = Math.round(cnt / maxDay * 100);
      return `<div style="width:100%;height:${sh}%;min-height:3px;background:${levelColors[li]};"></div>`;
    }).reverse().join('');
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:.25rem">
      <span style="font-size:.75rem;font-weight:700;color:${labelColor}">${total||''}</span>
      <div style="width:100%;background:var(--border);border-radius:3px;height:60px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
        ${total ? segments : ''}
      </div>
      <span style="font-size:.6rem;color:var(--muted);text-align:center">${name}</span>
    </div>`;
  }).join('');

  // Level-Verteilung: Zeile für "Nicht gestartet" + Level 1–5
  const levelRows = (() => {
    const buckets = [
      { label: 'Neu', color: '#555555', idx: 0, hint: 'Ohne Fälligkeit' },
      { label: 'Level 0', color: '#9b6fd4', idx: 1, hint: 'fällig' },
      { label: 'Level 1', color: '#e05555', idx: 2, hint: 'Wdh. in 1d' },
      { label: 'Level 2', color: '#e07832', idx: 3, hint: 'Wdh. in 3d' },
      { label: 'Level 3', color: '#c9a84c', idx: 4, hint: 'Wdh. in 7d' },
      { label: 'Level 4', color: '#2a9d8f', idx: 5, hint: 'Wdh. in 14d' },
      { label: 'Level 5', color: '#4cac6e', idx: 6, hint: 'Wdh. in 30d' },
      { label: 'Level 6 ⭐', color: '#1a7a3a', idx: 7, hint: 'Wdh. in 90d' },
    ];
    const maxLevelCount = Math.max(...buckets.map(b => levelCount[b.idx]), 1);
    return buckets.map(b => {
      const cnt = levelCount[b.idx];
      const pctL = Math.round(cnt / maxLevelCount * 100);
      return `<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.72rem;">
        <span style="min-width:90px;color:${b.color}">${b.label}</span>
        <div style="flex:1;height:8px;background:var(--border);border-radius:4px;">
          <div style="height:100%;width:${pctL}%;background:${b.color};border-radius:4px;"></div>
        </div>
        <span style="min-width:28px;text-align:right;color:var(--muted)">${cnt}</span>
        <span style="min-width:90px;color:var(--muted);font-size:.62rem">${b.hint}</span>
      </div>`;
    }).join('');
  })();

  // Level-Verteilung pro Lektion: gestapelter Balken
  const lessonLevelRows = Object.entries(lessonLevelCount)
    .sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}))
    .map(([ls, counts]) => {
      const tot = counts.reduce((s,x) => s+x, 0);
      if(!tot) return '';
      const colors = ['#555555','#9b6fd4','#e05555','#e07832','#c9a84c','#2a9d8f','#4cac6e','#1a7a3a'];
      const segments = counts.map((cnt, i) => {
        const w = Math.round(cnt / tot * 100);
        return w > 0 ? `<div style="height:100%;width:${w}%;background:${colors[i]};"></div>` : '';
      }).join('');
      const started = tot - counts[0];
      const due = lessonStats[ls] ? lessonStats[ls].due : 0;
      const dueBlocked = lessonStats[ls] ? (lessonStats[ls].dueBlocked||0) : 0;
      return `<div style="margin-bottom:.6rem;">
        <div style="display:flex;justify-content:space-between;font-size:.68rem;margin-bottom:.25rem;">
          <span style="color:var(--gold)">${ls}${LESSON_TITLES[ls] ? '<span style="color:var(--muted);font-weight:400"> · '+LESSON_TITLES[ls]+'</span>' : ''}</span>
          <span style="color:var(--muted)">${started}/${tot} aktiv${due > 0 ? ` · <span style="color:var(--red)">${due} fällig</span>` : ''}${dueBlocked > 0 ? ` <span style="color:var(--muted)" title="In deiner Partner-Review-Queue — aktuell nicht in der Karten-Abfrage">📬${dueBlocked}</span>` : ''}</span>
        </div>
        <div style="height:10px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;">${segments}</div>
      </div>`;
    }).join('');

  c.innerHTML = `
    ${cLesson === 'all' ? `<div id="partner-stats-block" style="margin-bottom:.6rem;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem;">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);">Prüf-Aktivität</div>
        <span id="partner-last-active" style="font-size:.62rem;color:var(--muted);"></span>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:.7rem;font-size:.78rem;">
        Lade…
      </div>
    </div>` : ''}

    <div style="margin-bottom:.6rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);">Fällig – nächste ${forecastWindow} Tage</div>
        <div style="display:flex;gap:.25rem;">
          ${[7,14,30,90].map(n => `<button onclick="forecastWindow=${n};showStats();" style="padding:.15rem .4rem;font-size:.6rem;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;cursor:pointer;border-radius:2px;${forecastWindow===n ? 'background:var(--gold);border:1px solid var(--gold);color:var(--bg);font-weight:700;' : 'background:transparent;border:1px solid var(--border);color:var(--muted);'}">${n}d</button>`).join('')}
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:.7rem .7rem .5rem;">
        <div style="display:flex;gap:.4rem;align-items:flex-end;height:90px;margin-bottom:.6rem">${forecastBars}</div>
        ${forecastBlockedCount > 0 ? `<div style="font-size:.68rem;color:var(--muted);margin-bottom:.5rem;" title="In deiner Partner-Review-Queue — aktuell nicht in der Karten-Abfrage">📬 ${forecastBlockedCount} gesperrt</div>` : ''}
        <div style="border-top:1px solid var(--border);padding-top:.5rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;">
          <input id="pull-forward-count" type="number" min="1" max="200" value="20" style="width:3.5rem;padding:.3rem;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:.85rem;text-align:center;">
          <button onclick="pullForwardVocab()" style="flex:1;background:var(--gold);border:none;color:#0e0c0a;padding:.35rem .5rem;cursor:pointer;font-weight:700;font-size:.72rem;font-family:'IBM Plex Mono',monospace;white-space:nowrap;">Vorziehen</button>
          <button onclick="if(confirm('Fälligkeiten glätten?'))smoothSchedule();" style="flex:1;background:transparent;border:1px solid var(--blue);color:var(--blue);padding:.35rem .5rem;cursor:pointer;font-weight:700;font-size:.72rem;font-family:'IBM Plex Mono',monospace;white-space:nowrap;">Glätten</button>

        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);">Lernaktivität – letzte ${activityWindow} Tage</div>
        <div style="display:flex;gap:.25rem;">

        </div>
      </div>
      <div id="activity-stats-block" style="background:var(--surface);border:1px solid var(--border);padding:.7rem .7rem .5rem;font-size:.78rem;">

      </div>
    </div>` : ''}

    <div style="margin-bottom:.6rem;">
      <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:.4rem;">Gesamtfortschritt</div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:.7rem;">
        ${(cLesson === 'all' && phaseAnfaengerWeighted < 25) ? '<div style="margin-bottom:.6rem;padding:.4rem .6rem;background:rgba(201,76,76,.1);border:1px solid var(--red);font-size:.75rem;color:var(--red)">⚠️ Anfänger-Puffer wird knapp (noch ' + phaseAnfaenger + ' Vokabeln in L0-L2) — neue Vokabeln hinzufügen</div>' : ''}
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem;">
          <span style="font-size:1.3rem;font-weight:700;font-family:'Playfair Display',serif;color:var(--gold);min-width:3rem">${pct}%</span>

          <div style="flex:1;height:4px;background:var(--border);">

async function loadActivityStats(){
  const el = document.getElementById('activity-stats-block');
  if(!el || !currentUser) return;
  try{
    const today = new Date(); today.setHours(0,0,0,0);
    const since = new Date(today); since.setDate(since.getDate() - (activityWindow - 1));
    const rows = await sbApiPaged(
      'review_log?user_id=eq.'+currentUser.id+
      '&select=vocabulary_id,correct,created_at'+
      '&created_at=gte.'+since.toISOString()+
      '&order=created_at.asc',
      1000
    );

    // Pro Tag (Europe/Berlin-Kalendertag) aggregieren
    const days = {}; // { 'YYYY-MM-DD': {attempts, correct, vocabSet:Set} }
    (rows||[]).forEach(r=>{
      const key = new Date(r.created_at).toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
      if(!days[key]) days[key] = { attempts:0, correct:0, vocabSet:new Set() };
      days[key].attempts++;
      if(r.correct) days[key].correct++;
      if(r.vocabulary_id != null) days[key].vocabSet.add(r.vocabulary_id);
    });

    const dayList = Array.from({length:activityWindow}, (_,i)=>{
      const d = new Date(today); d.setDate(d.getDate() - (activityWindow - 1 - i));
      const key = d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
      const entry = days[key] || { attempts:0, correct:0, vocabSet:new Set() };
      return { d, attempts: entry.attempts, correct: entry.correct, vocabCount: entry.vocabSet.size };
    });

    const totalAttempts = dayList.reduce((s,x)=>s+x.attempts,0);
    const totalCorrect = dayList.reduce((s,x)=>s+x.correct,0);
    const totalVocabSet = new Set();
    (rows||[]).forEach(r=>{ if(r.vocabulary_id!=null) totalVocabSet.add(r.vocabulary_id); });
    const pctCorrectAll = totalAttempts ? Math.round(totalCorrect/totalAttempts*100) : 0;
    const maxAttempts = Math.max(...dayList.map(x=>x.attempts), 1);
    const avgAttempts = totalAttempts / activityWindow;
    const avgLinePct = Math.min(100, avgAttempts / maxAttempts * 100);

    const bars = dayList.map((x,i)=>{
      const isToday = i === dayList.length - 1;
      const isYesterday = i === dayList.length - 2;
      const name = isToday ? 'Heute' : isYesterday ? 'Gestern' : x.d.toLocaleDateString('de-DE',{weekday:'short'});
      const h = Math.round(x.attempts / maxAttempts * 100);
      const wrong = x.attempts - x.correct;
      const hCorrect = x.attempts ? Math.round(x.correct / x.attempts * 100) : 0;
      const hWrong = x.attempts ? 100 - hCorrect : 0;
      const labelColor = isToday ? 'var(--gold)' : 'var(--muted)';
      const pctDay = x.attempts ? Math.round(x.correct / x.attempts * 100) : null;
      const pctColor = pctDay === null ? 'var(--border)' : pctDay >= 80 ? 'var(--green)' : pctDay >= 50 ? 'var(--gold)' : 'var(--red)';
      return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:.15rem">
        <span style="font-size:.75rem;font-weight:700;color:${labelColor}">${x.attempts||''}</span>
        <div style="width:100%;background:var(--border);border-radius:3px;height:60px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative">
          ${avgAttempts > 0 ? `<div style="position:absolute;left:0;right:0;bottom:${avgLinePct}%;border-top:1px dashed var(--gold);opacity:.7;z-index:2;"></div>` : ''}
          ${x.attempts ? `<div style="width:100%;height:${Math.round(h*hWrong/100)}%;min-height:${wrong?'3px':'0'};background:var(--red);"></div><div style="width:100%;height:${Math.round(h*hCorrect/100)}%;min-height:${x.correct?'3px':'0'};background:var(--green);"></div>` : ''}
        </div>
        <span style="font-size:.6rem;color:var(--muted);text-align:center">${name}</span>
        <span style="font-size:.58rem;color:${pctColor};text-align:center;min-height:.75rem;display:block">${pctDay !== null ? pctDay+'%' : '&nbsp;'}</span>
      </div>`;
    }).join('');

    el.innerHTML = totalAttempts === 0
      ? `<div style="color:var(--muted)">Noch keine Daten in diesem Zeitraum.</div>`
      : `<div style="display:flex;gap:.4rem;align-items:flex-end;height:100px;margin-bottom:.5rem">${bars}</div>
         <div style="border-top:1px solid var(--border);padding-top:.4rem;font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;">
           <span>${totalAttempts} Versuche · <span style="color:var(--green)">${pctCorrectAll}% richtig</span></span>
           <span>${totalVocabSet.size} Vokabeln geübt</span>
         </div>`;
  } catch(e){
    el.innerHTML = `<span style="color:var(--red);font-size:.75rem">Fehler: ${e.message}</span>`;
  }
}

async function loadPartnerStats(){
  const el = document.querySelector('#partner-stats-block > div:last-child');
  if(!el) return;
  try {
    // Lade alle is_partner User + last_active_at
    const partners = await sbApi('users?is_partner=eq.true&select=last_active_at');

    // last_active_at: neueste unter allen Partnern
    let lastActive = null;
    partners.forEach(p => {
      if(p.last_active_at){
        const d = new Date(p.last_active_at);
        if(!lastActive || d > lastActive) lastActive = d;
      }
    });

    const now = new Date();
    let activityText, activityColor;
    if(!lastActive){
      activityText = 'Noch keine Aktivität';
      activityColor = 'var(--muted)';
    } else {
      const diffMs = now - lastActive;
      const diffDays = Math.floor(diffMs / 86400000);
      const diffHours = Math.floor(diffMs / 3600000);
      if(diffHours < 1) activityText = 'Vor weniger als einer Stunde';
      else if(diffHours < 24) activityText = 'Vor ' + diffHours + ' Stunde' + (diffHours===1?'':'n');
      else activityText = 'Vor ' + diffDays + ' Tag' + (diffDays===1?'':'en');
      activityColor = diffDays >= 3 ? 'var(--red)' : diffDays >= 1 ? 'var(--gold)' : 'var(--green)';
    }

    const diffDays = lastActive ? Math.floor((now - lastActive) / 86400000) : 999;
    const warningHtml = diffDays >= 3
      ? '<div style="margin-bottom:.6rem;padding:.4rem .6rem;background:rgba(201,76,76,.1);border:1px solid var(--red);font-size:.75rem;color:var(--red)">⚠️ Seit ' + diffDays + ' Tagen keine Prüfung</div>'
      : '';

    const approvedRecentCutoff = new Date(Date.now() - 7*86400000).toISOString();
    const approvedRecentN = await sbApiCount('vocabulary?partner_status=eq.approved&status_updated_at=gte.'+approvedRecentCutoff+'&select=id');
    const rejectedN = await sbApiCount('vocabulary?partner_status=eq.rejected&select=id');
    const unknownN  = await sbApiCount('vocabulary?partner_status=eq.unknown&select=id');
    const pendingN  = await sbApiCount('vocabulary?partner_status=eq.pending&select=id');
    const suggestedN = await sbApiCount('vocabulary?partner_status=eq.suggested&select=id');
    const commentedN = await sbApiCount('vocabulary?partner_comment=not.is.null&select=id');

    // Letzte Aktivität kompakt in die Kopfzeile neben dem Abschnittstitel
    const lastActiveEl = document.getElementById('partner-last-active');
    if(lastActiveEl){ lastActiveEl.style.color = activityColor; lastActiveEl.textContent = activityText; }

    el.innerHTML = warningHtml +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;text-align:center">' +
        '<div style="padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--gold)">' + pendingN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">⏳ Offen</div>' +
        '</div>' +
        '<div onclick="jumpToRecentApproved(7)" style="cursor:pointer;padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--green)">' + approvedRecentN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">✅ Letzte 7 Tage</div>' +
        '</div>' +
        '<div onclick="jumpToPartnerQueue(\'suggested\')" style="cursor:pointer;padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--blue)">' + suggestedN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">💡 Vorschlag</div>' +
        '</div>' +
        '<div onclick="jumpToPartnerQueue(\'rejected\')" style="cursor:pointer;padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--red)">' + rejectedN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">❌ Falsch</div>' +
        '</div>' +
        '<div onclick="jumpToPartnerQueue(\'unknown\')" style="cursor:pointer;padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--muted)">' + unknownN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">❓ Unklar</div>' +
        '</div>' +
        '<div onclick="jumpToPartnerQueue(\'commented\')" style="cursor:pointer;padding:.4rem;background:var(--surface2);border:1px solid var(--border);">' +
          '<div style="font-size:1.1rem;font-weight:700;color:var(--gold2)">' + commentedN + '</div>' +
          '<div style="font-size:.62rem;color:var(--muted)">💬 Kommentar</div>' +
        '</div>' +
      '</div>';
  } catch(e) {
    const el2 = document.querySelector('#partner-stats-block > div:last-child');
    if(el2) el2.innerHTML = '<span style="color:var(--red);font-size:.75rem">Fehler: ' + e.message + '</span>';
  }
}

async function pullForwardVocab(){
  const n = parseInt(document.getElementById('pull-forward-count').value) || 20;
  const resultEl = document.getElementById('pull-forward-result');
  resultEl.textContent = 'Lädt…';

  // Alle noch nicht fälligen Vokabeln der aktuellen Lektion, sortiert nach next_review
  // (nur Tag relevant, Uhrzeit ignoriert), innerhalb desselben Tages nach Level (höhere zuerst)
  const now = new Date();
  const pfDayOf = d => { const t = new Date(d); t.setHours(0,0,0,0); return t.getTime(); };
  const candidates = Object.entries(srsProgress)
    .filter(([vocabId, p]) => p && p.next_review && new Date(p.next_review).getTime() > now.getTime())
    .map(([vocabId, p]) => [vocabId, p, vById(vocabId)])
    .filter(([vocabId, p, v]) => {
      if(cLesson === 'all') return true;
      if(cLesson === 'COURSEVOCAB' && COURSE_VOCAB_FILTER){
        return v && (COURSE_VOCAB_FILTER.ids.has(v.id) || COURSE_VOCAB_FILTER.tr.has(v.tr));
      }
      return v && v.ls === cLesson;
    })
    .sort((a, b) => {
      const dayDiff = pfDayOf(a[1].next_review) - pfDayOf(b[1].next_review);
      return dayDiff !== 0 ? dayDiff : (b[1].level||0) - (a[1].level||0);
    })
    .map(([vocabId, p]) => [vocabId, p])
    .slice(0, n);

  if(!candidates.length){
    resultEl.textContent = 'Keine vorziehbaren Vokabeln gefunden.';
    return;
  }

  const nowISO = now.toISOString();
  let count = 0;
  for(const [vocabId, p] of candidates){
    try{
      await sbApi('progress?id=eq.'+p.id, 'PATCH', { next_review: nowISO });
      srsProgress[vocabId].next_review = now;
      count++;
    }catch(e){
      dbg('Fehler beim Vorziehen: '+e.message, 'warn');
    }
  }
  resultEl.innerHTML = `<span style="color:var(--green)">✓ ${count} Vokabeln vorgezogen — jetzt fällig.</span>`;
  updateLessonChips();
  // Statistik neu rendern damit Forecast aktualisiert wird
  const savedCount = n;
  showStats();
  const newInput = document.getElementById('pull-forward-count');
  if(newInput) newInput.value = savedCount;
  const newResult = document.getElementById('pull-forward-result');
  if(newResult) newResult.innerHTML = `<span style="color:var(--green)">✓ ${count} Vokabeln vorgezogen — jetzt fällig.</span>`;
}
