<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tounsi Trainer 🇹🇳</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--surface:#1a1612;--surface2:#242018;--border:#3a3228;--gold:#c9a84c;--gold2:#e8c96a;--red:#c94c4c;--green:#4cac6e;--text:#f0e8d8;--muted:#8a7d6a;--blue:#4c7ac9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(201,168,76,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(232,114,58,.05) 0%,transparent 50%);}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.login-box{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,.5);}
.login-flag{font-size:2.5rem;text-align:center;margin-bottom:.5rem;}
.login-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;text-align:center;color:var(--gold2);margin-bottom:.2rem;}
.login-sub{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:1.8rem;}
.login-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.4rem;}
.login-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:.7rem .9rem;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.85rem;outline:none;margin-bottom:1rem;transition:border-color .2s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;background:linear-gradient(135deg,var(--gold),#a07020);border:none;border-radius:6px;padding:.75rem;color:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;margin-bottom:.8rem;}
.login-toggle{text-align:center;font-size:.65rem;color:var(--muted);cursor:pointer;text-decoration:underline;}
.login-error{background:rgba(201,76,76,.12);border:1px solid rgba(201,76,76,.3);border-radius:4px;padding:.5rem .7rem;font-size:.7rem;color:var(--red);margin-bottom:.8rem;text-align:center;}
#app-screen{display:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;gap:.5rem;}
.logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;}
.logo em{color:var(--gold);font-style:italic;}
.logo small{display:block;font-family:'IBM Plex Mono',monospace;font-size:.55rem;opacity:.4;text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
.score-display{display:flex;gap:1.2rem;font-size:.65rem;text-transform:uppercase;letter-spacing:1px;align-items:center;}
.score-item{display:flex;flex-direction:column;align-items:center;gap:.1rem;}
.score-num{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;}
.logout-btn{padding:.35rem .8rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.6rem;text-transform:uppercase;cursor:pointer;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.lesson-bar{display:flex;overflow-x:auto;gap:.3rem;padding:.5rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);align-items:center;}
.lesson-bar-label{font-size:.58rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap;margin-right:.3rem;}
.lesson-chip{padding:.3rem .7rem;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.6rem;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .15s;border-radius:2px;}
.lesson-chip:hover{border-color:var(--gold);color:var(--text);}
.lesson-chip.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500;}
.mode-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);}
.mode-btn{padding:.65rem 1.1rem;border:none;background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;}
.mode-btn:hover{color:var(--text);}
.mode-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
main{max-width:700px;margin:0 auto;padding:1.5rem 1.2rem;}
.exercise-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
.ex-type{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--gold);opacity:.85;}
.ex-progress{font-size:.6rem;color:var(--muted);}
.progress-bar{height:2px;background:var(--border);margin-bottom:1.5rem;}
.progress-fill{height:100%;background:var(--gold);transition:width .4s ease;}
.q-card{background:var(--surface);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.2rem;position:relative;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35;}
.q-label{font-size:.58rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.7rem;}
.q-arabic{font-size:2rem;direction:rtl;font-family:'Playfair Display',serif;font-weight:700;color:var(--gold2);}
.q-text{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.4;}
.q-sub{font-size:.75rem;color:var(--muted);margin-top:.4rem;line-height:1.6;}
.q-hint{margin-top:.8rem;padding:.5rem .8rem;background:var(--surface2);border-left:2px solid var(--gold);font-size:.72rem;color:var(--muted);display:none;}
.q-hint.visible{display:block;}
.choices{display:flex;flex-direction:column;gap:.5rem;}
.choice-btn{padding:.75rem 1rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:.7rem;}
.choice-btn:hover:not(:disabled){border-color:var(--gold);background:var(--surface);}
.choice-btn.correct{border-color:var(--green);background:rgba(76,172,110,.1);color:var(--green);}
.choice-btn.wrong{border-color:var(--red);background:rgba(201,76,76,.1);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.choice-letter{min-width:20px;height:20px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--muted);}
.choice-btn.correct .choice-letter{border-color:var(--green);color:var(--green);}
.choice-btn.wrong .choice-letter{border-color:var(--red);color:var(--red);}
.answer-input{flex:1;padding:.75rem .9rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.9rem;outline:none;transition:border-color .2s;}
.answer-input:focus{border-color:var(--gold);}
.answer-input.correct{border-color:var(--green);}
.answer-input.wrong{border-color:var(--red);}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.match-col{display:flex;flex-direction:column;gap:.4rem;}
.match-item{padding:.6rem .8rem;background:var(--surface2);border:1px solid var(--border);font-size:.78rem;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;user-select:none;}
.match-item.arabic{font-size:1.05rem;direction:rtl;color:var(--gold2);}
.match-item.selected{border-color:var(--gold);background:rgba(201,168,76,.1);}
.match-item.matched{border-color:var(--green);background:rgba(76,172,110,.1);color:var(--green);cursor:default;opacity:.7;}
.match-item.wrong-flash{border-color:var(--red);background:rgba(201,76,76,.1);}
.word-bank{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem;min-height:40px;}
.word-chip{padding:.35rem .7rem;background:var(--surface2);border:1px solid var(--border);font-size:.78rem;cursor:pointer;transition:all .15s;user-select:none;}
.word-chip:hover{border-color:var(--gold);}
.word-chip.used{opacity:.2;cursor:default;pointer-events:none;}
.answer-slots{display:flex;flex-wrap:wrap;gap:.35rem;min-height:40px;padding:.4rem;border:1px dashed var(--border);background:var(--surface2);margin-bottom:.8rem;cursor:pointer;}
.answer-slot{padding:.35rem .7rem;background:var(--surface);border:1px solid var(--gold);font-size:.78rem;color:var(--gold2);}
.feedback{padding:.7rem .9rem;margin-top:.7rem;font-size:.78rem;line-height:1.6;display:none;}
.feedback.show{display:block;}
.feedback.correct{background:rgba(76,172,110,.1);border-left:3px solid var(--green);color:var(--green);}
.feedback.wrong{background:rgba(201,76,76,.1);border-left:3px solid var(--red);color:var(--red);}
.btn-row{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap;}
.btn{padding:.65rem 1.3rem;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:border-color .15s,background .15s;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500;}
.btn.primary:hover{background:var(--gold2);border-color:var(--gold2);}
.btn.ghost{opacity:.55;}
.btn.ghost:hover{opacity:1;}
.conj-table{width:100%;border-collapse:collapse;margin-bottom:1rem;font-size:.78rem;}
.conj-table th{padding:.5rem .8rem;text-align:left;border-bottom:1px solid var(--border);color:var(--gold);font-weight:500;font-size:.6rem;text-transform:uppercase;letter-spacing:1px;}
.conj-table td{padding:.5rem .8rem;border-bottom:1px solid rgba(58,50,40,.5);}
.conj-table tr:last-child td{border-bottom:none;}
.conj-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:.25rem .5rem;outline:none;width:100%;transition:border-color .2s;}
.conj-input:focus{border-color:var(--gold);}
.conj-input.correct{border-color:var(--green);color:var(--green);}
.conj-input.wrong{border-color:var(--red);color:var(--red);}
.grammar-box{background:var(--surface2);border:1px solid var(--border);padding:1rem;margin-bottom:1rem;position:relative;}
.grammar-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.5;}
.grammar-title{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--blue);margin-bottom:.6rem;}
.grammar-text{font-size:.78rem;line-height:1.7;color:var(--text);}
.grammar-example{margin-top:.5rem;padding:.4rem .6rem;background:var(--surface);border-left:2px solid var(--blue);font-size:.75rem;color:var(--muted);}
.grammar-example .ar{direction:rtl;color:var(--gold2);font-family:'Playfair Display',serif;}
.speed-card{text-align:center;padding:1.5rem 1rem;}
.speed-timer{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold);line-height:1;}
.speed-bar{height:4px;background:var(--border);margin:1rem 0;border-radius:2px;}
.speed-fill{height:100%;background:var(--gold);transition:width 1s linear;border-radius:2px;}
.speed-word{font-family:'Playfair Display',serif;font-size:2.2rem;direction:rtl;color:var(--gold2);margin:1rem 0 .3rem;}
.speed-btns{display:flex;gap:.8rem;justify-content:center;margin-top:1.2rem;}
.speed-btn{padding:.7rem 2rem;border:1px solid;font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.speed-btn.yes{background:rgba(76,172,110,.1);border-color:var(--green);color:var(--green);}
.speed-btn.yes:hover{background:rgba(76,172,110,.25);}
.speed-btn.no{background:rgba(201,76,76,.1);border-color:var(--red);color:var(--red);}
.speed-btn.no:hover{background:rgba(201,76,76,.25);}
.chat{max-height:260px;overflow-y:auto;padding:.5rem 0;margin-bottom:.8rem;}
.chat-bubble{padding:.7rem 1rem;margin-bottom:.5rem;font-size:.82rem;line-height:1.5;max-width:85%;}
.chat-bubble.vendor{background:var(--surface2);border:1px solid var(--border);border-radius:0 8px 8px 8px;margin-right:auto;}
.chat-bubble.user{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);border-radius:8px 0 8px 8px;margin-left:auto;text-align:right;}
.chat-bubble .arabic{direction:rtl;font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold2);}
.chat-bubble .transl{font-size:.7rem;color:var(--muted);margin-top:.2rem;}
.chat-options{display:flex;flex-direction:column;gap:.4rem;}
.chat-opt{padding:.6rem .9rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.75rem;text-align:left;cursor:pointer;transition:border-color .15s;}
.chat-opt:hover:not(:disabled){border-color:var(--gold);}
.chat-opt.correct{border-color:var(--green);background:rgba(76,172,110,.1);}
.chat-opt.wrong{border-color:var(--red);background:rgba(201,76,76,.1);}
.chat-opt:disabled{cursor:default;}
.lesson-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);font-size:.6rem;color:var(--gold);margin-bottom:.8rem;}
#result-screen{display:none;position:fixed;inset:0;background:rgba(14,12,10,.95);z-index:100;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;}
#result-screen.show{display:flex;}
.result-pct{font-family:'Playfair Display',serif;font-size:5rem;font-weight:900;color:var(--gold);line-height:1;}
.result-msg{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--text);margin:.5rem 0;}
.result-sub{font-size:.75rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.8;}
.update-notice{background:rgba(76,172,110,.08);border:1px solid rgba(76,172,110,.3);padding:.6rem 1rem;font-size:.68rem;color:var(--green);}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-flag">&#127481;&#127475;</div>
    <div class="login-title">Tounsi Trainer</div>
    <div class="login-sub">Tunesisches Arabisch &middot; v8</div>
    <div id="login-error" class="login-error" style="display:none"></div>
    <div class="login-label">Nutzername</div>
    <input class="login-input" id="login-username" placeholder="dein Name" autocomplete="username" />
    <div class="login-label">Passwort</div>
    <input class="login-input" id="login-password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" />
    <button class="login-btn" id="login-btn" onclick="doLogin()">Anmelden</button>
    <div class="login-toggle" id="login-toggle" onclick="toggleRegister()">Noch kein Konto? Registrieren &rarr;</div>
  </div>
</div>
<div id="app-screen">
<header>
  <div class="logo">Tounsi <em>Trainer</em><small id="header-user">v8</small></div>
  <div class="score-display">
    <div class="score-item"><span class="score-num" id="sc-correct" style="color:var(--green)">0</span><span>Richtig</span></div>
    <div class="score-item"><span class="score-num" id="sc-wrong" style="color:var(--red)">0</span><span>Falsch</span></div>
    <div class="score-item"><span class="score-num" id="sc-streak" style="color:var(--gold)">0</span><span>Streak</span></div>
    <button class="logout-btn" onclick="doLogout()">Abmelden</button>
    <button class="logout-btn" id="dbg-btn" onclick="toggleDebug()" style="color:var(--gold);border-color:var(--gold);font-size:.7rem;padding:.4rem .6rem;">DBG</button>
  </div>
</header>
<div class="update-notice">v8 &mdash; SRS aktiv &middot; L1&ndash;L9 vollst&auml;ndig</div>
<div class="lesson-bar">
  <span class="lesson-bar-label">Lektion:</span>
  <button class="lesson-chip active" onclick="filterLesson('all',this)">Alle</button>
  <button class="lesson-chip" data-ls="L1" onclick="filterLesson('L1',this)">L1 &middot; Begr&uuml;&szlig;ung</button>
  <button class="lesson-chip" data-ls="L2" onclick="filterLesson('L2',this)">L2 &middot; Zahlen</button>
  <button class="lesson-chip" data-ls="L3" onclick="filterLesson('L3',this)">L3 &middot; Alltag</button>
  <button class="lesson-chip" data-ls="L4" onclick="filterLesson('L4',this)">L4 &middot; Geld</button>
  <button class="lesson-chip" data-ls="L4currency" onclick="filterLesson('L4currency',this)">L4 &middot; W&auml;hrung</button>
  <button class="lesson-chip" data-ls="L5" onclick="filterLesson('L5',this)">L5 &middot; Einkaufen</button>
  <button class="lesson-chip" data-ls="L5fruit" onclick="filterLesson('L5fruit',this)">L5 &middot; Obst</button>
  <button class="lesson-chip" data-ls="L5veg" onclick="filterLesson('L5veg',this)">L5 &middot; Gem&uuml;se</button>
  <button class="lesson-chip" data-ls="L6" onclick="filterLesson('L6',this)">L6 &middot; Essen</button>
  <button class="lesson-chip" data-ls="L7" onclick="filterLesson('L7',this)">L7 &middot; Kleidung</button>
  <button class="lesson-chip" data-ls="L7color" onclick="filterLesson('L7color',this)">L7 &middot; Farben</button>
  <button class="lesson-chip" data-ls="L8" onclick="filterLesson('L8',this)">L8 &middot; Post</button>
  <button class="lesson-chip" data-ls="L9" onclick="filterLesson('L9',this)">L9 &middot; Transport</button>
</div>
<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('mc',this)">&#127919; Multiple Choice</button>
  <button class="mode-btn" onclick="setMode('mix',this)">&#127922; Mix</button>
  <button class="mode-btn" onclick="setMode('match',this)">&#128279; Matching</button>
  <button class="mode-btn" onclick="setMode('fill',this)">&#9999;&#65039; L&uuml;ckentext</button>
  <button class="mode-btn" onclick="setMode('conj',this)">&#128208; Konjugation</button>
  <button class="mode-btn" onclick="setMode('order',this)">&#128256; Wortfolge</button>
  <button class="mode-btn" onclick="setMode('roleplay',this)">&#128722; Roleplay</button>
  <button class="mode-btn" onclick="setMode('grammar',this)">&#128214; Grammatik</button>
  <button class="mode-btn" onclick="setMode('speed',this)">&#9889; Speed</button>
</div>
<main>
  <div id="exercise-screen">
    <div class="exercise-header">
      <span class="ex-type" id="ex-type-label">&Uuml;bung</span>
      <span class="ex-progress" id="ex-progress">1 / 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="exercise-content"></div>
  </div>
</main>
<div id="result-screen">
  <div class="result-pct" id="result-pct">0%</div>
  <div class="result-msg" id="result-msg">Yalla!</div>
  <div class="result-sub" id="result-sub"></div>
  <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;">
    <button class="btn primary" onclick="restartExercise()">Nochmal</button>
    <button class="btn" onclick="closeResult()">Andere &Uuml;bung</button>
  </div>
</div>
</div>
<script>


function normalize(s){
  if(!s)return'';
  s=s.trim().toLowerCase();
  s=s.replace(/[éèêë]/g,'e').replace(/[àâäå]/g,'a');
  s=s.replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ûüùú]/g,'u');
  s=s.replace(/ñ/g,'n').replace(/ç/g,'c');
  s=s.replace(/ʿ/g,'3').replace(/ħ/g,'7').replace(/ʔ/g,'').replace(/2/g,'');
  s=s.replace(/sch/g,'sh').replace(/kh/g,'x').replace(/ch/g,'x');
  s=s.replace(/gh/g,'g').replace(/dh/g,'d').replace(/th/g,'t').replace(/tj/g,'j');
  s=s.replace(/q/g,'k');
  s=s.replace(/\bel[\-\s]/g,'el ').replace(/\bal[\-\s]/g,'el ');
  s=s.replace(/oo/g,'u').replace(/ou/g,'u').replace(/ey/g,'i').replace(/ei/g,'i');
  s=s.replace(/-/g,'').replace(/[?!.,;:\u2014\u2013()"\u00ab\u00bb]/g,'');
  s=s.replace(/7/g,'h').replace(/3/g,'');
  s=s.replace(/\s/g,'');
  return s;
}


// Debug Panel
let IS_DEBUG = false;
function toggleDebug(){
  IS_DEBUG = !IS_DEBUG;
  const panel = document.getElementById('debug-panel');
  const btn = document.getElementById('dbg-btn');
  if(IS_DEBUG){
    panel.style.display = 'block';
    if(btn) btn.style.background = 'rgba(201,168,76,.3)';
    dbg('=== DEBUG AN ===', 'ok');
    dbg('vocabIdMap: ' + Object.keys(vocabIdMap).length + ' Einträge (soll 244)', Object.keys(vocabIdMap).length >= 244 ? 'ok' : 'err');
    dbg('srsProgress: ' + Object.keys(srsProgress).length + ' Einträge', 'ok');
    dbg('User: ' + (currentUser ? currentUser.username : 'nicht eingeloggt'), currentUser ? 'ok' : 'err');
  } else {
    panel.style.display = 'none';
    if(btn) btn.style.background = '';
  }
}
function dbg(msg, cls){
  if(!IS_DEBUG) return;
  const panel = document.getElementById('debug-panel');
  const log = document.getElementById('debug-log');
  if(!panel || !log) return;
  panel.style.display = 'block';
  const d = document.createElement('div');

// ══ SRS — Spaced Repetition (Tage-basiert, Supabase) ════════════════════════
const SRS_DAYS = [1, 3, 7, 14, 30, 90]; // Tage pro Level 0-5
let srsProgress = {}; // {darija_tr: {id, level, next_review, vocabulary_id}}
let vocabIdMap = {};  // {darija_tr: vocabulary_id}

function srsKey(v){ return v.tr; }

async function srsLoadFromSupabase(){
  if(!currentUser) return;
  try{
    // Lade vocabulary IDs
    // Vokabeln in Batches laden (Supabase row limit umgehen)
    let allVocab = [];
    let offset = 0;
    const batchSize = 100;
    while(true){
      const batch = await sbApi('vocabulary?select=id,darija&order=id.asc&limit='+batchSize+'&offset='+offset);
      if(!batch || batch.length === 0) break;
      allVocab = allVocab.concat(batch);
      if(batch.length < batchSize) break;
      offset += batchSize;
    }
    allVocab.forEach(v => { vocabIdMap[v.darija] = v.id; });
    dbg('Geladen: ' + allVocab.length + ' Vokabeln', 'ok');

    // Lade progress des Nutzers
    const progress = await sbApi(
      'progress?user_id=eq.'+currentUser.id+'&select=id,vocabulary_id,correct_count,wrong_count,next_review'
    );
    progress.forEach(p => {
      const level = Math.min(p.correct_count, 5);
      srsProgress[p.vocabulary_id] = {
        id: p.id,
        vocabulary_id: p.vocabulary_id,
        level: level,
        next_review: p.next_review ? new Date(p.next_review) : new Date(0),
      };
    });
    const vmSize = Object.keys(vocabIdMap).length;
    const spSize = Object.keys(srsProgress).length;
    dbg('vocabIdMap: ' + vmSize + ' Einträge', vmSize > 0 ? 'ok' : 'err');
    dbg('progress: ' + spSize + ' Einträge', 'ok');
    if(vmSize > 0){
      const k = Object.keys(vocabIdMap)[0];
      dbg('Beispiel: "' + k + '" → id ' + vocabIdMap[k], 'ok');
    }
  } catch(e){
    dbg('FEHLER load: ' + e.message, 'err');
  }
}

async function srsAnswer(vocab, correct){
  if(!currentUser){ dbg('FEHLER: kein User', 'err'); return; }
  const vocabId = vocabIdMap[vocab.tr];
  dbg('Antwort: "' + vocab.tr + '" → id=' + vocabId + (correct?' ✓':' ✗'), vocabId ? (correct?'ok':'err') : 'err');
  if(!vocabId){
    // Zeige erste 3 Keys aus vocabIdMap zum Vergleich
    const keys = Object.keys(vocabIdMap).slice(0,3);
    dbg('Erste Keys: ' + keys.join(', '), 'err');
    dbg('FEHLER: keine id für "' + vocab.tr + '"', 'err');
    return;
  }

  const existing = srsProgress[vocabId];
  let level = existing ? existing.level : 0;
  let correctCount = existing ? (existing.level) : 0;
  let wrongCount = 0;

  if(correct){
    level = Math.min(level + 1, 5);
  } else {
    level = Math.max(level - 1, 0);
  }

  // next_review = jetzt + SRS_DAYS[level] Tage
  const nextReview = new Date();
  nextReview.setDate(nextReview.getDate() + SRS_DAYS[level]);

  const data = {
    user_id: currentUser.id,
    vocabulary_id: vocabId,
    correct_count: correct ? level : Math.max(0, level),
    wrong_count: correct ? 0 : 1,
    next_review: nextReview.toISOString(),
  };

  try{
    if(existing && existing.id){
      dbg('PATCH progress id='+existing.id, 'ok');
      await sbApi('progress?id=eq.'+existing.id, 'PATCH', {
        correct_count: data.correct_count,
        next_review: data.next_review,
      });
      srsProgress[vocabId].level = level;
      srsProgress[vocabId].next_review = nextReview;
      dbg('✓ PATCH gespeichert level='+level, 'ok');
    } else {
      dbg('POST progress vocab='+vocabId, 'ok');
      const res = await sbApi('progress', 'POST', data);
      if(res && res[0]){
        dbg('✓ POST gespeichert id='+res[0].id+' level='+level, 'ok');
        srsProgress[vocabId] = {
          id: res[0].id,
          vocabulary_id: vocabId,
          level: level,
          next_review: nextReview,
        };
      }
    }
  } catch(e){
    dbg('FEHLER save: ' + e.message, 'err');
  }
}

function srsGetLevel(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return 0;
  const p = srsProgress[vocabId];
  return p ? p.level : 0;
}

function srsIsDue(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return true; // Neu → fällig
  const p = srsProgress[vocabId];
  if(!p) return true; // Noch nie gesehen → fällig
  return new Date() >= new Date(p.next_review);
}

function srsDaysUntil(vocab){
  const vocabId = vocabIdMap[vocab.tr];
  if(!vocabId) return 0;
  const p = srsProgress[vocabId];
  if(!p) return 0;
  const diff = new Date(p.next_review) - new Date();
  return Math.max(0, Math.ceil(diff / (1000*60*60*24)));
}

function buildSrsQueue(vocab){
  const due = vocab.filter(v => srsIsDue(v));
  const notDue = vocab.filter(v => !srsIsDue(v));
  // Fällige: niedrigstes Level zuerst, dann zufällig
  due.sort((a,b) => {
    const la = srsGetLevel(a), lb = srsGetLevel(b);
    return la !== lb ? la - lb : Math.random() - .5;
  });
  // Nicht fällige: ans Ende, nach next_review sortiert
  notDue.sort((a,b) => {
    const va = vocabIdMap[a.tr], vb = vocabIdMap[b.tr];
    const pa = srsProgress[va], pb = srsProgress[vb];
    if(!pa) return -1; if(!pb) return 1;
    return new Date(pa.next_review) - new Date(pb.next_review);
  });
  return [...due, ...notDue];
}

function countDueToday(lessonVocab){
  return lessonVocab.filter(v => srsIsDue(v)).length;
}

function updateLessonChips(){
  const chips = document.querySelectorAll('.lesson-chip');
  chips.forEach(chip => {
    const ls = chip.getAttribute('data-ls');
    if(!ls || ls === 'all') return;
    const lessonVocab = ALL_VOCAB.filter(v => {
      if(ls === 'L5fruit') return v.ls==='L5' && v.tp==='Obst';
      if(ls === 'L5veg')   return v.ls==='L5' && v.tp==='Gemüse';
      if(ls === 'L7color') return v.ls==='L7' && v.tp==='Farben';
      if(ls === 'L4currency') return v.ls==='L4' && v.tp==='Währung';
      return v.ls === ls;
    });
    const due = countDueToday(lessonVocab);
    // Entferne alten Badge
    const oldBadge = chip.querySelector('.due-badge');
    if(oldBadge) oldBadge.remove();
    if(due > 0){
      const badge = document.createElement('span');
      badge.className = 'due-badge';
      badge.textContent = due;
      badge.style.cssText = 'margin-left:4px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-size:.55rem;vertical-align:middle;';
      chip.appendChild(badge);
    }
  });
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// STATE
let cMode='mc',cLesson='all',cIdx=0,exList=[];
// SRS: Spaced Repetition State
let srsLevels={};  // {vocabKey: level 0-5}
let srsQueue=[];   // Aktive Lernqueue mit {vocab, dueIn} Objekten
const SRS_INTERVALS=[1,3,7,15,30,999]; // Wiederholung nach N anderen Karten

function srsKey(v){return v.ls+'_'+v.ar;}

function srsAnswer(vocab, correct){
  const k=srsKey(vocab);
  let lvl=srsLevels[k]||0;
  if(correct){
    lvl=Math.min(lvl+1,5);
  } else {
    lvl=Math.max(lvl-1,0);
  }
  srsLevels[k]=lvl;
  // Speichern (localStorage als Fallback wenn kein Supabase)
  try{localStorage.setItem('srs_'+k,lvl);}catch(e){}
}

function srsLoad(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key&&key.startsWith('srs_')){
        srsLevels[key.slice(4)]=parseInt(localStorage.getItem(key))||0;
      }
    }
  }catch(e){}
}

function buildSrsQueue(vocab){
  // Sortiere: niedrigeres Level zuerst, dann zufällig innerhalb gleichen Levels
  return [...vocab].sort((a,b)=>{
    const la=srsLevels[srsKey(a)]||0;
    const lb=srsLevels[srsKey(b)]||0;
    if(la!==lb)return la-lb;
    return Math.random()-.5;
  });
}

function interleaveSrs(vocab){
  // Baut Queue mit SRS-Wiederholungslogik
  // Karten die falsch beantwortet wurden kommen nach SRS_INTERVALS[level] Karten wieder
  const initial=buildSrsQueue(vocab);
  const result=[];
  const pending=[]; // {vocab, insertAt}
  let pos=0;
  for(const v of initial){
    // Füge fällige pending-Karten ein
    while(pending.length&&pending[0].insertAt<=pos){
      result.push({type:'mc',v:pending.shift().vocab,srs:true});
      pos++;
    }
    result.push({type:'mc',v,srs:true});
    pos++;
  }
  // Reste aus pending anhängen
  for(const p of pending) result.push({type:'mc',v:p.vocab,srs:true});
  return result;
}

function sh(a){return[...a].sort(()=>Math.random()-.5);}
function eq(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function ek(s){return btoa(encodeURIComponent(s)).replace(/[^a-zA-Z0-9]/g,'').slice(0,20);}
function gv(){
  if(cLesson==='all')return ALL_VOCAB;
  if(cLesson==='L5fruit')return ALL_VOCAB.filter(v=>v.ls==='L5'&&v.tp==='Obst');
  if(cLesson==='L5veg')return ALL_VOCAB.filter(v=>v.ls==='L5'&&v.tp==='Gemüse');
  if(cLesson==='L7color')return ALL_VOCAB.filter(v=>v.ls==='L7'&&v.tp==='Farben');
  if(cLesson==='L4currency')return ALL_VOCAB.filter(v=>v.ls==='L4'&&v.tp==='Währung');
  return ALL_VOCAB.filter(v=>v.ls===cLesson);
}
function gp(arr){
  if(cLesson==='all')return arr;
  const k=cLesson==='L5fruit'||cLesson==='L5veg'?'L5':cLesson==='L7color'?'L7':cLesson==='L4currency'?'L4':cLesson;
  const f=arr.filter(x=>x.ls===k);return f.length?f:arr;
}
function filterLesson(l,el){cLesson=l;document.querySelectorAll('.lesson-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');go();}
function setMode(m,el){cMode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');go();}
function updScore(){document.getElementById('sc-correct').textContent=score.c;document.getElementById('sc-wrong').textContent=score.w;document.getElementById('sc-streak').textContent=score.st;}
function showFb(ok,ca){const fb=document.getElementById('feedback');if(!fb)return;fb.className='feedback show '+(ok?'correct':'wrong');fb.textContent=ok?'✓ Richtig!':'✗ Falsch.'+(ca?' Antwort: '+ca:'');}
function showNext(){const r=document.getElementById('btn-row');if(!r)return;r.innerHTML='';const b=document.createElement('button');b.className='btn primary';b.textContent='Weiter →';b.onclick=nxt;r.appendChild(b);}
function go(){
  score={c:0,w:0,t:0,st:0};updScore();
  if(sTimer){clearInterval(sTimer);sTimer=null;}
  document.getElementById('result-screen').classList.remove('show');
  const v=sh(gv());
  if(cMode==='mc')exList=bMC(v);
  else if(cMode==='match')exList=bMatch(v);
  else if(cMode==='fill')exList=bFill();
  else if(cMode==='conj')exList=bConj();
  else if(cMode==='order')exList=bOrder();
  else if(cMode==='roleplay')exList=bRP();
  else if(cMode==='grammar')exList=bGram();
  else if(cMode==='speed')exList=[{type:'speed'}];
  else if(cMode==='mix')exList=sh([...bMC(v).slice(0,4),...bMatch(v).slice(0,1),...bFill().slice(0,2),...bOrder().slice(0,1)]);
  cIdx=0;render();
}
function nxt(){cIdx++;if(cIdx>=exList.length){if(cMode==='speed')return;showRes();}else render();}
function render(){
  const ex=exList[cIdx];answered=false;
  const pct=exList.length>1?Math.round(cIdx/exList.length*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('ex-progress').textContent=(cIdx+1)+' / '+exList.length;
  const c=document.getElementById('exercise-content');c.innerHTML='';
  if(ex.type==='mc')rMC(ex,c);
  else if(ex.type==='match')rMatch(ex,c);
  else if(ex.type==='fill')rFill(ex,c);
  else if(ex.type==='conj')rConj(ex,c);
  else if(ex.type==='order')rOrder(ex,c);
  else if(ex.type==='roleplay')rRP(ex.data,c);
  else if(ex.type==='grammar')rGram(ex.data,c);
  else if(ex.type==='speed')startSpeed();
}
function makeMCItem(v){
  const dir=Math.random()>.5?'ar2en':'en2ar';
  const pool=ALL_VOCAB.filter(x=>x.ar!==v.ar);
  if(dir==='ar2en'){const opts=sh([v.en,...sh(pool).slice(0,3).map(x=>x.en)]);return{type:'mc',v,opts,ca:v.en,dir};}
  else{const c=v.ar+' ('+v.tr+')';const opts=sh([c,...sh(pool).slice(0,3).map(x=>x.ar+' ('+x.tr+')')]);return{type:'mc',v,opts,ca:c,dir};}
}
function bMC(vocab){
  if(vocab.length<4)vocab=[...vocab,...sh(ALL_VOCAB)].slice(0,40);
  // SRS-Sortierung: niedrigere Levels zuerst
  const sorted=buildSrsQueue(vocab);
  const limit=Math.min(sorted.length,20);
  return sorted.slice(0,limit).map(v=>makeMCItem(v));
}
function bMatch(vocab){if(vocab.length<4)vocab=sh(ALL_VOCAB);return[{type:'match',pairs:sh(vocab).slice(0,6)}];}
function bFill(){const p=gp(FILL);return sh(p).slice(0,7).map(e=>({type:'fill',data:e}));}
function bConj(){const p=gp(CONJ);return sh(p).slice(0,3).map(d=>({type:'conj',data:d}));}
function bOrder(){const p=gp(ORDER);return sh(p).slice(0,6).map(e=>({type:'order',data:e}));}
function bRP(){const p=gp(ROLEPLAY);return p.map(r=>({type:'roleplay',data:r}));}
function bGram(){const p=gp(GRAMMAR);return p.map(g=>({type:'grammar',data:g}));}
function rMC(ex,el){
  document.getElementById('ex-type-label').textContent='🎯 Multiple Choice';
  const v=ex.v,dir=ex.dir;
  el.innerHTML=`<div class="lesson-badge">${v.ls} · ${v.tp}</div>
  <div class="q-card"><div class="q-label">${dir==='ar2en'?'Was bedeutet dieses Wort?':'Welches Tounsi-Wort bedeutet:'}</div>
  ${dir==='ar2en'?`<div class="q-arabic">${v.ar}</div><div class="q-sub">${v.tr}</div>`:`<div class="q-text">${v.en}</div>`}
  </div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <div class="btn-row" id="btn-row"><button class="btn ghost" onclick="document.getElementById('hint-box').classList.toggle('visible')">Hinweis</button></div>
  <div class="q-hint" id="hint-box">${dir==='ar2en'?v.en+' — '+v.tr:v.ar+' ('+v.tr+')'}</div>`;
  const L=['A','B','C','D'],ce=document.getElementById('choices');
  ex.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='choice-btn';
    if(dir==='en2ar'){const ar=opt.split(' (')[0];const tr2=opt.includes('(')?opt.split(' (')[1].replace(')',''):'';btn.innerHTML=`<span class="choice-letter">${L[i]}</span><span style="direction:rtl;font-size:1.05rem;font-family:'Playfair Display',serif;color:var(--gold2)">${ar}</span><span style="font-size:.72rem;color:var(--muted);margin-left:.5rem">(${tr2})</span>`;}
    else btn.innerHTML=`<span class="choice-letter">${L[i]}</span>${opt}`;
    btn.onclick=()=>aMC(btn,opt===ex.ca,ex.ca,ce);ce.appendChild(btn);
  });
}
function aMC(btn,ok,ca,con){
  if(answered)return;answered=true;
  con.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){con.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent.includes(ca.split(' (')[0].trim()))b.classList.add('correct');});}
  ok?(score.c++,score.st++,score.t++):(score.w++,score.st=0,score.t++);
  // SRS update
  dbg('aMC: cIdx='+cIdx+' exList.length='+exList.length, 'ok');
  if(exList[cIdx] && exList[cIdx].v){
    dbg('Vokabel: '+exList[cIdx].v.tr, 'ok');
    srsAnswer(exList[cIdx].v, ok);
  } else {
    dbg('FEHLER: exList['+cIdx+'] hat kein .v', 'err');
    if(exList[cIdx]) dbg('Keys: '+Object.keys(exList[cIdx]).join(','), 'err');
  }
  updScore();showFb(ok,ok?'':ca);showNext();
}
function rMatch(ex,el){
  document.getElementById('ex-type-label').textContent='🔗 Zuordnung';
  mState={selL:null,selR:null,matched:[],pairs:ex.pairs};
  const left=sh(ex.pairs.map(p=>({id:p.ar,lb:p.ar})));
  const right=sh(ex.pairs.map(p=>({id:p.ar,lb:p.en})));
  el.innerHTML=`<div class="q-card"><div class="q-label">Ordne die Wörter zu</div></div>
  <div class="match-grid">
    <div class="match-col" id="match-left">${left.map(i=>`<div class="match-item arabic" id="ml-${ek(i.id)}" onclick="selM('left','${eq(i.id)}')">${i.lb}</div>`).join('')}</div>
    <div class="match-col" id="match-right">${right.map(i=>`<div class="match-item" id="mr-${ek(i.id)}" onclick="selM('right','${eq(i.id)}')">${i.lb}</div>`).join('')}</div>
  </div>
  <div class="feedback" id="feedback"></div><div class="btn-row" id="btn-row"></div>`;
}
function selM(side,id){
  if(mState.matched.includes(id))return;
  const k=ek(id);
  if(side==='left'){if(mState.selL){const p=document.getElementById('ml-'+ek(mState.selL));if(p)p.classList.remove('selected');}mState.selL=id;const e=document.getElementById('ml-'+k);if(e)e.classList.add('selected');}
  else{if(mState.selR){const p=document.getElementById('mr-'+ek(mState.selR));if(p)p.classList.remove('selected');}mState.selR=id;const e=document.getElementById('mr-'+k);if(e)e.classList.add('selected');}
  if(mState.selL&&mState.selR){
    const lE=document.getElementById('ml-'+ek(mState.selL)),rE=document.getElementById('mr-'+ek(mState.selR));
    if(mState.selL===mState.selR){
      if(lE){lE.classList.remove('selected');lE.classList.add('matched');}if(rE){rE.classList.remove('selected');rE.classList.add('matched');}
      mState.matched.push(mState.selL);score.c++;score.st++;score.t++;updScore();mState.selL=null;mState.selR=null;
      if(mState.matched.length===mState.pairs.length){showFb(true,'');showNext();}
    }else{
      if(lE)lE.classList.add('wrong-flash');if(rE)rE.classList.add('wrong-flash');
      score.w++;score.st=0;score.t++;updScore();
      setTimeout(()=>{if(lE){lE.classList.remove('wrong-flash','selected');}if(rE){rE.classList.remove('wrong-flash','selected');}mState.selL=null;mState.selR=null;},600);
    }
  }
}

  <div class="q-hint" id="fh">Antwort: ${d.a} (${d.at})</div>
  <div class="feedback" id="feedback"></div>`;
  window._fa=d.a;window._fat=d.at;
  const inp=document.getElementById('fill-input');
  if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter')chkFill();});inp.focus();}
}
function chkFill(){
  if(answered)return;answered=true;
  const inp=document.getElementById('fill-input'),val=inp.value.trim();
  const ok=normalize(val)===normalize(window._fa)||normalize(val)===normalize(window._fat);
  inp.classList.add(ok?'correct':'wrong');inp.disabled=true;
  ok?(score.c++,score.st++,score.t++):(score.w++,score.st=0,score.t++);
  // SRS update
  if(exList[cIdx]&&exList[cIdx].data&&exList[cIdx].data._vocab) srsAnswer(exList[cIdx].data._vocab,ok);
  updScore();showFb(ok,window._fa+' ('+window._fat+')');showNext();
}
function rConj(ex,el){
  document.getElementById('ex-type-label').textContent='📐 Konjugation';
  const d=ex.data;
  el.innerHTML=`<div class="lesson-badge">${d.ls}</div>
  <div class="q-card"><div class="q-label">Konjugiere das Verb</div><div class="q-text" style="font-size:1rem">${d.v}</div></div>
  <table class="conj-table"><thead><tr><th>Pronomen</th><th>Tounsi-Form</th><th>Transliteration</th></tr></thead>
  <tbody>${d.rows.map((r,i)=>`<tr><td>${r.p}</td><td><input class="conj-input" id="ci-${i}" data-a="${r.a}" data-t="${r.t}" placeholder="..." /></td><td style="color:var(--muted);font-size:.72rem">${r.t}</td></tr>`).join('')}</tbody></table>
  <div class="btn-row" id="btn-row">
    <button class="btn primary" onclick="chkConj()">Alle prüfen</button>
    <button class="btn ghost" onclick="showCA()">Antworten zeigen</button>
  </div><div class="feedback" id="feedback"></div>`;
}
function chkConj(){
  if(answered)return;answered=true;
  let c=0,t=0;
  document.querySelectorAll('.conj-input').forEach(inp=>{t++;const ok=normalize(inp.value)===normalize(inp.dataset.a)||normalize(inp.value)===normalize(inp.dataset.t);inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)c++;});
  score.c+=c;score.w+=(t-c);score.t+=t;if(c<t)score.st=0;else score.st++;updScore();
  const fb=document.getElementById('feedback');fb.className='feedback show '+(c===t?'correct':'wrong');
  fb.textContent=c+'/'+t+' richtig'+(c<t?' — rote Felder kontrollieren!':'');showNext();
}
function showCA(){
  document.querySelectorAll('.conj-input').forEach(inp=>{inp.value=inp.dataset.a;inp.classList.add('correct');inp.disabled=true;});
  const fb=document.getElementById('feedback');fb.className='feedback wrong show';fb.textContent='👁 Antworten angezeigt';showNext();
}
function rOrder(ex,el){
  document.getElementById('ex-type-label').textContent='🔀 Wortfolge';
  const d=ex.data;ordSel=[];
  const sw=sh([...d.w]);
  el.innerHTML=`<div class="lesson-badge">${d.ls}</div>
  <div class="q-card"><div class="q-label">Richtige Reihenfolge</div><div class="q-sub">${d.e}</div></div>
  <div class="answer-slots" id="ord-slots" onclick="rmLast()"><span style="font-size:.65rem;color:var(--muted)">← Klick zum Entfernen</span></div>
  <div class="word-bank" id="ord-bank">${sw.map((w,i)=>`<span class="word-chip" id="ow-${i}" onclick="addW(${i},'${eq(w)}')">${w}</span>`).join('')}</div>
  <div class="btn-row" id="btn-row">
    <button class="btn primary" onclick="chkOrder('${eq(d.c)}')">Prüfen</button>
    <button class="btn ghost" onclick="clrOrder()">Reset</button>
  </div><div class="feedback" id="feedback"></div>`;
}
function addW(idx,word){const chip=document.getElementById('ow-'+idx);if(!chip||chip.classList.contains('used'))return;chip.classList.add('used');ordSel.push({idx,word});updSlots();}
function rmLast(){if(!ordSel.length)return;const last=ordSel.pop();const c=document.getElementById('ow-'+last.idx);if(c)c.classList.remove('used');updSlots();}
function clrOrder(){ordSel=[];document.querySelectorAll('.word-chip').forEach(c=>c.classList.remove('used'));updSlots();}
function updSlots(){const s=document.getElementById('ord-slots');if(!s)return;if(!ordSel.length){s.innerHTML='<span style="font-size:.65rem;color:var(--muted)">← Klick zum Entfernen</span>';return;}s.innerHTML=ordSel.map(o=>`<span class="answer-slot">${o.word}</span>`).join('');}
function chkOrder(correct){
  if(answered)return;answered=true;
  const ans=ordSel.map(o=>o.word).join(' '),ok=ans===correct;
  ok?(score.c++,score.st++,score.t++):(score.w++,score.st=0,score.t++);
  updScore();showFb(ok,correct);showNext();
}
function rGram(data,el){
  document.getElementById('ex-type-label').textContent='📖 Grammatik';
  el.innerHTML=`<div class="lesson-badge">${data.ls}</div>
  <div class="grammar-box"><div class="grammar-title">${data.title}</div>
  <div class="grammar-text">${data.content.replace(/\n/g,'<br>')}</div>
  <div class="grammar-example"><div class="ar">${data.ear}</div><div style="margin-top:.3rem;font-size:.72rem;color:var(--muted)">${data.een}</div></div></div>
  <div class="btn-row" id="btn-row"><button class="btn primary" onclick="nxt()">Weiter →</button></div>`;
}
function rRP(data,el){
  document.getElementById('ex-type-label').textContent='🛒 Rollenspiel';
  rpScenario=data;rpStep=0;
  el.innerHTML=`<div class="q-card"><div class="q-label">${data.title}</div><div class="q-sub">Wähle die richtige Antwort.</div></div>
  <div class="chat" id="chat-log"></div><div id="chat-opts"></div>
  <div class="feedback" id="feedback"></div><div class="btn-row" id="btn-row"></div>`;
  rpRender();
}
function rpRender(){
  const step=rpScenario.steps[rpStep];
  const log=document.getElementById('chat-log');
  const b=document.createElement('div');b.className='chat-bubble vendor';
  b.innerHTML=`<div class="arabic">${step.vendor.ar}</div><div class="transl">${step.vendor.tr} — ${step.vendor.en}</div>`;
  log.appendChild(b);log.scrollTop=log.scrollHeight;
  const sOpts=sh(step.opts);
  document.getElementById('chat-opts').innerHTML=`<div class="chat-options">${sOpts.map(o=>`<button class="chat-opt" onclick="rpAns(this,${o.ok},'${eq(o.ar)}','${eq(o.en)}')"><span style="direction:rtl;display:block">${o.ar}</span><span style="font-size:.68rem;color:var(--muted)">${o.tr} — ${o.en}</span></button>`).join('')}</div>`;
}
function rpAns(btn,ok,ar,en){
  document.querySelectorAll('.chat-opt').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  ok?(score.c++,score.st++,score.t++):(score.w++,score.st=0,score.t++);
  updScore();
  const log=document.getElementById('chat-log');
  const b=document.createElement('div');b.className='chat-bubble user';
  b.innerHTML=`<span style="direction:rtl;display:block">${ar}</span><span style="font-size:.68rem;opacity:.7">${en}</span>`;
  log.appendChild(b);log.scrollTop=log.scrollHeight;
  rpStep++;
  if(rpStep>=rpScenario.steps.length){setTimeout(()=>{answered=true;showFb(ok,'');showNext();},600);}
  else setTimeout(rpRender,700);
}
function startSpeed(){
  const vocab=sh(gv());sIdx=0;sRight=0;sWrong=0;sTime=60;
  score={c:0,w:0,t:0,st:0};updScore();
  const srsVocab=buildSrsQueue(vocab.length>=5?vocab:sh(ALL_VOCAB));
  window._sv=srsVocab;
  window._svIdx=0;
  renderSpeed();
  sTimer=setInterval(()=>{sTime--;
    const f=document.getElementById('sp-fill'),te=document.getElementById('sp-time');
    if(f)f.style.width=(sTime/60*100)+'%';if(te)te.textContent=sTime+'s';
    if(sTime<=0){clearInterval(sTimer);sTimer=null;endSpeed();}
  },1000);
}
function renderSpeed(){
  const w=window._sv[sIdx%window._sv.length];
  document.getElementById('ex-type-label').textContent='⚡ Speed Round';
  document.getElementById('ex-progress').textContent=sIdx+' Karten';
  document.getElementById('exercise-content').innerHTML=`<div class="speed-card">
    <div class="speed-timer" id="sp-time">${sTime}s</div>
    <div class="speed-bar"><div class="speed-fill" id="sp-fill" style="width:${sTime/60*100}%"></div></div>
    <div class="speed-word">${w.ar}</div>
    <div style="font-size:.75rem;color:var(--muted);margin:.2rem 0 .5rem">${w.tr}</div>
    <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem">Kennst du die Bedeutung?</div>
    <div class="speed-btns">
      <button class="speed-btn yes" onclick="spAns(true)">✓ Ja</button>
      <button class="speed-btn no" onclick="spAns(false)">✗ Nein</button>
    </div>
    <div style="font-size:.8rem;color:var(--gold2);margin-top:1rem">${w.en}</div>
  </div>`;
  document.onkeydown=e=>{if(e.key==='y'||e.key==='ArrowUp')spAns(true);if(e.key==='n'||e.key==='ArrowDown')spAns(false);};
}
function spAns(ok){
  if(!sTimer&&sTime===0)return;
  ok?(sRight++,score.c++,score.st++):(sWrong++,score.w++,score.st=0);
  // SRS update im Speed-Modus
  const cv=window._sv[sIdx%window._sv.length];
  if(cv) srsAnswer(cv, ok).then(()=>updateLessonChips()); // async
  score.t++;sIdx++;updScore();if(sTime>0)renderSpeed();
}
function endSpeed(){
  document.onkeydown=null;
  document.getElementById('result-pct').textContent=sRight;
  document.getElementById('result-msg').textContent=sRight>=20?"Māshā'llāh! 🚀":sRight>=10?'Mlīḥ! 🎉':'Shwayya shwayya...';
  document.getElementById('result-sub').innerHTML=`<span style="color:var(--green)">✓ ${sRight} gewusst</span> · <span style="color:var(--red)">✗ ${sWrong} nicht gewusst</span><br>${sIdx} Karten in 60s`;
  document.getElementById('result-screen').classList.add('show');
}
function showRes(){
  const pct=score.t>0?Math.round(score.c/score.t*100):0;
  document.getElementById('result-pct').textContent=pct+'%';
  document.getElementById('result-msg').textContent=pct>=90?"Māshā'llāh! 🎉":pct>=70?'Mlīḥ barsha! 👏':pct>=50?'Shwayya shwayya...':'Yalla, 3awid!';
  document.getElementById('result-sub').innerHTML=`<span style="color:var(--green)">✓ ${score.c} richtig</span> · <span style="color:var(--red)">✗ ${score.w} falsch</span> · ${score.t} gesamt`;
  document.getElementById('result-screen').classList.add('show');
}
function restartExercise(){document.getElementById('result-screen').classList.remove('show');go();}
function closeResult(){document.getElementById('result-screen').classList.remove('show');}

</script>

<div id="debug-panel" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1612;border-top:2px solid #c9a84c;padding:.5rem;font-size:.6rem;font-family:monospace;color:#f0e8d8;max-height:40vh;overflow-y:auto;z-index:200;">
  <div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">
    <span style="color:#c9a84c;font-weight:700;">DEBUG</span>
    <button onclick="document.getElementById('debug-panel').style.display='none'" style="background:none;border:none;color:#c94c4c;cursor:pointer;font-size:.8rem;">✕</button>
  </div>
  <div id="debug-log"></div>
</div>
